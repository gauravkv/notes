<h1>
    Introduction to Java
</h1>

<div class="subtitle">
    Learn the fundamentals of Java programming and understand why
    Java is one of the most widely used programming languages in the world.
</div>

<div class="divider"></div>


<h2>
    What is Java?
</h2>

<p>
    Java is a high-level, class-based, object-oriented programming
    language that is designed to have as few implementation dependencies
    as possible. It was developed by James Gosling at Sun Microsystems
    and released in 1995.
</p>

<p>
    Java follows the principle of <strong>"Write Once, Run Anywhere"
    (WORA)</strong>, meaning that compiled Java code can run on all
    platforms that support Java without the need for recompilation.
</p>


<h2>
    Why Learn Java?
</h2>

<p>
    Java is one of the most popular programming languages in the world.
    It is used to build enterprise applications, Android apps, web
    applications, and much more. Java's strong typing, robust standard
    library, and platform independence make it an excellent choice for
    both beginners and professionals.
</p>

<ul class="topic-list">
    <li>Platform independent - runs on any device with a JVM</li>
    <li>Object-oriented programming language</li>
    <li>Strong memory management and garbage collection</li>
    <li>Large ecosystem of libraries and frameworks</li>
    <li>Widely used in enterprise and Android development</li>
    <li>Excellent community support and documentation</li>
</ul>


<h2>
    How Java Works
</h2>

<p>
    Java programs are first compiled into <strong>bytecode</strong>
    by the Java compiler (<b>javac</b>). This bytecode is then
    executed by the <strong>Java Virtual Machine (JVM)</strong>,
    which translates it into machine code specific to the operating
    system. This is what makes Java platform independent.
</p>

<div class="info">

<strong>Java Compilation Process:</strong><br><br>

Source Code (.java) &rarr; Compiler (javac) &rarr; Bytecode (.class) &rarr; JVM &rarr; Machine Code

</div>


<h2>
    Features of Java
</h2>

<ul class="topic-list">
    <li><strong>Simple:</strong> Java has a clean and easy-to-understand syntax based on C++.</li>
    <li><strong>Object-Oriented:</strong> Everything in Java is associated with classes and objects.</li>
    <li><strong>Platform Independent:</strong> Java bytecode runs on any platform with a JVM.</li>
    <li><strong>Secure:</strong> Java provides a secure environment with no explicit pointers and a security manager.</li>
    <li><strong>Robust:</strong> Java has strong memory management, exception handling, and type checking.</li>
    <li><strong>Multithreaded:</strong> Java supports multithreading for concurrent execution.</li>
</ul>


<h2>
    Your First Java Program
</h2>

<p>
    Here is the simplest Java program that prints a message to the
    screen. Every Java program must have a <strong>main</strong> method
    inside a <strong>class</strong>.
</p>

\${codeBlock(\`public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, World!");
    }
}\`, "Java")}


<div class="output-title">
    Output
</div>

<div class="output">
    Hello, World!
</div>


<div class="info">

<strong>Key Points:</strong><br>
Every Java application must have a <b>main()</b> method.
The class name must match the file name (Main.java).
Java is case-sensitive.

</div>

<h1>
    Installing Java (JDK)
</h1>

<div class="subtitle">
    Learn how to download and install the Java Development Kit (JDK)
    on your computer to start writing Java programs.
</div>

<div class="divider"></div>


<h2>
    What is JDK?
</h2>

<p>
    The <strong>Java Development Kit (JDK)</strong> is a software
    development environment used for developing Java applications.
    It includes the Java Runtime Environment (JRE), the Java compiler
    (javac), and other development tools.
</p>

<ul class="topic-list">
    <li><strong>JDK (Java Development Kit):</strong> Complete development kit for writing and running Java programs.</li>
    <li><strong>JRE (Java Runtime Environment):</strong> Provides the libraries and JVM needed to run Java programs.</li>
    <li><strong>JVM (Java Virtual Machine):</strong> Executes Java bytecode on any platform.</li>
</ul>


<h2>
    Steps to Install JDK
</h2>

<p>
    Follow these steps to install the JDK on your computer:
</p>

<ul class="topic-list">
    <li>Go to the official Oracle website or download OpenJDK.</li>
    <li>Download the JDK installer for your operating system (Windows, macOS, or Linux).</li>
    <li>Run the installer and follow the installation wizard.</li>
    <li>Set the <strong>JAVA_HOME</strong> environment variable to the JDK installation path.</li>
    <li>Add the JDK <strong>bin</strong> directory to your system <strong>PATH</strong>.</li>
</ul>


<h2>

</h2>

<p>

\${codeBlock(\`java -version

<h2>
    What is OOP?
</h2>

<p>
    <strong>Object-Oriented Programming (OOP)</strong> is a programming

    (fields/attributes) and code (methods). Java is an object-oriented
    language where everything is associated with classes and objects.
</p>


<h2>
    Four Pillars of OOP
</h2>

<ul class="topic-list">
    <li><strong>Encapsulation:</strong> Wrapping data and methods together in a single unit (class) and restricting direct access to some components.</li>
    <li><strong>Inheritance:</strong> A mechanism where one class acquires the properties and behaviors of another class.</li>
    <li><strong>Polymorphism:</strong> The ability of an object to take on many forms. The same method can behave differently based on the object.</li>
    <li><strong>Abstraction:</strong> Hiding complex implementation details and showing only the essential features to the user.</li>
</ul>


<h2>
    Classes and Objects
</h2>

<p>
    A <strong>class</strong> is a blueprint or template for creating
    objects. An <strong>object</strong> is an instance of a class.
</p>

\${codeBlock(\`// Class (Blueprint)

    String brand;

        Car car1 = new Car();
        car1.brand = "Toyota";
        car1.color = "Red";
        car1.speed = 120;

}\`, "Java")}

    <li><strong>Reusability:</strong> Classes can be reused across different programs.</li>
    <li><strong>Maintainability:</strong> Easier to update and maintain code.</li>
    <li><strong>Security:</strong> Data is protected through encapsulation.</li>
    <li><strong>Scalability:</strong> Easy to add new features without breaking existing code.</li>
</ul>

organizing your code. The four pillars (Encapsulation, Inheritance,

<h1>
    Encapsulation
</h1>

<div class="subtitle">
    Learn how to protect data by bundling it with methods and
    controlling access using encapsulation in Java.
</div>

<div class="divider"></div>


<h2>
    What is Encapsulation?
</h2>

<p>
    <strong>Encapsulation</strong> is the process of wrapping data
    (variables) and code (methods) together as a single unit. It
    restricts direct access to some of the object's components and
    provides controlled access through <strong>getter</strong> and
    <strong>setter</strong> methods.
</p>

<p>
    In Java, encapsulation is achieved by declaring variables as
    <strong>private</strong> and providing public getter and setter
    methods to access and modify them.
</p>


<h2>
    Without Encapsulation (Problem)
</h2>

\${codeBlock(\`class Student {
    String name;
    int age;
}

public class Main {
    public static void main(String[] args) {
        Student s = new Student();
        s.age = -5;  // Invalid value! No protection.
        System.out.println("Age: " + s.age);
    }
}\`, "Java")}


<h2>
    With Encapsulation (Solution)
</h2>

\${codeBlock(\`class Student {
    private String name;
    private int age;

    // Getter for name
    public String getName() {
        return name;
    }

    // Setter for name
    public void setName(String name) {
        this.name = name;
    }

    // Getter for age
    public int getAge() {
        return age;
    }

    // Setter for age with validation
    public void setAge(int age) {
        if (age > 0 && age < 120) {
            this.age = age;
        } else {
            System.out.println("Invalid age!");
        }
    }
}

public class Main {
    public static void main(String[] args) {
        Student s = new Student();
        s.setName("Rahul");
        s.setAge(20);

        System.out.println("Name: " + s.getName());
        System.out.println("Age: " + s.getAge());

        s.setAge(-5);  // Invalid! Will print error message.
    }
}\`, "Java")}


<div class="output-title">
    Output
</div>

<div class="output">
    Name: Rahul<br>
    Age: 20<br>
    Invalid age!
</div>


<h2>
    Access Modifiers
</h2>

<ul class="topic-list">
    <li><strong>private:</strong> Accessible only within the same class.</li>
    <li><strong>default (no modifier):</strong> Accessible within the same package.</li>
    <li><strong>protected:</strong> Accessible within the same package and subclasses.</li>
    <li><strong>public:</strong> Accessible from anywhere.</li>
</ul>


<h2>
    Benefits of Encapsulation
</h2>

<ul class="topic-list">
    <li>Data protection through access control.</li>
    <li>Flexibility to change internal implementation without affecting external code.</li>
    <li>Ability to add validation in setter methods.</li>
    <li>Better control over what data can be read or modified.</li>
</ul>


<div class="info">

<strong>Best Practice:</strong><br>
Always make instance variables <b>private</b> and provide
<b>public</b> getter and setter methods. This is a fundamental
principle of good Java design.

</div>

<h1>
    Inheritance
</h1>

<div class="subtitle">
    Learn how to create new classes based on existing classes using
    inheritance in Java.
</div>

<div class="divider"></div>


<h2>
    What is Inheritance?
</h2>

<p>
    <strong>Inheritance</strong> is a mechanism where one class
    (child/subclass) inherits the fields and methods of another class
    (parent/superclass). It promotes code reuse and establishes a
    relationship between classes.
</p>

<p>
    In Java, inheritance is achieved using the <strong>extends</strong>
    keyword.
</p>


<h2>
    Basic Inheritance Example
</h2>

\${codeBlock(\`// Parent class (Superclass)
class Animal {
    String name;

    void eat() {
        System.out.println(name + " is eating.");
    }

    void sleep() {
        System.out.println(name + " is sleeping.");
    }
}

// Child class (Subclass)
class Dog extends Animal {
    void bark() {
        System.out.println(name + " is barking.");
    }
}

public class Main {
    public static void main(String[] args) {
        Dog dog = new Dog();
        dog.name = "Buddy";
        dog.eat();    // Inherited from Animal
        dog.sleep();  // Inherited from Animal
        dog.bark();   // Own method
    }
}\`, "Java")}


<div class="output-title">
    Output
</div>

<div class="output">
    Buddy is eating.<br>
    Buddy is sleeping.<br>
    Buddy is barking.
</div>


<h2>
    Using super Keyword
</h2>

<p>
    The <strong>super</strong> keyword refers to the parent class.
    It is used to call the parent's constructor or methods.
</p>

\${codeBlock(\`class Person {
    String name;
    int age;

    Person(String name, int age) {
        this.name = name;
        this.age = age;
    }

    void display() {
        System.out.println("Name: " + name + ", Age: " + age);
    }
}

class Student extends Person {
    double marks;

    Student(String name, int age, double marks) {
        super(name, age);  // Call parent constructor
        this.marks = marks;
    }

    void display() {
        super.display();  // Call parent method
        System.out.println("Marks: " + marks);
    }
}

public class Main {
    public static void main(String[] args) {
        Student s = new Student("Rahul", 20, 85.5);
        s.display();
    }
}\`, "Java")}


<div class="output-title">
    Output
</div>

<div class="output">
    Name: Rahul, Age: 20<br>
    Marks: 85.5
</div>


<h2>
    Types of Inheritance in Java
</h2>

<ul class="topic-list">
    <li><strong>Single Inheritance:</strong> One child class inherits from one parent class.</li>
    <li><strong>Multilevel Inheritance:</strong> A chain of inheritance (A &rarr; B &rarr; C).</li>
    <li><strong>Hierarchical Inheritance:</strong> Multiple child classes inherit from one parent.</li>
</ul>

<p>
    <strong>Note:</strong> Java does NOT support multiple inheritance
    with classes (a class cannot extend two classes). However, it can
    be achieved using interfaces.
</p>


<h2>
    Multilevel Inheritance Example
</h2>

\${codeBlock(\`class Animal {
    void eat() {
        System.out.println("Animal eats food.");
    }
}

class Dog extends Animal {
    void bark() {
        System.out.println("Dog barks.");
    }
}

class Puppy extends Dog {
    void play() {
        System.out.println("Puppy plays.");
    }
}

public class Main {
    public static void main(String[] args) {
        Puppy p = new Puppy();
        p.eat();   // From Animal
        p.bark();  // From Dog
        p.play();  // Own method
    }
}\`, "Java")}


<div class="info">

<strong>Key Points:</strong><br>
Use <b>extends</b> for class inheritance.
Use <b>super()</b> to call parent constructor.
Use <b>super.method()</b> to call parent method.
Java supports single and multilevel inheritance but not multiple
inheritance with classes.

</div>

<h1>
    Polymorphism
</h1>

<div class="subtitle">
    Learn how polymorphism allows objects to take many forms in Java.
</div>

<div class="divider"></div>


<h2>
    What is Polymorphism?
</h2>

<p>
    <strong>Polymorphism</strong> means "many forms." In Java, it
    allows a single action to behave differently based on the
    object performing it. There are two types of polymorphism:
</p>

<ul class="topic-list">
    <li><strong>Compile-time Polymorphism:</strong> Achieved through method overloading.</li>
    <li><strong>Runtime Polymorphism:</strong> Achieved through method overriding.</li>
</ul>


<h2>
    Method Overriding (Runtime Polymorphism)
</h2>

<p>
    When a child class provides its own implementation of a method
    that is already defined in the parent class, it is called
    <strong>method overriding</strong>.
</p>

\${codeBlock(\`class Animal {
    void makeSound() {
        System.out.println("Animal makes a sound.");
    }
}

class Dog extends Animal {
    void makeSound() {
        System.out.println("Dog barks: Woof!");
    }
}

class Cat extends Animal {
    void makeSound() {
        System.out.println("Cat meows: Meow!");
    }
}

public class Main {
    public static void main(String[] args) {
        Animal a1 = new Dog();
        Animal a2 = new Cat();
        Animal a3 = new Animal();

        a1.makeSound();
        a2.makeSound();
        a3.makeSound();
    }
}\`, "Java")}


<div class="output-title">
    Output
</div>

<div class="output">
    Dog barks: Woof!<br>
    Cat meows: Meow!<br>
    Animal makes a sound.
</div>


<h2>
    Why is This Useful?
</h2>

<p>
    Polymorphism allows you to write code that works with the parent
    type but automatically uses the correct child implementation at
    runtime. This makes your code more flexible and extensible.
</p>

\${codeBlock(\`class Shape {
    double getArea() {
        return 0;
    }
}

class Circle extends Shape {
    double radius;

    Circle(double radius) {
        this.radius = radius;
    }

    double getArea() {
        return 3.14159 * radius * radius;
    }
}

class Rectangle extends Shape {
    double length, width;

    Rectangle(double length, double width) {
        this.length = length;
        this.width = width;
    }

    double getArea() {
        return length * width;
    }
}

public class Main {
    public static void main(String[] args) {
        Shape[] shapes = {
            new Circle(5),
            new Rectangle(4, 6),
            new Circle(3)
        };

        for (Shape s : shapes) {
            System.out.println("Area: " + s.getArea());
        }
    }
}\`, "Java")}


<div class="output-title">
    Output
</div>

<div class="output">
    Area: 78.53975<br>
    Area: 24.0<br>
    Area: 28.27431
</div>


<h2>
    @Override Annotation
</h2>

<p>
    Use the <strong>@Override</strong> annotation to indicate that a
    method is overriding a parent class method. This helps catch errors
    at compile time.
</p>

\${codeBlock(\`class Animal {
    void makeSound() {
        System.out.println("Some sound");
    }
}

class Dog extends Animal {
    @Override
    void makeSound() {
        System.out.println("Woof!");
    }
}\`, "Java")}


<div class="info">

<strong>Key Difference:</strong><br>
<b>Overloading</b> = same method name, different parameters (compile-time).<br>
<b>Overriding</b> = same method name and parameters in parent and child (runtime).

</div>

<h1>
    Interfaces
</h1>

<div class="subtitle">
    Learn how to define contracts for classes using interfaces in Java.
</div>

<div class="divider"></div>


<h2>
    What is an Interface?
</h2>

<p>
    An <strong>interface</strong> is a completely abstract type that
    defines a set of methods that a class must implement. It is like
    a contract that specifies what a class should do, without
    specifying how.
</p>

<p>
    Interfaces are declared using the <strong>interface</strong>
    keyword. A class uses the <strong>implements</strong> keyword
    to implement an interface.
</p>

    Basic Interface Example
</h2>

    void draw();  // abstract method (no body)
}

class Circle implements Drawable {
    public void draw() {
        System.out.println("Drawing a Circle.");
    }
}

class Rectangle implements Drawable {
    public void draw() {
        System.out.println("Drawing a Rectangle.");
    }
}

public class Main {
    public static void main(String[] args) {
        Drawable d1 = new Circle();
        Drawable d2 = new Rectangle();

        d1.draw();
        d2.draw();
    }
}\`, "Java")}

        car.honk();  // Uses default method
    }

<div class="info">

<strong>Interface vs Abstract Class:</strong><br>
<b>Interface:</b> Can only have abstract and default methods; supports multiple implementation; uses <b>implements</b>.<br>
<b>Abstract Class:</b> Can have both abstract and regular methods, constructors, and fields; single inheritance; uses <b>extends</b>.

exceptions: `

<h1>
    Exception Handling
</h1>

<div class="subtitle">
    Learn how to handle runtime errors gracefully using try-catch
    blocks in Java.
</div>

<div class="divider"></div>


<h2>
    What is an Exception?
</h2>

<p>
    An <strong>exception</strong> is an event that occurs during the
    execution of a program that disrupts the normal flow of instructions.
    Java provides a powerful mechanism to handle these runtime errors
    so the program does not crash unexpectedly.
</p>


<h2>
    try...catch Block
</h2>

<p>
    The <strong>try</strong> block contains code that might throw an
    exception. The <strong>catch</strong> block handles the exception.
</p>

\${codeBlock(\`public class Main {
    public static void main(String[] args) {
        try {
            int result = 10 / 0;
            System.out.println(result);
        } catch (ArithmeticException e) {
            System.out.println("Error: Cannot divide by zero!");
            System.out.println("Message: " + e.getMessage());
        }

        System.out.println("Program continues...");
    }
}\`, "Java")}


<div class="output-title">
    Output
</div>

<div class="output">
    Error: Cannot divide by zero!<br>
    Message: / by zero<br>
    Program continues...
</div>


<h2>
    Multiple catch Blocks
</h2>

\${codeBlock(\`public class Main {
    public static void main(String[] args) {
        try {
            int[] numbers = {1, 2, 3};
            System.out.println(numbers[10]);
        } catch (ArrayIndexOutOfBoundsException e) {
            System.out.println("Array index error: " + e.getMessage());
        } catch (Exception e) {
            System.out.println("General error: " + e.getMessage());
        }
    }
}\`, "Java")}


<div class="output-title">
    Output
</div>

<div class="output">
    Array index error: Index 10 out of bounds for length 3
</div>


<h2>
    finally Block
</h2>

<p>
    The <strong>finally</strong> block always executes, whether an
    exception occurred or not. It is used for cleanup code.
</p>

\${codeBlock(\`public class Main {
    public static void main(String[] args) {
        try {
            int result = 10 / 2;
            System.out.println("Result: " + result);
        } catch (ArithmeticException e) {
            System.out.println("Error: " + e.getMessage());
        } finally {
            System.out.println("Finally block always executes.");
        }
    }
}\`, "Java")}


<div class="output-title">
    Output
</div>

<div class="output">
    Result: 5<br>
    Finally block always executes.
</div>


<h2>
    throw and throws Keywords
</h2>

<p>
    Use <strong>throw</strong> to manually throw an exception. Use
    <strong>throws</strong> to declare that a method may throw an
    exception.
</p>

\${codeBlock(\`public class Main {

    static void checkAge(int age) throws IllegalArgumentException {
        if (age < 18) {
            throw new IllegalArgumentException("Age must be 18 or above.");
        }
        System.out.println("Access granted.");
    }

    public static void main(String[] args) {
        try {
            checkAge(15);
        } catch (IllegalArgumentException e) {
            System.out.println("Error: " + e.getMessage());
        }

        try {
            checkAge(20);
        } catch (IllegalArgumentException e) {
            System.out.println("Error: " + e.getMessage());
        }
    }
}\`, "Java")}


<div class="output-title">
    Output
</div>

<div class="output">
    Error: Age must be 18 or above.<br>
    Access granted.
</div>


<h2>
    Common Exception Types
</h2>

<ul class="topic-list">
    <li><strong>ArithmeticException:</strong> Division by zero.</li>
    <li><strong>NullPointerException:</strong> Accessing a null reference.</li>
    <li><strong>ArrayIndexOutOfBoundsException:</strong> Invalid array index.</li>
    <li><strong>NumberFormatException:</strong> Invalid number conversion.</li>
    <li><strong>IOException:</strong> Input/output errors.</li>
    <li><strong>ClassNotFoundException:</strong> Class not found at runtime.</li>
</ul>


<div class="info">

<strong>Best Practice:</strong><br>
Always catch specific exceptions before general ones.
Use <b>finally</b> for cleanup (closing files, connections).
Do not use exceptions for normal flow control.

</div>

collections: `

<h1>
    Collections Framework
</h1>

<div class="subtitle">
    Learn about Java's Collections Framework for storing and
    manipulating groups of objects.
</div>

<div class="divider"></div>


<h2>
    What is the Collections Framework?
</h2>

<p>
    The <strong>Collections Framework</strong> is a set of classes and
    interfaces in Java that provides a way to store and manipulate
    groups of objects. It is part of the <b>java.util</b> package and
    provides dynamic data structures that can grow and shrink in size.
</p>


<h2>
    ArrayList
</h2>

<p>
    An <strong>ArrayList</strong> is a resizable array. Unlike regular
    arrays, it can grow and shrink dynamically.
</p>

\${codeBlock(\`import java.util.ArrayList;

public class Main {
    public static void main(String[] args) {
        ArrayList<String> fruits = new ArrayList<>();

        // Adding elements
        fruits.add("Apple");
        fruits.add("Banana");
        fruits.add("Mango");
        fruits.add("Orange");

        System.out.println("Fruits: " + fruits);
        System.out.println("Size: " + fruits.size());
        System.out.println("First: " + fruits.get(0));

        // Remove an element
        fruits.remove("Banana");
        System.out.println("After removal: " + fruits);

        // Check if element exists
        System.out.println("Has Mango? " + fruits.contains("Mango"));
    }
}\`, "Java")}


<div class="output-title">
    Output
</div>

<div class="output">
    Fruits: [Apple, Banana, Mango, Orange]<br>
    Size: 4<br>
    First: Apple<br>
    After removal: [Apple, Mango, Orange]<br>
    Has Mango? true
</div>


<h2>
    Looping Through an ArrayList
</h2>

\${codeBlock(\`import java.util.ArrayList;

public class Main {
    public static void main(String[] args) {
        ArrayList<Integer> numbers = new ArrayList<>();
        numbers.add(10);
        numbers.add(20);
        numbers.add(30);
        numbers.add(40);

        // for-each loop
        for (int num : numbers) {
            System.out.println(num);
        }
    }
}\`, "Java")}


<h2>
    HashMap
</h2>

<p>
    A <strong>HashMap</strong> stores data in key-value pairs.
    Each key is unique and maps to a specific value.
</p>

\${codeBlock(\`import java.util.HashMap;

public class Main {
    public static void main(String[] args) {
        HashMap<String, Integer> marks = new HashMap<>();

        marks.put("Rahul", 85);
        marks.put("Priya", 92);
        marks.put("Amit", 78);

        System.out.println("Marks: " + marks);
        System.out.println("Rahul's marks: " + marks.get("Rahul"));

        // Remove an entry
        marks.remove("Amit");
        System.out.println("After removal: " + marks);
    }
}\`, "Java")}


<h2>
    HashSet
</h2>

<p>
    A <strong>HashSet</strong> stores unique elements only. Duplicate
    values are automatically ignored.
</p>

\${codeBlock(\`import java.util.HashSet;

public class Main {
    public static void main(String[] args) {
        HashSet<String> cities = new HashSet<>();

        cities.add("Mumbai");
        cities.add("Delhi");
        cities.add("Mumbai");  // Duplicate - ignored
        cities.add("Chennai");

        System.out.println("Cities: " + cities);
        System.out.println("Size: " + cities.size());
    }
}\`, "Java")}


<div class="output-title">
    Output
</div>

    Cities: [Chennai, Delhi, Mumbai]<br>
    Size: 3
</div>


<h2>
    Common Collection Types
</h2>

<ul class="topic-list">
    <li><strong>ArrayList:</strong> Ordered, allows duplicates, dynamic size.</li>
    <li><strong>LinkedList:</strong> Ordered, allows duplicates, efficient insert/delete.</li>
    <li><strong>HashMap:</strong> Key-value pairs, no duplicate keys.</li>
    <li><strong>HashSet:</strong> Unique elements only, unordered.</li>
    <li><strong>TreeSet:</strong> Unique elements, sorted order.</li>
    <li><strong>TreeMap:</strong> Key-value pairs, sorted by keys.</li>
</ul>


<div class="info">

<strong>Tip:</strong><br>
Use <b>ArrayList</b> when you need an ordered list with index access.
Use <b>HashMap</b> when you need key-value lookup.
Use <b>HashSet</b> when you need unique elements.

</div>

<div class="subtitle">
    Learn how to organize your Java classes into packages for better

<div class="divider"></div>


<h2>
    What is a Package?
</h2>

<p>
    A <strong>package</strong> in Java is a namespace that organizes
    classes and interfaces into groups. Packages help avoid naming

<p>
    Think of a package as a folder in your file system that contains
    related Java files.

<h2>
    Types of Packages
</h2>

<ul class="topic-list">
    <li><strong>Built-in Packages:</strong> Provided by Java (e.g., java.util, java.io, java.lang).</li>
    <li><strong>User-defined Packages:</strong> Created by the programmer to organize their code.</li>
</ul>


<h2>
    Importing Built-in Packages
</h2>

\${codeBlock(\`// Import a specific class

import java.util.ArrayList;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        ArrayList<String> list = new ArrayList<>();

        list.add("Java");
        list.add("Python");
        System.out.println(list);
    }
}\`, "Java")}


<h2>
    Creating a User-defined Package
</h2>

<p>
    To create your own package, use the <strong>package</strong>
    keyword at the top of your Java file.
</p>

\${codeBlock(\`// File: mypackage/Calculator.java

public class Calculator {
    public int add(int a, int b) {
        return a + b;

        return a - b;

</h2>

function codeBlock(code, language) {

    const id =
        "code_" +
        Math.random()
        .toString(36)
        .substring(2, 9);


    return `

        <div class="code-header">

            <span>
                ${language}
            </span>

            <button
                class="copy-btn"
                onclick="copyCode('${id}', this)">

                Copy

            </button>

        </div>


        <div class="code-box">

            <pre id="${id}">${escapeHTML(code.trim())}</pre>

        </div>

    `;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return text

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;");

}


/* =====================================================
   SHOW TOPIC
===================================================== */

function showTopic(topic, button) {


    document.getElementById("content").innerHTML =
        topics[topic];


    /* Remove active class */

    document
        .querySelectorAll(".topic")
        .forEach(function(item) {

            item.classList.remove("active");

        });


    /* Add active class */

    button.classList.add("active");


    /* Scroll content to top */

    document
        .querySelector(".content-area")
        .scrollTop = 0;


    /* Close mobile menu */

    if (window.innerWidth <= 700) {

        closeMenu();

    }

}


/* =====================================================
   COPY CODE
===================================================== */

function copyCode(id, button) {

    const code =
        document.getElementById(id).innerText;


    navigator.clipboard.writeText(code);


    button.innerText = "Copied!";


    setTimeout(function() {

        button.innerText = "Copy";

    }, 1500);

}


/* =====================================================
   OPEN / CLOSE MOBILE MENU
===================================================== */

function toggleMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.toggle("open");

    overlay.classList.toggle("show");

}


function closeMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.remove("open");

    overlay.classList.remove("show");

}


/* =====================================================

===================================================== */

showTopic(
    "intro",
    document.querySelector(".topic")
);
