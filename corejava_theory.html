<h1>
    Introduction to Java
</h1>

<div class="subtitle">
    Learn the fundamentals of Java programming and understand why
    Java is one of the most widely used programming languages in the world.
</div>

<div class="divider"></div>


<h2>
    What is Java?
</h2>

<p>
    Java is a high-level, class-based, object-oriented programming
    language that is designed to have as few implementation dependencies
    as possible. It was developed by James Gosling at Sun Microsystems
    and was first released in 1995.
</p>

<p>
    Java follows the principle of <strong>"Write Once, Run Anywhere"</strong>
    (WORA), meaning that compiled Java code can run on all platforms
    that support Java without the need for recompilation. This is made
    possible by the Java Virtual Machine (JVM).
</p>


<h2>
    Why Learn Java?
</h2>

<p>
    Java is one of the most popular programming languages in the world.
    It is used extensively in enterprise applications, Android app
    development, web applications, and much more. Learning Java opens
    up many career opportunities in software development.
</p>

<ul class="topic-list">
    <li>Platform independent - runs on any operating system with JVM</li>
    <li>Object-oriented programming language</li>
    <li>Strongly typed with robust error handling</li>
    <li>Huge community and extensive libraries</li>
    <li>Used in enterprise, mobile, web, and cloud applications</li>
    <li>Excellent job market and career opportunities</li>
</ul>


<h2>
    Where is Java Used?
</h2>

<p>
    Java is a versatile language used across many domains of technology.
    From building Android apps to powering large-scale enterprise systems,
    Java is everywhere in the modern software landscape.
</p>


<div class="info">

<strong>Java is used for:</strong><br><br>

Android App Development &bull; Enterprise Applications &bull;
Web Applications &bull; Cloud Computing &bull;
Big Data Technologies &bull; Internet of Things (IoT) &bull;
Desktop Applications &bull; Scientific Computing

</div>


<h2>
    Features of Java
</h2>

<ul class="topic-list">
    <li><strong>Simple:</strong> Java has a clean and easy-to-understand syntax based on C++.</li>
    <li><strong>Object-Oriented:</strong> Everything in Java revolves around objects and classes.</li>
    <li><strong>Platform Independent:</strong> Java bytecode runs on any platform with a JVM.</li>
    <li><strong>Secure:</strong> Java provides a secure environment with no explicit pointers.</li>
    <li><strong>Robust:</strong> Java has strong memory management and exception handling.</li>
    <li><strong>Multithreaded:</strong> Java supports concurrent execution of multiple threads.</li>
    <li><strong>Distributed:</strong> Java is designed for building distributed applications.</li>
</ul>


<h2>
    How Java Works
</h2>

<p>
    When you write a Java program, it goes through several steps before
    it runs. First, the source code (.java file) is compiled by the
    Java compiler (javac) into bytecode (.class file). Then, the Java
    Virtual Machine (JVM) interprets and executes the bytecode.
</p>

${codeBlock(`// Step 1: Write your code in a .java file

// Step 3: Run with java

<div class="info">

<strong>Tip:</strong><br>
Java is a compiled and interpreted language. The source code is first

<h1>
    Installing Java (JDK)
</h1>

<div class="subtitle">
    Learn how to download, install, and set up the Java Development Kit

</div>

<div class="divider"></div>


<h2>
    What is JDK?
</h2>

<p>
    The Java Development Kit (JDK) is a software development environment
    used for developing Java applications. It includes the Java Runtime
    Environment (JRE), the Java compiler (javac), and other tools needed
    to develop Java programs.
</p>

<ul class="topic-list">
    <li><strong>JDK (Java Development Kit):</strong> Full development kit with compiler and tools</li>
    <li><strong>JRE (Java Runtime Environment):</strong> Environment needed to run Java programs</li>
    <li><strong>JVM (Java Virtual Machine):</strong> Virtual machine that executes Java bytecode</li>
</ul>


<h2>

</h2>

<p>
    To start programming in Java, you need to install the JDK on your
    computer. Follow these steps to get started:
</p>

<ul class="topic-list">

<h2>
    Widening Casting (Implicit)
</h2>

<p>
    Widening casting is done automatically by Java when converting a
    smaller type to a larger type. This is safe because no data is lost.
    The order is: byte &rarr; short &rarr; int &rarr; long &rarr; float &rarr; double.
</p>

${codeBlock(`public class WideningDemo {
    public static void main(String[] args) {
        int myInt = 100;
        long myLong = myInt;       // int to long (automatic)
        float myFloat = myLong;    // long to float (automatic)
        double myDouble = myFloat; // float to double (automatic)

        System.out.println("int: " + myInt);
        System.out.println("long: " + myLong);
        System.out.println("float: " + myFloat);
        System.out.println("double: " + myDouble);

long: 100<br>
float: 100.0<br>
double: 100.0

<h2>
    Narrowing Casting (Explicit)
</h2>

<p>
    Narrowing casting must be done manually by placing the target type
    in parentheses in front of the value. This is needed when converting
    a larger type to a smaller type. Data may be lost in this process.
</p>

${codeBlock(`public class NarrowingDemo {
    public static void main(String[] args) {
        double myDouble = 9.78;

        System.out.println("int: " + myInt);  // Decimal part is lost

        float myFloat = 3.14f;
        int fromFloat = (int) myFloat;
        System.out.println("float to int: " + fromFloat);

        long myLong = 100000L;
        short myShort = (short) myLong;
        System.out.println("long to short: " + myShort);
    }
}`, "Java")}

<h2>

breakcontiunue: `

<h1>
    Break and Continue
</h1>

<div class="subtitle">
    Learn how to control loop execution using break and continue
    statements in Java.
</div>

<div class="divider"></div>


<h2>
    The break Statement
</h2>

<p>
    The <strong>break</strong> statement is used to exit a loop
    prematurely. When Java encounters a break statement inside a loop,
    it immediately terminates the loop and continues with the code
    after the loop.
</p>

${codeBlock(`public class BreakDemo {
    public static void main(String[] args) {
        for (int i = 1; i <= 10; i++) {
            if (i == 5) {
                System.out.println("Breaking at " + i);
                break;  // Exit the loop
            }
            System.out.println("Number: " + i);
        }
        System.out.println("Loop ended");
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Number: 1<br>
Number: 2<br>
Number: 3<br>
Number: 4<br>
Breaking at 5<br>
Loop ended
</div>


<h2>
    The continue Statement
</h2>

<p>
    The <strong>continue</strong> statement skips the current iteration
    of a loop and moves to the next iteration. Unlike break, it does
    not terminate the loop.
</p>

${codeBlock(`public class ContinueDemo {
    public static void main(String[] args) {
        for (int i = 1; i <= 10; i++) {
            if (i % 2 == 0) {
                continue;  // Skip even numbers
            }
            System.out.println("Odd number: " + i);
        }
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Odd number: 1<br>
Odd number: 3<br>
Odd number: 5<br>
Odd number: 7<br>
Odd number: 9
</div>


<h2>
    Break in While Loop
</h2>

<p>
    Break and continue work the same way in while loops as they do
    in for loops.
</p>

${codeBlock(`public class BreakWhile {
    public static void main(String[] args) {
        int i = 0;

        while (true) {
            if (i == 5) {
                break;
            }
            System.out.println("Value: " + i);
            i++;
        }
        System.out.println("Exited loop at i = " + i);
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Value: 0<br>
Value: 1<br>
Value: 2<br>
Value: 3<br>
Value: 4<br>
Exited loop at i = 5
</div>


<h2>
    Practical Example
</h2>

<p>
    Here is a practical example that uses both break and continue
    to search for a value in an array and skip certain elements.
</p>

${codeBlock(`public class SearchArray {
    public static void main(String[] args) {
        int[] numbers = {5, 12, 8, 3, 17, 9, 25, 6};
        int target = 17;
        boolean found = false;

        for (int i = 0; i < numbers.length; i++) {
            if (numbers[i] < 10) {
                continue;  // Skip numbers less than 10
            }
            System.out.println("Checking: " + numbers[i]);
            if (numbers[i] == target) {
                System.out.println("Found " + target + " at index " + i);
                found = true;
                break;
            }
        }

        if (!found) {
            System.out.println("Target not found");
        }
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Checking: 12<br>
Checking: 17<br>
Found 17 at index 4
</div>


<div class="info">

<strong>Tip:</strong><br>
Use <strong>break</strong> when you want to completely stop the loop.
Use <strong>continue</strong> when you want to skip the current iteration
and move to the next one. Both can be used in for, while, and do-while loops.

</div>

<p>
    Method overloading allows you to define multiple methods with the

    (different number, type, or order of parameters). Java determines

<p>
    Method overloading is a form of <strong>compile-time polymorphism</strong>

        return a + b;
    }

    // Method with three int parameters
    static int add(int a, int b, int c) {
        return a + b + c;
    }

    // Method with double parameters
    static double add(double a, double b) {
        return a + b;
    }

    public static void main(String[] args) {
        System.out.println("add(5, 10): " + add(5, 10));
        System.out.println("add(5, 10, 15): " + add(5, 10, 15));

    }

<h1>

</h1>

<div class="subtitle">

<div class="divider"></div>


<h2>
    What is Object-Oriented Programming?
</h2>

<p>
    Object-Oriented Programming (OOP) is a programming paradigm based
    on the concept of "objects" that contain data (fields/attributes)
    and code (methods). Java is a fully object-oriented language where
    almost everything revolves around classes and objects.
</p>

<p>
    OOP helps organize code into reusable, modular, and maintainable

<h2>
    The Four Pillars of OOP
</h2>

<ul class="topic-list">
    <li><strong>Encapsulation:</strong> Bundling data and methods together, hiding internal details</li>
    <li><strong>Inheritance:</strong> Creating new classes based on existing classes</li>
    <li><strong>Polymorphism:</strong> Objects can take many forms, same method behaves differently</li>
    <li><strong>Abstraction:</strong> Hiding complex details and showing only essential features</li>
</ul>


<h2>
    Classes and Objects Overview
</h2>

<p>
    A <strong>class</strong> is a blueprint or template that defines
    properties and behaviors. An <strong>object</strong> is an instance
    of a class - a concrete entity created from the blueprint.
</p>

${codeBlock(`// Class - the blueprint
class Car {

    String color;
    int speed;

    void accelerate() {
        speed += 10;
        System.out.println(brand + " speed: " + speed + " km/h");
    }

        System.out.println(brand + " slowed to: " + speed + " km/h");
    }

// Using the class

<h1>
    Encapsulation
</h1>

<div class="subtitle">

<div class="divider"></div>


<h2>
    What is Encapsulation?
</h2>

<p>
    Encapsulation is one of the four fundamental OOP concepts. It is
    the process of wrapping data (variables) and methods that operate
    on the data into a single unit (class), and restricting direct
    access to some of the object's components. This is achieved using
    <strong>access modifiers</strong> and <strong>getter/setter</strong>

</p>


<h2>

</h2>

<p>
    Java provides four access modifiers to control the visibility of
    classes, methods, and variables:
</p>

<ul class="topic-list">
    <li><strong>public:</strong> Accessible from anywhere</li>
    <li><strong>private:</strong> Accessible only within the same class</li>
    <li><strong>protected:</strong> Accessible within the same package and subclasses</li>
    <li><strong>default (no modifier):</strong> Accessible within the same package only</li>
</ul>


<h2>
    Implementing Encapsulation
</h2>

<p>
    To achieve encapsulation, make variables <strong>private</strong>
    and provide <strong>public getter and setter</strong> methods to
    access and modify them.
</p>

${codeBlock(`class BankAccount {
    // Private variables - cannot be accessed directly
    private String accountHolder;
    private double balance;

    // Constructor
    BankAccount(String name, double initialBalance) {
        this.accountHolder = name;
        this.balance = initialBalance;
    }

    // Getter for account holder
    public String getAccountHolder() {
        return accountHolder;
    }

    // Getter for balance
    public double getBalance() {
        return balance;
    }

    // Setter with validation
    public void deposit(double amount) {
        if (amount > 0) {
            balance += amount;
            System.out.println("Deposited: Rs." + amount);
        } else {
            System.out.println("Invalid deposit amount!");
        }
    }

    public void withdraw(double amount) {
        if (amount > 0 && amount <= balance) {
            balance -= amount;
            System.out.println("Withdrawn: Rs." + amount);
        } else {
            System.out.println("Invalid withdrawal!");
        }
    }
}

public class EncapsulationDemo {
    public static void main(String[] args) {
        BankAccount acc = new BankAccount("Alice", 10000);

        System.out.println("Holder: " + acc.getAccountHolder());
        System.out.println("Balance: Rs." + acc.getBalance());

        acc.deposit(5000);
        System.out.println("Balance: Rs." + acc.getBalance());

        acc.withdraw(3000);
        System.out.println("Balance: Rs." + acc.getBalance());

        acc.withdraw(20000);  // Invalid
    }
}`, "Java")}

<h2>

</h2>

<p>

    of an object to take different forms. It allows the same method
    name to behave differently depending on the object that calls it.

</p>

${codeBlock(`public class CompileTimePoly {
    static int multiply(int a, int b) {

<h2>

<h2>

</h2>

<p>

    subclasses to provide their own implementation of that method.

${codeBlock(`abstract class Shape {
    String color;

    Shape(String color) {
        this.color = color;
    }

    // Abstract methods
    abstract double area();
    abstract double perimeter();

    // Concrete method

        System.out.println("Color: " + color);
        System.out.printf("Area: %.2f%n", area());
        System.out.printf("Perimeter: %.2f%n", perimeter());
    }

class Circle extends Shape {

        super(color);

    }

<h2>

</h2>

<ul class="topic-list">
    <li>Cannot create objects of an abstract class</li>
    <li>Can have both abstract and non-abstract methods</li>
    <li>Can have constructors, fields, and static methods</li>

${codeBlock(`abstract class Employee {

    }

class PartTimeEmployee extends Employee {

public class EmployeeApp {

Use abstract classes when you want to provide a common base with some
shared implementation. If you only need to define a contract without

<h2>

</h2>

<p>

<ul class="topic-list">

</ul>


<h2>

</h2>

    The <strong>try</strong> block contains code that might throw an

${codeBlock(`class InsufficientFundsException extends Exception {

    It is a resizable array that can grow and shrink as needed.

${codeBlock(`import java.util.ArrayList;

<h2>

</h2>

    A <strong>HashMap</strong> stores data in key-value pairs. Each key

${codeBlock(`import java.util.HashMap;

public class HashMapDemo {
    public static void main(String[] args) {
        HashMap<String, Integer> ages = new HashMap<>();

<h2>

${codeBlock(`import java.util.HashSet;

<h2>

${codeBlock(`import java.util.ArrayList;

filehandling: `

<h1>
    File Handling
</h1>

<div class="subtitle">
    Learn how to read from and write to files in Java using
    the File, FileWriter, FileReader, and Scanner classes.
</div>

<div class="divider"></div>


<h2>
    What is File Handling?
</h2>

<p>
    File handling in Java allows you to create, read, write, and
    delete files. Java provides several classes for file operations,
    all found in the <strong>java.io</strong> and <strong>java.nio</strong>
    packages.
</p>

<ul class="topic-list">
    <li><strong>File:</strong> Represents a file or directory path</li>
    <li><strong>FileWriter:</strong> Writes text to a file</li>
    <li><strong>FileReader:</strong> Reads text from a file</li>
    <li><strong>BufferedReader:</strong> Reads text efficiently with buffering</li>
    <li><strong>Scanner:</strong> Can also read files</li>
</ul>


<h2>
    Creating and Writing to a File
</h2>

<p>
    Use <strong>FileWriter</strong> to write text to a file. If the
    file does not exist, it will be created automatically.
</p>

${codeBlock(`import java.io.FileWriter;
import java.io.IOException;

public class WriteFile {
    public static void main(String[] args) {
        try {
            FileWriter writer = new FileWriter("output.txt");
            writer.write("Hello, World!\\n");
            writer.write("Welcome to Java File Handling.\\n");
            writer.write("This is line 3.");
            writer.close();
            System.out.println("File written successfully!");
        } catch (IOException e) {
            System.out.println("Error: " + e.getMessage());
        }
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
File written successfully!
</div>


<h2>
    Reading from a File
</h2>

<p>
    Use <strong>Scanner</strong> or <strong>BufferedReader</strong>
    to read the contents of a file.
</p>

${codeBlock(`import java.io.File;
import java.io.FileNotFoundException;
import java.util.Scanner;

public class ReadFile {
    public static void main(String[] args) {
        try {
            File file = new File("output.txt");
            Scanner reader = new Scanner(file);

            while (reader.hasNextLine()) {
                String line = reader.nextLine();
                System.out.println(line);
            }

            reader.close();
        } catch (FileNotFoundException e) {
            System.out.println("File not found: " + e.getMessage());
        }
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Hello, World!<br>
Welcome to Java File Handling.<br>
This is line 3.
</div>


<h2>
    Reading with BufferedReader
</h2>

${codeBlock(`import java.io.BufferedReader;
import java.io.FileReader;
import java.io.IOException;

public class BufferedReaderDemo {
    public static void main(String[] args) {
        try {
            BufferedReader br = new BufferedReader(new FileReader("output.txt"));
            String line;
            int lineNumber = 1;

            while ((line = br.readLine()) != null) {
                System.out.println("Line " + lineNumber + ": " + line);
                lineNumber++;
            }

            br.close();
        } catch (IOException e) {
            System.out.println("Error: " + e.getMessage());
        }
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Line 1: Hello, World!<br>
Line 2: Welcome to Java File Handling.<br>
Line 3: This is line 3.
</div>


<h2>
    File Information
</h2>

<p>
    The <strong>File</strong> class provides methods to get information
    about files and directories.
</p>

${codeBlock(`import java.io.File;

public class FileInfo {
    public static void main(String[] args) {
        File file = new File("output.txt");

        if (file.exists()) {
            System.out.println("File name: " + file.getName());
            System.out.println("Absolute path: " + file.getAbsolutePath());
            System.out.println("File size: " + file.length() + " bytes");
            System.out.println("Can read: " + file.canRead());
            System.out.println("Can write: " + file.canWrite());
            System.out.println("Is file: " + file.isFile());
            System.out.println("Is directory: " + file.isDirectory());
        } else {
            System.out.println("File does not exist.");
        }
    }
}`, "Java")}


<h2>
    Deleting a File
</h2>

${codeBlock(`import java.io.File;

public class DeleteFile {
    public static void main(String[] args) {
        File file = new File("output.txt");

        if (file.delete()) {
            System.out.println("Deleted: " + file.getName());
        } else {
            System.out.println("Failed to delete file.");
        }
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Deleted: output.txt
</div>


<div class="info">

<strong>Tip:</strong><br>
Always close file resources after you are done using them. Use
<strong>try-with-resources</strong> (try with auto-close) for better
resource management. Always wrap file operations in try-catch blocks
to handle potential IOExceptions.

</div>

packages: `

<h1>
    Packages
</h1>

<div class="subtitle">
    Learn how to organize your Java code into packages for better
    structure, reusability, and access control.
</div>

<div class="divider"></div>


<h2>
    What is a Package?
</h2>

<p>
    A package in Java is a way to group related classes, interfaces,
    and sub-packages together. Packages help organize code, prevent
    naming conflicts, and provide access control. Think of a package
    like a folder in your file system.
</p>

<p>
    Java has two types of packages:
</p>

<ul class="topic-list">
    <li><strong>Built-in Packages:</strong> Provided by Java (java.lang, java.util, java.io)</li>
    <li><strong>User-defined Packages:</strong> Created by the programmer</li>
</ul>


<h2>
    Built-in Packages
</h2>

<p>
    Java comes with many built-in packages that provide useful classes
    and interfaces:
</p>

<ul class="topic-list">
    <li><strong>java.lang:</strong> Basic classes (String, Math, System) - imported automatically</li>
    <li><strong>java.util:</strong> Utility classes (ArrayList, HashMap, Scanner, Date)</li>
    <li><strong>java.io:</strong> Input/output classes (File, FileReader, BufferedReader)</li>
    <li><strong>java.math:</strong> Mathematical operations (BigInteger, BigDecimal)</li>
    <li><strong>java.net:</strong> Networking classes (URL, Socket)</li>
</ul>

${codeBlock(`// Importing specific classes
import java.util.ArrayList;
import java.util.Scanner;

// Importing all classes from a package
import java.util.*;

public class ImportDemo {
    public static void main(String[] args) {
        // Using ArrayList from java.util
        ArrayList<String> list = new ArrayList<>();
        list.add("Java");
        list.add("is");
        list.add("fun");
        System.out.println(list);

        // Using Math from java.lang (auto-imported)
        System.out.println("PI: " + Math.PI);
        System.out.println("Square root of 16: " + Math.sqrt(16));
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
[Java, is, fun]<br>
PI: 3.141592653589793<br>
Square root of 16: 4.0
</div>


<h2>
    Creating User-Defined Packages
</h2>

<p>
    You can create your own packages using the <strong>package</strong>
    keyword. The package statement must be the first line in the file.
</p>

${codeBlock(`// File: mypackage/Calculator.java
package mypackage;

public class Calculator {
    public int add(int a, int b) {
        return a + b;
    }

    public int subtract(int a, int b) {
        return a - b;
    }

    public int multiply(int a, int b) {
        return a * b;
    }

    public double divide(int a, int b) {
        if (b == 0) {
            throw new ArithmeticException("Cannot divide by zero");
        }
        return (double) a / b;
    }
}`, "Java")}

${codeBlock(`// File: Main.java (in default package or another package)
import mypackage.Calculator;

public class Main {
    public static void main(String[] args) {
        Calculator calc = new Calculator();

        System.out.println("10 + 5 = " + calc.add(10, 5));
        System.out.println("10 - 5 = " + calc.subtract(10, 5));
        System.out.println("10 * 5 = " + calc.multiply(10, 5));
        System.out.println("10 / 3 = " + calc.divide(10, 3));
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
10 + 5 = 15<br>
10 - 5 = 5<br>
10 * 5 = 50<br>
10 / 3 = 3.3333333333333335
</div>


<h2>
    Package Naming Conventions
</h2>

<ul class="topic-list">
    <li>Package names are written in all lowercase letters</li>
    <li>Use reverse domain name for unique names (com.company.project)</li>
    <li>Avoid using Java reserved words as package names</li>
    <li>Separate words with dots (com.myapp.utilities)</li>
</ul>

<h2>
    Access Control with Packages
</h2>

<p>
    Packages work with access modifiers to control visibility:
</p>

${codeBlock(`package mypackage;

public class AccessDemo {
    public int publicVar = 1;       // Accessible everywhere
    protected int protectedVar = 2; // Same package + subclasses
    int defaultVar = 3;             // Same package only
    private int privateVar = 4;     // Same class only

    public void showValues() {
        // All accessible within the same class
        System.out.println("Public: " + publicVar);

<h2>
    Static Import
</h2>

<p>
    Static import allows you to use static members (methods and fields)
    of a class without specifying the class name.
</p>

${codeBlock(`import static java.lang.Math.PI;
import static java.lang.Math.sqrt;
import static java.lang.Math.pow;

public class StaticImportDemo {
    public static void main(String[] args) {
        // Without static import: Math.PI, Math.sqrt()
        // With static import: PI, sqrt()

        System.out.println("PI: " + PI);
        System.out.println("Square root of 25: " + sqrt(25));
        System.out.println("2^10: " + pow(2, 10));

        double radius = 5;
        double area = PI * pow(radius, 2);
        System.out.println("Circle area: " + area);

}`, "Java")}

<div class="output-title">

<div class="output">
PI: 3.141592653589793<br>

</div>


<div class="info">

<strong>Tip:</strong><br>
Always organize your classes into meaningful packages. This makes your
code more maintainable and prevents naming conflicts. The
<strong>java.lang</strong> package is imported automatically, so you
do not need to import classes like String, System, or Math.

</div>

`

/* =====================================================
   CREATE CODE BLOCK
===================================================== */

function codeBlock(code, language) {

    const id =
        "code_" +
        Math.random()
        .toString(36)
        .substring(2, 9);


    return `

        <div class="code-header">

            <span>
                ${language}
            </span>

            <button
                class="copy-btn"
                onclick="copyCode('${id}', this)">

                Copy

            </button>

        </div>


        <div class="code-box">

            <pre id="${id}">${escapeHTML(code.trim())}</pre>

        </div>

    `;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return text

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;");

}


/* =====================================================
   SHOW TOPIC
===================================================== */

function showTopic(topic, button) {


    document.getElementById("content").innerHTML =
        topics[topic];


    /* Remove active class */

    document
        .querySelectorAll(".topic")
        .forEach(function(item) {

            item.classList.remove("active");

        });


    /* Add active class */

    button.classList.add("active");


    /* Scroll content to top */

    document
        .querySelector(".content-area")
        .scrollTop = 0;


    /* Close mobile menu */

    if (window.innerWidth <= 700) {

        closeMenu();

    }

}


/* =====================================================
   COPY CODE
===================================================== */

function copyCode(id, button) {

    const code =
        document.getElementById(id).innerText;


    navigator.clipboard.writeText(code);


    button.innerText = "Copied!";


    setTimeout(function() {

        button.innerText = "Copy";

    }, 1500);

}


/* =====================================================
   OPEN / CLOSE MOBILE MENU
===================================================== */

function toggleMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.toggle("open");

    overlay.classList.toggle("show");

}


function closeMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.remove("open");

    overlay.classList.remove("show");

}


/* =====================================================
   LOAD FIRST TOPIC
===================================================== */

showTopic(
    "intro",
    document.querySelector(".topic")
);
