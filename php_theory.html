/* =====================================================

intro: `

<h1>
    Introduction to PHP
</h1>

<div class="subtitle">
    Learn what PHP is, why it is used, and where it fits into
    modern web development.
</div>

<div class="divider"></div>


<h2>
    What is PHP?
</h2>

<p>
    PHP (recursive acronym for <strong>PHP: Hypertext Preprocessor</strong>)
    is a widely used, open-source, server-side scripting language
    designed primarily for web development. PHP code is executed on
    the server, and the result (usually plain HTML) is sent to the
    client's browser.
</p>

<p>
    PHP was created by Rasmus Lerdorf in 1994 and has since grown
    into one of the most popular server-side languages, powering a
    huge portion of the web, including platforms like WordPress,
    Facebook (in its early years), and countless custom web
    applications.
</p>


<h2>
    Why Learn PHP?
</h2>

<p>
    PHP is easy to learn for beginners, yet powerful enough to build
    large, complex, database-driven websites and applications. It
    integrates seamlessly with HTML and works especially well with
    MySQL databases.
</p>

<ul class="topic-list">
    <li>Free and open-source</li>
    <li>Runs on almost every operating system and web server</li>
    <li>Easy to embed directly inside HTML pages</li>
    <li>Excellent database support (MySQL, PostgreSQL, SQLite, etc.)</li>
    <li>Huge ecosystem of frameworks (Laravel, Symfony, CodeIgniter)</li>
    <li>Large community and abundant learning resources</li>
</ul>


<h2>
    A Simple PHP Example
</h2>

<p>
    PHP code is placed inside special tags <strong>&lt;?php ... ?&gt;</strong>
    and can be mixed freely with HTML markup.
</p>

${codeBlock(`<!DOCTYPE html>
<html>
<body>

<h1>My First PHP Page</h1>

<?php
    echo "Hello, World! This text was generated by PHP.";
?>

</body>
</html>`, "PHP")}

<div class="output-title">
    Output (rendered in browser)
</div>

<div class="output">
My First PHP Page<br>
Hello, World! This text was generated by PHP.
</div>


<div class="info">

<strong>Where is PHP used?</strong><br><br>

Content Management Systems (WordPress, Joomla, Drupal) &bull;
E-commerce platforms &bull; Web APIs &bull; Server-side form
processing &bull; Dynamic, database-driven websites

</div>

`,


/* =====================================================
   INSTALLING PHP
===================================================== */

installing: `

<h1>
    Installing PHP
</h1>

<div class="subtitle">
    Set up a PHP development environment on your computer so you can
    write and run PHP scripts locally.
</div>

<div class="divider"></div>


<h2>
    Ways to Install PHP
</h2>

<p>
    Because PHP is a server-side language, you need a way to run a
    web server alongside the PHP interpreter. The most common options
    are:
</p>

<ul class="topic-list">
    <li><strong>XAMPP:</strong> A free package that bundles Apache, MySQL, and PHP together (Windows, macOS, Linux)</li>
    <li><strong>WAMP:</strong> Similar bundle, but Windows only</li>
    <li><strong>MAMP:</strong> Similar bundle, popular on macOS</li>
    <li><strong>Native install:</strong> Installing PHP directly via a package manager</li>
</ul>


<h2>
    Installing on macOS / Linux (via package manager)
</h2>

<p>
    On macOS with Homebrew, or on most Linux distributions, PHP can
    be installed directly from the command line.
</p>

${codeBlock(`# macOS (Homebrew)
brew install php

# Ubuntu / Debian
sudo apt update
sudo apt install php

# Verify installation
php -v`, "Bash")}


<h2>
    Running PHP's Built-in Development Server
</h2>

<p>
    PHP ships with a lightweight built-in web server that is perfect
    for local development and testing. No Apache or Nginx setup is
    required.
</p>

${codeBlock(`# Navigate to your project folder
cd my-php-project

# Start the built-in server on port 8000
php -S localhost:8000`, "Bash")}

<div class="output-title">
    Output
</div>

<div class="output">
PHP 8.3.0 Development Server (http://localhost:8000) started
</div>

<p>
    Once the server is running, open
    <strong>http://localhost:8000</strong> in your browser to view
    your PHP files.
</p>


<div class="info">

<strong>Tip:</strong><br>
PHP files must be saved with the <strong>.php</strong> extension.
A file cannot be opened by double-clicking it in a browser and
expected to run &mdash; it must be served through a web server (or
the built-in PHP server) so the PHP interpreter can process it.

</div>

`,


/* =====================================================
   SYNTAX BASICS
===================================================== */

syntax: `

<h1>
    PHP Syntax Basics
</h1>

<div class="subtitle">
    Understand the basic structure of a PHP script, including tags,
    statements, and how PHP blends with HTML.
</div>

<div class="divider"></div>


<h2>
    PHP Tags
</h2>

<p>
    A PHP script starts with <strong>&lt;?php</strong> and ends with
    <strong>?&gt;</strong>. Everything between these tags is
    interpreted as PHP code; everything outside is treated as plain
    HTML and sent straight to the browser.
</p>

${codeBlock(`<?php
    echo "This line is PHP code";
?>

<p>This line is plain HTML.</p>

<?php
    echo "PHP code again";
?>`, "PHP")}


<h2>
    Statements and Semicolons

    echo $item->name . ": $" . $item->price;
?>`, "PHP")}

<div class="output-title">
    Output
</div>

<div class="output">
Notebook: $0
</div>


<h2>
    The Destructor: __destruct()
</h2>

<p>
    A destructor is called automatically when an object is destroyed
    or when the script ends. It is often used to release resources
    such as file handles or database connections.
</p>

${codeBlock(`<?php
    class Logger {
        public function __construct() {
            echo "Logger started<br>";
        }

        public function __destruct() {
            echo "Logger closed<br>";
        }
    }

    $log = new Logger();
    echo "Doing some work...<br>";
    unset($log); // triggers the destructor
?>`, "PHP")}

<div class="output-title">
    Output
</div>

<div class="output">
Logger started<br>
Doing some work...<br>
Logger closed
</div>


<div class="info">

<strong>Tip:</strong><br>
You rarely need to call the destructor manually &mdash; PHP invokes
it automatically for you, either when an object goes out of scope or
when the script finishes executing.

</div>

inheritance: `

<h1>

</h1>

<div class="subtitle">
    Allow one class to reuse and extend the properties and methods

<h2>

</h2>

<p>

    keyword.

${codeBlock(`<?php
    class Animal {

<h2>

</h2>

${codeBlock(`<?php
    class Employee {
        public function work() {
            echo "Working on general tasks<br>";

/* =====================================================
   INTERFACES AND ABSTRACT CLASSES

interfaces: `

<h1>
    Interfaces and Abstract Classes
</h1>

<div class="subtitle">
    Define contracts and partially implemented base classes to
    enforce consistent structure across related classes.
</div>

<div class="divider"></div>


<h2>
    Interfaces
</h2>

<p>
    An interface defines a contract of methods that implementing
    classes must provide, but it contains no implementation itself.
    A class can implement multiple interfaces.
</p>

${codeBlock(`<?php
    interface Shape {
        public function area(): float;
    }

    class Circle implements Shape {
        private $radius;

        public function __construct($radius) {
            $this->radius = $radius;
        }

        public function area(): float {
            return pi() * $this->radius ** 2;
        }
    }

    $c = new Circle(5);
    echo "Area: " . round($c->area(), 2);
?>`, "PHP")}

<div class="output-title">
    Output
</div>

<div class="output">
Area: 78.54
</div>


<h2>
    Abstract Classes
</h2>

<p>
    An abstract class cannot be instantiated directly and may mix
    fully implemented methods with abstract methods that
    subclasses must implement.
</p>

${codeBlock(`<?php
    abstract class Vehicle {
        abstract public function move(): string;

        public function describe() {
            echo "This vehicle moves by: " . $this->move() . "<br>";
        }
    }

    class Boat extends Vehicle {
        public function move(): string {
            return "sailing";
        }
    }

    $boat = new Boat();
    $boat->describe();
?>`, "PHP")}

<div class="output-title">
    Output
</div>

<div class="output">
This vehicle moves by: sailing
</div>


<h2>
    Interface vs Abstract Class
</h2>

<ul class="topic-list">
    <li>An interface has no implemented methods; an abstract class can mix both</li>
    <li>A class can implement multiple interfaces, but extend only one abstract class</li>
    <li>Interfaces define "can-do" contracts; abstract classes define "is-a" relationships</li>
</ul>


<div class="info">

<strong>Tip:</strong><br>
Attempting to create an object directly from an abstract class or an
interface (e.g. <strong>new Shape()</strong>) will trigger a fatal
error &mdash; only concrete classes can be instantiated.

</div>

`,

exceptions: `

<h1>
    Exception Handling
</h1>

<div class="subtitle">
    Handle runtime errors gracefully using try, catch, throw, and
    finally.
</div>

<div class="divider"></div>


<h2>
    try, catch, and throw
</h2>

<p>
    Code that might fail is placed inside a <strong>try</strong>
    block. If an error occurs, an exception is <strong>throw</strong>n
    and caught by a matching <strong>catch</strong> block, preventing
    the script from crashing.
</p>

${codeBlock(`<?php
    function divide($a, $b) {
        if ($b == 0) {
            throw new Exception("Division by zero is not allowed.");
        }
        return $a / $b;
    }

    try {
        echo divide(10, 2) . "<br>";
        echo divide(5, 0) . "<br>";
    } catch (Exception $e) {
        echo "Error caught: " . $e->getMessage();
    }
?>`, "PHP")}

<div class="output-title">
    Output
</div>

<div class="output">
5<br>
Error caught: Division by zero is not allowed.
</div>


<h2>
    The finally Block
</h2>

<p>
    Code inside <strong>finally</strong> always runs, whether an
    exception was thrown or not &mdash; useful for cleanup such as
    closing files or database connections.
</p>

${codeBlock(`<?php
    try {
        echo "Trying something risky...<br>";
        throw new Exception("Something went wrong!");
    } catch (Exception $e) {
        echo "Caught: " . $e->getMessage() . "<br>";
    } finally {
        echo "Cleanup always runs here.<br>";
    }
?>`, "PHP")}

<div class="output-title">
    Output
</div>

<div class="output">

Caught: Something went wrong!<br>

</div>


<h2>
    Custom Exception Classes
</h2>

${codeBlock(`<?php
    class InvalidAgeException extends Exception {}

        if ($age < 0) {
            throw new InvalidAgeException("Age cannot be negative.");
        }
        return "Valid age: $age";
    }

    try {
        echo checkAge(-5);
    } catch (InvalidAgeException $e) {
        echo "Custom exception caught: " . $e->getMessage();

?>`, "PHP")}

<div class="output-title">
    Output

<div class="output">
Custom exception caught: Age cannot be negative.
</div>


<div class="info">

<strong>Tip:</strong><br>
Create custom exception classes by extending PHP's built-in
<strong>Exception</strong> class when you need to distinguish
between different kinds of errors in a <strong>catch</strong> block.

</div>

phpmysql: `

<h1>
    PHP with MySQL (PDO / MySQLi)
</h1>

<div class="subtitle">
    Connect PHP to a MySQL database and perform queries safely using

<div class="divider"></div>


<h2>
    Connecting with PDO
</h2>

<p>
    PDO (PHP Data Objects) provides a consistent interface for
    accessing multiple database types and is the recommended way to
    work with databases in modern PHP.
</p>

${codeBlock(`<?php
    $host = "localhost";
    $db   = "school";
    $user = "root";

        $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);

    } catch (PDOException $e) {
        echo "Connection failed: " . $e->getMessage();
    }
?>`, "PHP")}

<div class="output-title">
    Output
</div>

<div class="output">
Connected successfully!
</div>


<h2>
    Inserting Data Safely with Prepared Statements
</h2>

<p>
    Prepared statements protect your application against SQL
    injection by separating the SQL structure from the actual data
    values.
</p>

${codeBlock(`<?php
    $stmt = $pdo->prepare("INSERT INTO students (name, age) VALUES (:name, :age)");
    $stmt->execute([
        "name" => "Farhan",
        "age"  => 19
    ]);

    echo "New student added with ID: " . $pdo->lastInsertId();
?>`, "PHP")}


<h2>
    Fetching Data
</h2>

${codeBlock(`<?php
    $stmt = $pdo->query("SELECT id, name, age FROM students");

    while ($row = $stmt->fetch(PDO::FETCH_ASSOC)) {
        echo $row['id'] . ": " . $row['name'] . " (" . $row['age'] . ")<br>";
    }
?>`, "PHP")}

<div class="output-title">
    Output
</div>

1: Farhan (19)<br>
2: Priya (21)
</div>


<h2>
    Using MySQLi (Object-Oriented)
</h2>

<p>
    MySQLi is another popular extension for connecting to MySQL,
    offering both procedural and object-oriented styles. It only
    supports MySQL, unlike PDO.
</p>

${codeBlock(`<?php
    $conn = new mysqli("localhost", "root", "", "school");

    if ($conn->connect_error) {
        die("Connection failed: " . $conn->connect_error);
    }

    $stmt = $conn->prepare("SELECT name FROM students WHERE age > ?");
    $minAge = 18;
    $stmt->bind_param("i", $minAge);
    $stmt->execute();
    $result = $stmt->get_result();

    while ($row = $result->fetch_assoc()) {
        echo $row['name'] . "<br>";
    }

    $conn->close();
?>`, "PHP")}


<div class="info">

<strong>Tip:</strong><br>
Always use prepared statements (with PDO or MySQLi) instead of
concatenating user input directly into SQL strings. This is the
single most important defense against SQL injection attacks.

</div>

`,

/* =====================================================
   CREATE CODE BLOCK
===================================================== */

function codeBlock(code, language) {

    const id =
        "code_" +
        Math.random()
        .toString(36)
        .substring(2, 9);


    return `

        <div class="code-header">

            <span>
                ${language}
            </span>

            <button
                class="copy-btn"
                onclick="copyCode('${id}', this)">

                Copy

            </button>

        </div>


        <div class="code-box">

            <pre id="${id}">${escapeHTML(code.trim())}</pre>

        </div>

    `;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return text

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;");

}


/* =====================================================
   SHOW TOPIC
===================================================== */

function showTopic(topic, button) {


    document.getElementById("content").innerHTML =
        topics[topic];


    /* Remove active class */

    document
        .querySelectorAll(".topic")
        .forEach(function(item) {

            item.classList.remove("active");

        });


    /* Add active class */

    button.classList.add("active");


    /* Scroll content to top */

    document
        .querySelector(".content-area")
        .scrollTop = 0;


    /* Close mobile menu */

    if (window.innerWidth <= 700) {

        closeMenu();

    }

}


/* =====================================================
   COPY CODE
===================================================== */

function copyCode(id, button) {

    const code =
        document.getElementById(id).innerText;


    navigator.clipboard.writeText(code);


    button.innerText = "Copied!";


    setTimeout(function() {

        button.innerText = "Copy";

    }, 1500);

}


/* =====================================================
   OPEN / CLOSE MOBILE MENU
===================================================== */

function toggleMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.toggle("open");

    overlay.classList.toggle("show");

}


function closeMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.remove("open");

    overlay.classList.remove("show");

}


/* =====================================================
   LOAD FIRST TOPIC
===================================================== */

showTopic("intro", document.querySelector(".topic"));
