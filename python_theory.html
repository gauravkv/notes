/* =====================================================

const topics = {


/* =====================================================
   INTRODUCTION
===================================================== */

intro: `

<h1>
    Introduction to Python
</h1>

<div class="subtitle">
    Learn the fundamentals of Python programming and understand why
    Python is one of the most popular programming languages.
</div>

<div class="divider"></div>


<h2>
    What is Python?
</h2>

<p>
    Python is a high-level, interpreted, general-purpose programming
    language known for its simple syntax, readability, and ease of use.
    It was created by Guido van Rossum and was first released in 1991.
</p>

<p>
    Python allows programmers to write programs using simple and
    understandable syntax. This makes it an excellent language for
    beginners as well as experienced developers.
</p>


<h2>
    Why Learn Python?
</h2>

<p>
    Python is easy to learn because its syntax is close to the English
    language. It requires fewer lines of code compared to many other
    programming languages, allowing developers to focus more on solving
    problems rather than dealing with complex syntax.
</p>

<ul class="topic-list">
    <li>Simple and easy-to-understand syntax</li>
    <li>Beginner-friendly programming language</li>
    <li>Large collection of libraries and frameworks</li>
    <li>Supports object-oriented and functional programming</li>
    <li>Widely used in modern software development</li>
</ul>


<h2>
    Where is Python Used?
</h2>

<p>
    Python is a versatile language and is used in many different areas
    of technology. Developers use Python to build websites, analyze
    data, create artificial intelligence applications, automate tasks,
    and develop desktop and scientific applications.
</p>


<div class="info">

<strong>Python is used for:</strong><br><br>

Web Development • Data Science •
Artificial Intelligence • Machine Learning •
Automation • Data Analysis •
Desktop Applications • Scientific Computing

</div>


<h2>
    Features of Python
</h2>

<ul class="topic-list">
    <li><strong>Easy to Learn:</strong> Python has a simple and readable syntax.</li>
    <li><strong>Interpreted:</strong> Python code is executed by an interpreter.</li>
    <li><strong>Portable:</strong> Python programs can run on different operating systems.</li>
    <li><strong>Open Source:</strong> Python is freely available to use and distribute.</li>
    <li><strong>Extensible:</strong> Python can work with other languages such as C and C++.</li>
    <li><strong>Large Community:</strong> Python has a huge developer community and many learning resources.</li>
</ul>


<h2>
    Your First Python Program
</h2>

<p>
    Let's start with the simplest Python program. The
    <strong>print()</strong> function is used to display information
    on the screen.
</p>

${codeBlock(`print("Hello, World!")`, "Python")}


<div class="output-title">
    Output
</div>

<div class="output">
    Hello, World!
</div>


<div class="info">

<strong>Tip:</strong><br>
Python uses indentation to define blocks of code.
Proper indentation is an important part of writing
clean and correct Python programs.

</div>

`,


/* =====================================================
   VARIABLES
===================================================== */

variables: `


<h1>
    Variables
</h1>

<div class="subtitle">
    Learn how to store, update, and work with data using variables in Python.
</div>

<div class="divider"></div>


<h2>
    What is a Variable?
</h2>

<p>
    A variable is a name used to store a value in a program.
    It acts like a container that holds data such as numbers,
    text, or other types of information.
</p>

<p>
    In Python, you do not need to declare the data type of a
    variable separately. Python automatically determines the
    data type based on the value assigned to it.
</p>


<h2>
    Creating a Variable
</h2>

<p>
    A variable is created when you assign a value to a name
    using the <strong>=</strong> assignment operator.
</p>

${codeBlock(`name = "Rahul"
age = 20
salary = 25000`, "Python")}


<h2>
    Example
</h2>

<p>
    In the following example, the variables
    <strong>name</strong> and <strong>age</strong> store
    a student's name and age.
</p>

${codeBlock(`name = "Rahul"
age = 20

print(name)
print(age)`, "Python")}


<div class="output-title">
    Output
</div>

<div class="output">
    Rahul<br>
    20
</div>


<h2>
    Assigning Multiple Variables
</h2>

<p>
    Python allows you to assign values to multiple variables
    in a single statement.
</p>

${codeBlock(`name, age, city = "Rahul", 20, "Mumbai"

print(name)
print(age)
print(city)`, "Python")}


<div class="output-title">
    Output
</div>

<div class="output">
    Rahul<br>
    20<br>
    Mumbai
</div>


<h2>
    Changing the Value of a Variable
</h2>

<p>
    A variable's value can be changed during program execution.
    When a new value is assigned, the variable stores the new value.
</p>

${codeBlock(`age = 20
print(age)

age = 21
print(age)`, "Python")}


<div class="output-title">
    Output
</div>

<div class="output">
    20<br>
    21
</div>


<h2>
    Variables Can Store Different Types of Data
</h2>

<p>
    Python variables can store different types of values,
    including integers, floating-point numbers, strings,
    and Boolean values.
</p>

${codeBlock(`age = 20
price = 99.50
name = "Rahul"
is_student = True

print(age)
print(price)
print(name)
print(is_student)`, "Python")}


<div class="output-title">
    Output
</div>

<div class="output">
    20<br>
    99.5<br>
    Rahul<br>
    True
</div>


<h2>
    Rules for Naming Variables
</h2>

<p>
    Python has some rules that should be followed while
    creating variable names.
</p>

<ul class="topic-list">
    <li>A variable name must start with a letter or underscore.</li>
    <li>A variable name cannot start with a number.</li>
    <li>Variable names can contain letters, numbers, and underscores.</li>
    <li>Spaces are not allowed in variable names.</li>
    <li>Python variable names are case-sensitive.</li>
    <li>Python keywords cannot be used as variable names.</li>
</ul>


<h2>
    Valid and Invalid Variable Names
</h2>

${codeBlock(`student_name = "Rahul"
age2 = 20
_total = 500

# Invalid examples:
# 2age = 20
# student name = "Rahul"
# class = "Python"`, "Python")}


<div class="info">

<strong>Remember:</strong><br>
Python is case-sensitive. This means
<strong>name</strong>, <strong>Name</strong>, and
<strong>NAME</strong> are treated as three different variables.

</div>


<h2>
    Checking the Data Type
</h2>

<p>
    The <strong>type()</strong> function can be used to find
    the data type stored in a variable.
</p>

${codeBlock(`age = 20
name = "Rahul"
price = 99.50

print(type(age))
print(type(name))
print(type(price))`, "Python")}


<div class="output-title">
    Output
</div>

<div class="output">
    &lt;class 'int'&gt;<br>
    &lt;class 'str'&gt;<br>
    &lt;class 'float'&gt;
</div>


<div class="info">

<strong>Key Point:</strong><br>
A variable is simply a name that refers to a value.
Python automatically manages the data type of the value
stored in the variable.

</div>



`,

<h1>
    Data Types
</h1>

<div class="subtitle">
    Different types of data available in Python.
</div>

<div class="divider"></div>


<h2>
    What is a Data Type?
</h2>

<p>
    A data type defines the kind of value that a variable can store.
    Python has several built-in data types that are used to represent
    different kinds of data such as numbers, text, collections, and
    logical values.
</p>

<p>

<h2>
    1. Integer (int)
</h2>

<h2>
    2. Float (float)
</h2>

    decimal points. It is commonly used for prices, percentages,
    measurements, and calculations.
</p>

<h2>

</h2>

    A complex number contains a real part and an imaginary part.

print(type(number))`, "Python")}


<h2>
    4. String (str)
</h2>

<h2>
    5. Boolean (bool)
</h2>

</p>

<h2>

</h2>

<p>

<h2>
    7. Tuple (tuple)

<h2>

<h2>

</h2>

<h2>
    10. Range (range)
</h2>

<p>

</p>

${codeBlock(`numbers = range(1, 6)

<h2>
    11. NoneType (None)
</h2>

    used when a variable currently has no value or when a function
    does not return a value.
</p>

<h2>

<p>

    can be changed after creation. Others are <b>immutable</b>, meaning
    they cannot be changed after creation.
</p>

<ul>
    <li><b>Mutable:</b> list, set, dictionary</li>
    <li><b>Immutable:</b> int, float, complex, bool, str, tuple, range</li>
</ul>


<h2>

</h2>

<p>

    different kinds of information. Numeric types are used for numbers,

<h1>

</h1>

<div class="subtitle">

<div class="divider"></div>


<h2>
    What is a Conditional Statement?
</h2>

<p>
    Conditional statements are used to make decisions in a Python
    program. They allow a program to execute different blocks of
    code depending on whether a condition is <b>True</b> or
    <b>False</b>.
</p>

<p>
    Conditional statements are commonly used with comparison and

</p>

    Output

</div>


<h2>
    Types of Conditional Statements
</h2>

<p>
    Python provides several ways to implement conditions:
</p>

<ul>
    <li>if statement</li>
    <li>if-else statement</li>
    <li>if-elif-else statement</li>
    <li>Nested if statement</li>
    <li>Conditional Expression (Ternary Operator)</li>
</ul>


<h2>
    1. if Statement
</h2>

<p>
    The <b>if</b> statement is used to execute a block of code
    only when a specified condition is <b>True</b>.
</p>

<p>
    If the condition is False, the code inside the if block is
    skipped.
</p>

<h3>
    Syntax
</h3>

${codeBlock(`if condition:
    # code to execute`, "Python")}


<h3>
    Example
</h3>

${codeBlock(`age = 20

if age >= 18:
    print("You are an adult.")`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
You are an adult.
</div>


<h3>
    Example with a False Condition
</h3>

${codeBlock(`age = 15

if age >= 18:
    print("You are an adult.")

print("Program completed.")`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
Program completed.
</div>

<p>
    Since <b>age >= 18</b> is False, the statement inside the
    if block is not executed.
</p>


<h2>

</h2>

<p>

<h2>
    2. if-else Statement
</h2>

<p>
    The <b>if-else</b> statement is used when there are two possible
    outcomes. If the condition is True, the if block executes.
    Otherwise, the else block executes.
</p>

<h3>
    Syntax
</h3>

${codeBlock(`if condition:
    # code when condition is True
else:
    # code when condition is False`, "Python")}

    Example
</h3>

<h2>

<p>

    multiple conditions to check.
</p>

<p>
    Python checks the conditions from top to bottom. As soon as
    it finds a True condition, its block is executed and the
    remaining conditions are skipped.
</p>

</h3>

<h2>

    <b>value == True</b>. Values can be directly used in a condition.

<ul>

<h2>

    <li>Python uses indentation to define code blocks.</li>

    <li>A nested if is an if statement placed inside another if statement.</li>

<h2>
    Summary

<p>
    Conditional statements allow Python programs to make decisions

<h1>

<div class="subtitle">

<h2>
    What is a Loop?
</h2>

<p>
    A loop is used to execute a block of code repeatedly.
    Instead of writing the same code multiple times, we can
    use a loop to repeat the code automatically.
</p>

<p>
    Loops are especially useful when working with collections,
    processing data, displaying repeated output, and performing
    repetitive calculations.
</p>

<h2>
    Types of Loops in Python
</h2>

<p>
    Python mainly provides two types of loops:
</p>

<ul>
    <li><b>for loop</b> – Used to iterate over a sequence or collection.</li>
    <li><b>while loop</b> – Used to repeat code while a condition is True.</li>
</ul>

<p>
    Python also provides loop control statements such as
    <b>break</b>, <b>continue</b>, and <b>pass</b>.
</p>


<h2>
    1. for Loop
</h2>

<p>
    A <b>for loop</b> is used to iterate over a sequence such as
    a list, tuple, string, set, dictionary, or range of numbers.

    Syntax
</h3>

    Simple Example
</h3>

1<br>

3<br>
4

<p>
    Here, <b>i</b> takes each value from the range one by one.
</p>


<h2>

<h2>
    2. while Loop
</h2>

<p>
    A <b>while loop</b> repeatedly executes a block of code

<h3>
    Syntax

<h2>

</h2>

<p>
    When using a while loop, make sure the condition eventually
    becomes False. Otherwise, the loop can become an

    It continues running until the program is stopped.
</p>

<p>
    Infinite loops can be useful for programs that need to keep
    running until a specific event occurs, but they must be
    controlled carefully.
</p>

<h2>
    3. break Statement

<h2>

<h2>
    What is a Function?
</h2>

<p>
    A function is a reusable block of code designed to perform
    a specific task. Functions help make programs organized,
    readable, and easier to maintain.
</p>

<p>
    Instead of writing the same code repeatedly, we can define
    it once inside a function and call it whenever required.
</p>


<h2>
    Creating a Function
</h2>

<p>
    In Python, a function is created using the <b>def</b> keyword,
    followed by the function name and parentheses.
</p>

<h3>
    Syntax
</h3>

${codeBlock(`def function_name():
    # code to execute`, "Python")}


<h2>
    Example
</h2>

${codeBlock(`def greet():

greet()`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
Hello, welcome to Python!
</div>

<p>
    The function is defined using <b>def</b> and is executed
    when we call it using its name followed by parentheses.
</p>


<h2>
    Function with Parameters
</h2>

<p>
    Parameters allow us to pass data to a function.
</p>

${codeBlock(`def greet(name):
    print("Hello", name)

greet("Rahul")`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
Hello Rahul
</div>


<h2>
    Multiple Parameters
</h2>

<p>
    A function can accept multiple parameters.
</p>

${codeBlock(`def add(a, b):
    print(a + b)

add(10, 20)`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
30
</div>


<h2>
    Return Value
</h2>

<p>
    A function can return a result using the <b>return</b>
    statement. The returned value can then be stored in a
    variable or used in another expression.
</p>

${codeBlock(`def add(a, b):
    return a + b

result = add(10, 20)

print(result)`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
30
</div>


<h2>
    Why Use Functions?
</h2>

<ul>
    <li>Functions reduce code repetition.</li>
    <li>They make programs easier to understand.</li>
    <li>They make code reusable.</li>
    <li>They make debugging and maintenance easier.</li>
    <li>Large programs can be divided into smaller tasks.</li>
</ul>


<h2>
    Important Points to Remember
</h2>

<ul>
    <li>Use <b>def</b> to define a function.</li>
    <li>A function runs when it is called.</li>
    <li>Parameters receive values passed to a function.</li>
    <li>Arguments are the actual values passed during the function call.</li>
    <li>Use <b>return</b> to send a value back from a function.</li>
    <li>Function code must be properly indented.</li>
</ul>


<h2>
    Summary
</h2>

<p>
    Functions are reusable blocks of code that perform specific
    tasks. They help reduce repetition and make Python programs
    more organized and easier to maintain. Functions can accept
    parameters and can return values using the <b>return</b>
    statement.
</p>

`,

functiontypes: `

<h1>
    Types of Functions
</h1>

<div class="subtitle">
    Understand different ways functions can be defined and used in Python.
</div>

<div class="divider"></div>


<h2>
    Types of Functions
</h2>

<p>
    Functions in Python can be categorized based on whether they
    accept parameters and whether they return a value.
</p>

<p>
    The four common types are:
</p>

<ul>
    <li>Function without parameters and without return value</li>
    <li>Function with parameters and without return value</li>
    <li>Function without parameters and with return value</li>
    <li>Function with parameters and with return value</li>
</ul>


<h2>
    1. Function Without Parameters and Without Return Value
</h2>

<p>
    This type of function does not accept any values and does not
    return a result. It simply performs a specific task.
</p>

${codeBlock(`def greet():
    print("Hello, Python!")

greet()`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
Hello, Python!
</div>


<h2>
    2. Function With Parameters and Without Return Value
</h2>

<p>
    This type of function accepts values through parameters but
    does not return a value. It usually performs an operation
    and displays the result.
</p>

${codeBlock(`def greet(name):
    print("Hello", name)

greet("Rahul")`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
Hello Rahul
</div>


<h3>
    Example with Multiple Parameters
</h3>

${codeBlock(`def add(a, b):
    print("Sum =", a + b)

add(10, 20)`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
Sum = 30
</div>


<h2>
    3. Function Without Parameters and With Return Value
</h2>

<p>
    This type of function does not accept any parameters but
    returns a value using the <b>return</b> statement.
</p>

${codeBlock(`def get_number():
    return 100

result = get_number()

print(result)`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
100
</div>


<h2>
    4. Function With Parameters and With Return Value
</h2>

<p>
    This type of function accepts parameters and returns a result.
    It is one of the most commonly used forms of functions.
</p>

${codeBlock(`def add(a, b):
    return a + b

result = add(10, 20)

print(result)`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
30
</div>


<h3>
    Example
</h3>

${codeBlock(`def calculate_area(length, width):
    return length * width

area = calculate_area(10, 5)

print("Area =", area)`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
Area = 50
</div>


<h2>
    Function with Default Parameters
</h2>

<p>
    A parameter can have a default value. If no value is provided
    when the function is called, the default value is used.
</p>

${codeBlock(`def greet(name="User"):
    print("Hello", name)

greet()
greet("Rahul")`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
Hello User<br>
Hello Rahul
</div>


<h2>
    Function with Keyword Arguments
</h2>

<p>
    Keyword arguments allow us to pass values using the parameter
    names. This makes function calls easier to understand.
</p>

${codeBlock(`def student(name, age):
    print("Name:", name)
    print("Age:", age)

student(age=20, name="Rahul")`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
Name: Rahul<br>
Age: 20
</div>


<h2>
    Function with Variable Number of Arguments
</h2>

<p>
    Python allows a function to accept any number of positional
    arguments using <b>*args</b>.
</p>

${codeBlock(`def add(*numbers):
    total = 0

    for number in numbers:
        total += number

    return total

print(add(10, 20))
print(add(10, 20, 30, 40))`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
30<br>
100
</div>


<h2>
    Function with **kwargs
</h2>

<p>
    The <b>**kwargs</b> syntax allows a function to accept multiple
    keyword arguments. These arguments are stored as a dictionary.
</p>

${codeBlock(`def student_info(**details):
    for key, value in details.items():
        print(key, ":", value)

student_info(
    name="Rahul",
    age=20,
    course="Python"
)`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
name : Rahul<br>
age : 20<br>
course : Python
</div>


<h2>
    Lambda Function
</h2>

<p>
    A <b>lambda function</b> is a small anonymous function.
    It can contain an expression and return its result.
</p>

<h3>
    Syntax
</h3>

${codeBlock(`lambda arguments: expression`, "Python")}

<h3>
    Example
</h3>

${codeBlock(`square = lambda x: x * x

print(square(5))`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
25
</div>


<h2>
    Recursive Function
</h2>

<p>
    A <b>recursive function</b> is a function that calls itself.
    Recursion is useful for solving problems that can be divided
    into smaller versions of the same problem.
</p>

${codeBlock(`def countdown(n):
    if n == 0:
        print("Done!")
    else:
        print(n)
        countdown(n - 1)

countdown(3)`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
3<br>
2<br>
1<br>
Done!
</div>


<h2>
    Summary
</h2>

<p>
    Python functions can be used in many different ways. They can
    accept parameters, return values, use default or keyword
    arguments, and even accept a variable number of arguments.
    Python also supports special forms such as lambda functions
    and recursive functions.
</p>

`,

lists: `

<h1>

</h1>

<div class="subtitle">

<div class="divider"></div>


<h2>
    What is a List?
</h2>

<p>

    in a single variable. Lists can contain different types of
    data such as numbers, strings, Boolean values, and even other

<h2>

</h2>

<p>

${codeBlock(`numbers = [10, 20, 30, 40, 50]

print(numbers)`, "Python")}

    Output
</div>

<div class="output">

</div>


<h2>

</h2>

${codeBlock(`student = ["Rahul", 20, 85.5, True]

print(student)`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
['Rahul', 20, 85.5, True]
</div>


<h2>

</h2>

[]

Banana<br>
Mango

<h2>

<p>

${codeBlock(`fruits = ["Apple", "Banana", "Mango"]

print(fruits[-1])
print(fruits[-2])`, "Python")}

    Output

Banana

print(fruits)`, "Python")}

</div>

print(fruits)`, "Python")}

<div class="output-title">

['Apple', 'Mango']
</div>


<h3>

<h2>

<p>

    is <b>immutable</b>. This means that once a tuple is created,
    its elements cannot be changed, added, or removed.

<h2>
    Creating a Tuple
</h2>

<h2>

<h2>

<h2>

3

2

<h2>

/* =====================================================
   CREATE CODE BLOCK
===================================================== */

function codeBlock(code, language) {

    const id =
        "code_" +
        Math.random()
        .toString(36)
        .substring(2, 9);


    return `

        <div class="code-header">

            <span>
                ${language}
            </span>

            <button
                class="copy-btn"
                onclick="copyCode('${id}', this)">

                Copy

            </button>

        </div>


        <div class="code-box">

            <pre id="${id}">${escapeHTML(code.trim())}</pre>

        </div>

    `;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return text

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;");

}


/* =====================================================
   SHOW TOPIC
===================================================== */

function showTopic(topic, button) {


    document.getElementById("content").innerHTML =
        topics[topic];


    /* Remove active class */

    document
        .querySelectorAll(".topic")
        .forEach(function(item) {

            item.classList.remove("active");

        });


    /* Add active class */

    button.classList.add("active");


    /* Scroll content to top */

    document
        .querySelector(".content-area")
        .scrollTop = 0;


    /* Close mobile menu */

    if (window.innerWidth <= 700) {

        closeMenu();

    }

}


/* =====================================================
   COPY CODE
===================================================== */

function copyCode(id, button) {

    const code =
        document.getElementById(id).innerText;


    navigator.clipboard.writeText(code);


    button.innerText = "Copied!";


    setTimeout(function() {

        button.innerText = "Copy";

    }, 1500);

}


/* =====================================================
   OPEN / CLOSE MOBILE MENU
===================================================== */

function toggleMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.toggle("open");

    overlay.classList.toggle("show");

}


function closeMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.remove("open");

    overlay.classList.remove("show");

}


/* =====================================================
   LOAD FIRST TOPIC
===================================================== */

showTopic(
    "intro",
    document.querySelector(".topic")
);
