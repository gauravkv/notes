intro: `

<h1>
    Introduction to MySQL
</h1>

<div class="subtitle">
    Learn what MySQL is, why it is used, and understand the core
    concepts of relational database management systems.
</div>

<div class="divider"></div>


<h2>
    What is MySQL?
</h2>

<p>
    MySQL is an open-source <strong>Relational Database Management
    System (RDBMS)</strong> that uses Structured Query Language (SQL)
    to store, manage, and retrieve data. It was originally created by
    MySQL AB and is now owned and maintained by Oracle Corporation.
</p>

<p>
    MySQL stores data in the form of tables, which are organized into
    rows and columns, similar to a spreadsheet. It is one of the most
    widely used databases in the world and powers many popular
    websites and applications.
</p>


<h2>
    What is an RDBMS?
</h2>

<p>
    A Relational Database Management System organizes data into
    tables that can be linked, or related, to one another based on
    common data. Each table consists of rows (records) and columns
    (fields), and relationships between tables are created using
    keys such as primary keys and foreign keys.
</p>

<ul class="topic-list">
    <li>Data is stored in structured tables</li>
    <li>Tables can be related using keys</li>
    <li>Ensures data integrity through constraints</li>
    <li>Supports powerful querying using SQL</li>
</ul>


<h2>
    Why Use MySQL?
</h2>

<p>
    MySQL is popular because it is free, fast, reliable, and easy to
    use. It works well for small applications as well as large,
    high-traffic websites and enterprise systems.
</p>

<div class="info">

<strong>MySQL is used in:</strong><br><br>

Web Applications • E-commerce Platforms •
Content Management Systems • Data Warehousing •
Enterprise Applications • Mobile App Backends

</div>


<h2>
    Features of MySQL
</h2>

<ul class="topic-list">
    <li><strong>Open Source:</strong> Free to use, modify, and distribute.</li>
    <li><strong>Fast and Reliable:</strong> Optimized for high performance and speed.</li>
    <li><strong>Cross-Platform:</strong> Runs on Windows, Linux, and macOS.</li>
    <li><strong>Secure:</strong> Provides user authentication and privilege management.</li>
    <li><strong>Scalable:</strong> Can handle small projects to large-scale applications.</li>
    <li><strong>Supports SQL Standards:</strong> Compatible with standard SQL syntax.</li>
</ul>


<h2>
    MySQL vs Other Databases
</h2>

<p>
    MySQL is often compared with other database systems such as
    PostgreSQL, Oracle, and SQL Server. While all of them use SQL,
    they differ in licensing, performance characteristics, and the
    advanced features they provide.
</p>

${codeBlock(`-- A simple example of a SQL statement used across
-- most relational databases, including MySQL
SELECT first_name, last_name
FROM employees
WHERE department = 'Sales';`, "SQL")}


<div class="info">

<strong>Note:</strong><br>
MySQL is the "M" in the popular LAMP stack
(Linux, Apache, MySQL, PHP/Python/Perl), which is widely
used for building dynamic web applications.

</div>

`,


installing: `

<h1>
    Installing MySQL
</h1>

<div class="subtitle">
    Learn how to install MySQL, connect using MySQL Workbench, and
    run your first commands from the command line.
</div>

<div class="divider"></div>


<h2>
    Downloading MySQL
</h2>

<p>
    MySQL can be downloaded from the official MySQL website
    (dev.mysql.com/downloads). It provides installers for Windows,
    macOS, and Linux. The MySQL Installer bundles the MySQL Server,
    MySQL Workbench, and other useful tools together.
</p>

<ul class="topic-list">
    <li>MySQL Community Server – the core database engine (free)</li>
    <li>MySQL Workbench – a visual tool for designing and managing databases</li>
    <li>MySQL Shell – an advanced command-line client</li>
</ul>


<h2>
    Installation Steps
</h2>

<p>
    During installation, you will be asked to set a root password.
    This password is used to log in as the administrator account
    and should be kept safe, since the root user has full control
    over the database server.
</p>

<ul class="topic-list">
    <li>Download the MySQL Installer for your operating system</li>
    <li>Choose "Server only" or "Full" setup type</li>
    <li>Configure the port (default is 3306)</li>
    <li>Set a strong root password</li>
    <li>Complete the installation and start the MySQL service</li>
</ul>


<h2>
    Connecting via Command Line
</h2>

<p>
    Once MySQL is installed, you can connect to the server using the
    <strong>mysql</strong> command-line client.
</p>

${codeBlock(`mysql -u root -p`, "SQL")}

<div class="output-title">
    Output
</div>

<div class="output">
    Enter password: ********<br>
    Welcome to the MySQL monitor...<br>
    mysql&gt;
</div>


<h2>
    Using MySQL Workbench
</h2>

<p>
    MySQL Workbench is a graphical tool that allows you to design
    databases, write and run SQL queries, manage users, and view
    server performance without typing every command manually.
</p>

<ul class="topic-list">
    <li>Create a new connection with host, port, username, and password</li>
    <li>Use the SQL editor to write and execute queries</li>
    <li>Visually design tables using the schema browser</li>
    <li>Export and import data using built-in wizards</li>
</ul>


<h2>
    Basic Setup Commands
</h2>

<p>
    After connecting, you can check the MySQL version and see the
    list of existing databases to confirm the installation was
    successful.
</p>

${codeBlock(`SELECT VERSION();

SHOW DATABASES;`, "SQL")}

<div class="output-title">
    Output
</div>

<div class="output">
    +-----------+<br>
    | VERSION() |<br>
    +-----------+<br>
    | 8.0.36    |<br>
    +-----------+
</div>


<div class="info">

<strong>Tip:</strong><br>
Always remember your root password. If you forget it, you
will need to reset it using MySQL's safe mode recovery process.

</div>

where: `

<h1>
    WHERE Clause
</h1>

<div class="subtitle">
    Learn how to filter rows returned by a query using comparison,
    range, list, pattern, and NULL conditions.
</div>

<div class="divider"></div>


<h2>
    Filtering with Comparison Operators
</h2>

<p>
    The <strong>WHERE</strong> clause filters rows based on a
    condition. Only rows that satisfy the condition are included
    in the result.
</p>

${codeBlock(`SELECT * FROM students WHERE age = 20;

SELECT * FROM students WHERE age != 20;

SELECT * FROM students WHERE fee > 40000;

SELECT * FROM students WHERE fee <= 42000;`, "SQL")}

<div class="output-title">
    Output
</div>

<div class="output">
    +------------+--------------+------+-------------------+----------+<br>
    | student_id | name         | age  | course            | fee      |<br>
    +------------+--------------+------+-------------------+----------+<br>
    | 1          | Rahul Sharma | 20   | Computer Science  | 45000.00 |<br>
    +------------+--------------+------+-------------------+----------+
</div>


<h2>
    BETWEEN Operator
</h2>

<p>
    <strong>BETWEEN</strong> checks whether a value lies within a
    range, inclusive of both boundary values.
</p>

${codeBlock(`SELECT * FROM students
WHERE fee BETWEEN 40000 AND 45000;`, "SQL")}


<h2>
    IN Operator
</h2>

<p>
    <strong>IN</strong> checks whether a value matches any value in
    a given list, avoiding multiple OR conditions.
</p>

${codeBlock(`SELECT * FROM students
WHERE course IN ('Computer Science', 'Electronics');`, "SQL")}


<h2>
    LIKE Operator
</h2>

<p>
    <strong>LIKE</strong> is used for pattern matching with text.
    The <strong>%</strong> symbol matches any sequence of
    characters, and <strong>_</strong> matches a single character.
</p>

${codeBlock(`SELECT * FROM students WHERE name LIKE 'R%';

SELECT * FROM students WHERE name LIKE '%a';

SELECT * FROM students WHERE name LIKE '_aran';`, "SQL")}


<h2>
    IS NULL / IS NOT NULL
</h2>

<p>
    Since NULL represents "no value", you cannot compare it using
    <strong>=</strong>. Instead, use <strong>IS NULL</strong> or
    <strong>IS NOT NULL</strong>.
</p>

${codeBlock(`SELECT * FROM students WHERE age IS NULL;

SELECT * FROM students WHERE age IS NOT NULL;`, "SQL")}


<h2>
    Combining Conditions with AND / OR
</h2>

${codeBlock(`SELECT * FROM students
WHERE course = 'Computer Science' AND fee > 40000;

SELECT * FROM students
WHERE course = 'Civil Engineering' OR age < 20;`, "SQL")}


<div class="info">

<strong>Tip:</strong><br>
Use parentheses when combining AND and OR in the same query
to make sure the conditions are evaluated in the order you
intend.

</div>

WHERE student_id = 3;`, "SQL")}

    Updating Multiple Rows
</h2>

    Any row that matches the WHERE condition will be updated. If

SET fee = fee + 2000
WHERE course = 'Computer Science';`, "SQL")}

    DELETE Statement
</h1>

<div class="subtitle">
    Learn how to remove rows from a table, and understand the
    difference between DELETE and TRUNCATE.
</div>

<div class="divider"></div>


<h2>
    Deleting Specific Rows
</h2>

<p>
    The <strong>DELETE FROM</strong> statement removes rows that
    match a WHERE condition.
</p>

${codeBlock(`DELETE FROM students
WHERE student_id = 6;`, "SQL")}

<div class="output-title">
    Output
</div>

<div class="output">

</div>

    Deleting Multiple Rows
</h2>

${codeBlock(`DELETE FROM students
WHERE course = 'Civil Engineering';`, "SQL")}


<h2>
    Deleting All Rows
</h2>

<p>
    Omitting the WHERE clause deletes every row in the table,
    while keeping the table structure intact.
</p>

${codeBlock(`DELETE FROM students;`, "SQL")}


<h2>
    TRUNCATE vs DELETE
</h2>

<p>
    <strong>TRUNCATE TABLE</strong> also removes all rows from a
    table, but it works differently from DELETE.
</p>

${codeBlock(`TRUNCATE TABLE students;`, "SQL")}

<ul class="topic-list">
    <li>TRUNCATE is generally faster than DELETE for removing all rows</li>
    <li>TRUNCATE resets the AUTO_INCREMENT counter back to 1</li>
    <li>TRUNCATE cannot be used with a WHERE clause</li>
    <li>DELETE can be rolled back inside a transaction; TRUNCATE usually cannot</li>
    <li>DELETE fires row-level triggers; TRUNCATE does not</li>
</ul>


<div class="info">

<strong>Tip:</strong><br>
Use DELETE when you need to remove specific rows or want the
operation to be logged and reversible. Use TRUNCATE when you
want to quickly empty an entire table.

</div>

</h2>

${codeBlock(`SELECT course, COUNT(*) AS total_students
FROM students
GROUP BY course
ORDER BY total_students DESC;`, "SQL")}


<div class="info">

<strong>Tip:</strong><br>
Every column in the SELECT list that is not inside an
aggregate function must also appear in the GROUP BY clause.

</div>

having: `

<h1>
    HAVING Clause
</h1>

<div class="subtitle">
    Learn how to filter grouped results, and understand the
    difference between WHERE and HAVING.
</div>

<div class="divider"></div>


<h2>
    What is HAVING?
</h2>

<p>
    The <strong>HAVING</strong> clause filters groups created by
    GROUP BY, based on the result of an aggregate function. Unlike
    WHERE, HAVING is evaluated after grouping happens.
</p>


<h2>
    Filtering Groups
</h2>

<p>
    The following query returns only the courses that have more
    than one student enrolled.
</p>

${codeBlock(`SELECT course, COUNT(*) AS total_students
FROM students
GROUP BY course
HAVING COUNT(*) > 1;`, "SQL")}

<div class="output-title">
    Output
</div>

<div class="output">
    +-------------------+----------------+<br>
    | course            | total_students |<br>
    +-------------------+----------------+<br>
    | Computer Science  | 2              |<br>
    +-------------------+----------------+
</div>


<h2>
    HAVING with SUM / AVG
</h2>

${codeBlock(`SELECT course, AVG(fee) AS avg_fee
FROM students
GROUP BY course
HAVING AVG(fee) > 40000;`, "SQL")}


<h2>
    WHERE vs HAVING
</h2>

<p>
    WHERE filters individual rows <strong>before</strong> grouping
    takes place, while HAVING filters groups
    <strong>after</strong> aggregation.
</p>

${codeBlock(`SELECT course, COUNT(*) AS total_students
FROM students
WHERE age >= 20
GROUP BY course
HAVING COUNT(*) >= 1;`, "SQL")}

<ul class="topic-list">
    <li>WHERE cannot use aggregate functions like COUNT() or SUM()</li>
    <li>HAVING is designed specifically to filter aggregated results</li>
    <li>WHERE runs first, then GROUP BY, then HAVING</li>
</ul>


<div class="info">

<strong>Tip:</strong><br>
Use WHERE to reduce rows early for better performance, and use
HAVING only when the condition depends on an aggregate
calculation.

</div>

`,


joins: `

<h1>
    Joins
</h1>

<div class="subtitle">
    Learn how to combine rows from two or more tables using INNER,
    LEFT, RIGHT, CROSS, and self joins.
</div>

<div class="divider"></div>


<h2>
    Why Use Joins?
</h2>

<p>
    In a relational database, data is often split across multiple
    related tables to avoid duplication. <strong>Joins</strong>
    combine rows from two or more tables based on a related
    column, usually a foreign key.
</p>

${codeBlock(`CREATE TABLE departments (
    dept_id INT PRIMARY KEY,
    dept_name VARCHAR(50)
);

CREATE TABLE employees (
    emp_id INT PRIMARY KEY,
    emp_name VARCHAR(50),
    dept_id INT,
    FOREIGN KEY (dept_id) REFERENCES departments(dept_id)
);`, "SQL")}


<h2>
    INNER JOIN
</h2>

<p>
    <strong>INNER JOIN</strong> returns only the rows that have
    matching values in both tables.
</p>

${codeBlock(`SELECT e.emp_name, d.dept_name
FROM employees e
INNER JOIN departments d ON e.dept_id = d.dept_id;`, "SQL")}

<div class="output-title">
    Output
</div>

<div class="output">
    +-----------+-------------+<br>
    | emp_name  | dept_name   |<br>
    +-----------+-------------+<br>
    | Aditya    | Sales       |<br>
    | Kavya     | Marketing   |<br>
    +-----------+-------------+
</div>


<h2>
    LEFT JOIN
</h2>

<p>
    <strong>LEFT JOIN</strong> returns all rows from the left
    table, along with matching rows from the right table. If there
    is no match, NULL is returned for the right table's columns.
</p>

${codeBlock(`SELECT e.emp_name, d.dept_name
FROM employees e
LEFT JOIN departments d ON e.dept_id = d.dept_id;`, "SQL")}


<h2>
    RIGHT JOIN
</h2>

<p>
    <strong>RIGHT JOIN</strong> returns all rows from the right
    table, along with matching rows from the left table.
</p>

${codeBlock(`SELECT e.emp_name, d.dept_name
FROM employees e
RIGHT JOIN departments d ON e.dept_id = d.dept_id;`, "SQL")}


<h2>
    FULL JOIN (Simulated)
</h2>

<p>
    MySQL does not directly support <strong>FULL JOIN</strong>. It
    can be simulated by combining a LEFT JOIN and a RIGHT JOIN
    using UNION.
</p>

${codeBlock(`SELECT e.emp_name, d.dept_name
FROM employees e
LEFT JOIN departments d ON e.dept_id = d.dept_id
UNION
SELECT e.emp_name, d.dept_name
FROM employees e
RIGHT JOIN departments d ON e.dept_id = d.dept_id;`, "SQL")}


<h2>
    CROSS JOIN
</h2>

<p>
    <strong>CROSS JOIN</strong> returns the Cartesian product of
    two tables, combining every row from the first table with
    every row from the second.
</p>

${codeBlock(`SELECT e.emp_name, d.dept_name
FROM employees e
CROSS JOIN departments d;`, "SQL")}


<h2>
    Self Join
</h2>

<p>
    A <strong>self join</strong> joins a table with itself. It is
    useful for comparing rows within the same table, such as
    finding an employee's manager.
</p>

${codeBlock(`SELECT a.emp_name AS employee, b.emp_name AS manager
FROM employees a
JOIN employees b ON a.manager_id = b.emp_id;`, "SQL")}


<div class="info">

<strong>Tip:</strong><br>
Always give tables short aliases (like e and d) when joining,
so column references stay short and readable.

</div>

`,


subqueries: `

<h1>
    Subqueries
</h1>

<div class="subtitle">
    Learn how to nest one query inside another to build more
    powerful and flexible SQL statements.
</div>

<div class="divider"></div>


<h2>
    What is a Subquery?
</h2>

<p>
    A <strong>subquery</strong> is a query written inside another
    query. It is often enclosed in parentheses and can appear in
    the WHERE, SELECT, or FROM clause.
</p>


<h2>
    Subquery in WHERE
</h2>

<p>
    A subquery in WHERE is commonly used to filter rows based on
    the result of another query.
</p>

${codeBlock(`SELECT name, fee FROM students
WHERE fee > (
    SELECT AVG(fee) FROM students
);`, "SQL")}

<div class="output-title">
    Output
</div>

<div class="output">
    +--------------+----------+<br>
    | name         | fee      |<br>
    +--------------+----------+<br>
    | Rahul Sharma | 47000.00 |<br>
    | Sneha Reddy  | 45000.00 |<br>
    +--------------+----------+
</div>


<h2>
    Subquery with IN
</h2>

${codeBlock(`SELECT emp_name FROM employees
WHERE dept_id IN (
    SELECT dept_id FROM departments
    WHERE dept_name = 'Sales'
);`, "SQL")}


<h2>
    Subquery in SELECT
</h2>

<p>
    A subquery placed inside the SELECT list computes a value for
    every row of the outer query.
</p>

${codeBlock(`SELECT name,
    (SELECT AVG(fee) FROM students) AS overall_avg_fee
FROM students;`, "SQL")}


<h2>
    Subquery in FROM (Derived Table)
</h2>

<p>
    A subquery can also act as a temporary table in the FROM
    clause. This is often called a derived table.
</p>

${codeBlock(`SELECT course, avg_fee
FROM (
    SELECT course, AVG(fee) AS avg_fee
    FROM students
    GROUP BY course
) AS course_summary
WHERE avg_fee > 40000;`, "SQL")}


<h2>
    Correlated Subqueries
</h2>

<p>
    A <strong>correlated subquery</strong> refers to a column from
    the outer query, so it is re-evaluated once for every row
    processed by the outer query.
</p>

${codeBlock(`SELECT s1.name, s1.course, s1.fee
FROM students s1
WHERE fee > (
    SELECT AVG(s2.fee)
    FROM students s2
    WHERE s2.course = s1.course
);`, "SQL")}


<div class="info">

<strong>Tip:</strong><br>
Correlated subqueries can be slower on large tables because
they run once per outer row. A join can often achieve the
same result more efficiently.

</div>

`,


union: `

<h1>
    UNION
</h1>

<div class="subtitle">
    Learn how to combine the result sets of two or more SELECT
    statements into a single result.
</div>

<div class="divider"></div>


<h2>
    What is UNION?
</h2>

<p>
    <strong>UNION</strong> combines the results of two or more
    SELECT statements into one result set. Each SELECT statement
    must have the same number of columns, in a compatible order
    and data type.
</p>

${codeBlock(`CREATE TABLE current_students (
    name VARCHAR(50),
    city VARCHAR(50)
);

CREATE TABLE alumni (
    name VARCHAR(50),
    city VARCHAR(50)
);`, "SQL")}


<h2>
    UNION (Removes Duplicates)
</h2>

<p>
    By default, UNION removes duplicate rows from the combined
    result set.
</p>

${codeBlock(`SELECT name, city FROM current_students
UNION
SELECT name, city FROM alumni;`, "SQL")}

<div class="output-title">
    Output
</div>

<div class="output">
    +--------------+--------+<br>
    | name         | city   |<br>
    +--------------+--------+<br>
    | Rahul Sharma | Mumbai |<br>
    | Priya Verma  | Pune   |<br>
    | Aman Gupta   | Delhi  |<br>
    +--------------+--------+
</div>


<h2>
    UNION ALL (Keeps Duplicates)
</h2>

<p>
    <strong>UNION ALL</strong> combines results without removing
    duplicates, which also makes it faster since MySQL does not
    need to check for duplicate rows.
</p>

${codeBlock(`SELECT name, city FROM current_students
UNION ALL
SELECT name, city FROM alumni;`, "SQL")}


<h2>
    UNION with ORDER BY
</h2>

<p>
    ORDER BY can be applied only once, at the end of the combined
    query, to sort the final result set.
</p>

${codeBlock(`SELECT name, city FROM current_students
UNION
SELECT name, city FROM alumni
ORDER BY name;`, "SQL")}


<div class="info">

<strong>Note:</strong><br>
All SELECT statements combined with UNION must return the
same number of columns with compatible data types, otherwise
MySQL will raise an error.

</div>

`,

constraints: `

<h1>
    Constraints
</h1>

<div class="subtitle">
    Learn how to enforce rules on table data using PRIMARY KEY,
    FOREIGN KEY, UNIQUE, NOT NULL, DEFAULT, CHECK, and
    AUTO_INCREMENT.
</div>

<div class="divider"></div>


<h2>
    What are Constraints?
</h2>

<p>
    Constraints are rules applied to table columns that restrict
    the type of data that can be stored. They help maintain the
    accuracy and reliability of data in the database.
</p>


<h2>
    PRIMARY KEY
</h2>

<p>
    A <strong>PRIMARY KEY</strong> uniquely identifies each row in
    a table. It cannot contain NULL values, and each table can have
    only one primary key.
</p>

${codeBlock(`CREATE TABLE products (
    product_id INT PRIMARY KEY,
    product_name VARCHAR(50)
);`, "SQL")}


<h2>
    AUTO_INCREMENT
</h2>

<p>
    <strong>AUTO_INCREMENT</strong> automatically generates a
    unique number for each new row, commonly used with primary
    keys.
</p>

${codeBlock(`CREATE TABLE orders (
    order_id INT PRIMARY KEY AUTO_INCREMENT,
    order_date DATE
);`, "SQL")}


<h2>
    FOREIGN KEY
</h2>

<p>
    A <strong>FOREIGN KEY</strong> links a column in one table to
    the primary key of another table, enforcing referential
    integrity between the two tables.
</p>

${codeBlock(`CREATE TABLE order_items (
    item_id INT PRIMARY KEY AUTO_INCREMENT,
    order_id INT,
    product_id INT,
    FOREIGN KEY (order_id) REFERENCES orders(order_id),
    FOREIGN KEY (product_id) REFERENCES products(product_id)
);`, "SQL")}


<h2>
    UNIQUE
</h2>

<p>
    <strong>UNIQUE</strong> ensures that all values in a column
    are different from one another, but unlike PRIMARY KEY, it
    allows one NULL value.
</p>

${codeBlock(`CREATE TABLE users (
    user_id INT PRIMARY KEY,
    email VARCHAR(100) UNIQUE
);`, "SQL")}


<h2>
    NOT NULL
</h2>

<p>
    <strong>NOT NULL</strong> ensures that a column cannot store a
    NULL value, forcing every row to have a value for that column.
</p>

${codeBlock(`CREATE TABLE employees (
    emp_id INT PRIMARY KEY,
    emp_name VARCHAR(50) NOT NULL
);`, "SQL")}


<h2>
    DEFAULT
</h2>

<p>
    <strong>DEFAULT</strong> sets a value automatically when no
    value is provided for a column during INSERT.
</p>

${codeBlock(`CREATE TABLE accounts (
    account_id INT PRIMARY KEY,
    status VARCHAR(20) DEFAULT 'Active'
);`, "SQL")}


<h2>
    CHECK
</h2>

<p>
    <strong>CHECK</strong> ensures that all values in a column
    satisfy a specific condition.
</p>

${codeBlock(`CREATE TABLE products_v2 (
    product_id INT PRIMARY KEY,
    price DECIMAL(10, 2) CHECK (price > 0)
);`, "SQL")}


<div class="info">

<strong>Tip:</strong><br>
Combining constraints such as NOT NULL, UNIQUE, and CHECK
together helps enforce strong data quality rules directly at
the database level.

</div>

`,


indexes: `

<h1>
    Indexes
</h1>

<div class="subtitle">
    Learn how indexes speed up data retrieval, and when they
    should and should not be used.
</div>

<div class="divider"></div>


<h2>
    What is an Index?
</h2>

<p>
    An <strong>index</strong> is a special lookup structure that
    MySQL uses to find rows quickly, without scanning the entire
    table. It works similarly to an index at the back of a book.
</p>


<h2>
    Creating an Index
</h2>

${codeBlock(`CREATE INDEX idx_course
ON students (course);`, "SQL")}

<div class="output-title">
    Output
</div>

<div class="output">
    Query OK, 0 rows affected (0.04 sec)
</div>


<h2>
    Creating a Unique Index
</h2>

<p>
    A <strong>unique index</strong> prevents duplicate values from
    being stored in the indexed column, in addition to speeding up
    lookups.
</p>

${codeBlock(`CREATE UNIQUE INDEX idx_email
ON users (email);`, "SQL")}


<h2>
    Composite (Multi-Column) Index
</h2>

<p>
    An index can also be created across multiple columns. It is
    most effective when queries filter by the leftmost columns of
    the index.
</p>

${codeBlock(`CREATE INDEX idx_course_age
ON students (course, age);`, "SQL")}


<h2>
    Viewing Indexes
</h2>

${codeBlock(`SHOW INDEX FROM students;`, "SQL")}


<h2>
    Dropping an Index
</h2>

${codeBlock(`DROP INDEX idx_course ON students;`, "SQL")}


<h2>
    Types of Indexes
</h2>

<ul class="topic-list">
    <li><strong>Primary Index:</strong> Automatically created for the PRIMARY KEY</li>
    <li><strong>Unique Index:</strong> Ensures no duplicate values in a column</li>
    <li><strong>Composite Index:</strong> Built on two or more columns</li>
    <li><strong>Full-text Index:</strong> Used for fast text-search queries</li>
</ul>


<h2>
    When to Use Indexes
</h2>

<ul class="topic-list">
    <li>Columns frequently used in WHERE clauses</li>
    <li>Columns used in JOIN conditions</li>
    <li>Columns used in ORDER BY or GROUP BY</li>
</ul>


<div class="info">

<strong>Warning:</strong><br>
Indexes speed up SELECT queries but slow down INSERT, UPDATE,
and DELETE operations, since the index must also be updated.

procedures: `

<h1>
    Stored Procedures
</h1>

<div class="subtitle">
    Learn how to create reusable blocks of SQL code using stored
    procedures, with IN, OUT, and INOUT parameters.
</div>

<div class="divider"></div>


<h2>
    What is a Stored Procedure?
</h2>

<p>
    A <strong>stored procedure</strong> is a set of SQL statements
    that is saved in the database and can be executed repeatedly
    by calling its name, instead of rewriting the same code
    every time.
</p>


<h2>
    Creating a Simple Procedure
</h2>

<p>
    The <strong>DELIMITER</strong> command is used to temporarily
    change the statement terminator, since the procedure body
    itself contains semicolons.
</p>

${codeBlock(`DELIMITER //

CREATE PROCEDURE GetAllStudents()
BEGIN
    SELECT * FROM students;
END //

DELIMITER ;`, "SQL")}


<h2>
    Calling a Procedure
</h2>

${codeBlock(`CALL GetAllStudents();`, "SQL")}


<h2>
    Using an IN Parameter
</h2>

<p>
    An <strong>IN</strong> parameter passes a value into the
    procedure.
</p>

${codeBlock(`DELIMITER //

CREATE PROCEDURE GetStudentsByCourse(IN course_name VARCHAR(50))
BEGIN
    SELECT * FROM students WHERE course = course_name;
END //

DELIMITER ;

CALL GetStudentsByCourse('Computer Science');`, "SQL")}


<h2>
    Using an OUT Parameter
</h2>

<p>
    An <strong>OUT</strong> parameter returns a value from the
    procedure back to the caller.
</p>

${codeBlock(`DELIMITER //

CREATE PROCEDURE CountStudents(OUT total INT)
BEGIN
    SELECT COUNT(*) INTO total FROM students;
END //

DELIMITER ;

CALL CountStudents(@total_students);
SELECT @total_students;`, "SQL")}


<h2>
    Using an INOUT Parameter
</h2>

<p>
    An <strong>INOUT</strong> parameter can both receive a value
    from the caller and return an updated value back.
</p>

${codeBlock(`DELIMITER //

CREATE PROCEDURE DoubleValue(INOUT num INT)
BEGIN
    SET num = num * 2;
END //

DELIMITER ;

SET @value = 10;
CALL DoubleValue(@value);
SELECT @value;`, "SQL")}

<div class="output-title">
    Output
</div>

<div class="output">
    +--------+<br>
    | @value |<br>
    +--------+<br>
    | 20     |<br>
    +--------+
</div>


<h2>
    Dropping a Procedure
</h2>

${codeBlock(`DROP PROCEDURE IF EXISTS GetAllStudents;`, "SQL")}


<div class="info">

<strong>Tip:</strong><br>
Stored procedures improve performance by reducing network
traffic and allow you to centralize business logic inside the
database.

</div>

udf: `

<h1>
    User-Defined Functions
</h1>

<div class="subtitle">
    Learn how to create custom functions in MySQL that return a
    single value, and how to call them inside queries.
</div>

<div class="divider"></div>


<h2>
    What is a User-Defined Function?
</h2>

<p>
    A <strong>user-defined function (UDF)</strong> is similar to a
    stored procedure, but it must return exactly one value and can
    be used directly inside SQL expressions, such as in a SELECT
    statement.
</p>


<h2>
    Creating a Function
</h2>

<p>
    The <strong>RETURNS</strong> clause specifies the data type of
    the value the function will return, and
    <strong>DETERMINISTIC</strong> tells MySQL that the function
    always returns the same result for the same input.
</p>

${codeBlock(`DELIMITER //

CREATE FUNCTION CalculateGST(price DECIMAL(10,2))
RETURNS DECIMAL(10,2)
DETERMINISTIC
BEGIN
    DECLARE gst DECIMAL(10,2);
    SET gst = price * 0.18;
    RETURN gst;
END //

DELIMITER ;`, "SQL")}


<h2>
    Calling a Function
</h2>

${codeBlock(`SELECT name, fee, CalculateGST(fee) AS gst_amount
FROM students;`, "SQL")}

<div class="output-title">
    Output
</div>

<div class="output">
    +--------------+----------+------------+<br>
    | name         | fee      | gst_amount |<br>
    +--------------+----------+------------+<br>
    | Rahul Sharma | 47000.00 | 8460.00    |<br>
    +--------------+----------+------------+
</div>


<h2>
    Function with Conditional Logic
</h2>

${codeBlock(`DELIMITER //

CREATE FUNCTION GetGrade(marks INT)
RETURNS VARCHAR(10)
DETERMINISTIC
BEGIN
    DECLARE grade VARCHAR(10);

    IF marks >= 90 THEN
        SET grade = 'A+';
    ELSEIF marks >= 75 THEN
        SET grade = 'A';
    ELSE
        SET grade = 'B';
    END IF;

    RETURN grade;
END //

DELIMITER ;

SELECT GetGrade(85);`, "SQL")}


<h2>
    Dropping a Function
</h2>

${codeBlock(`DROP FUNCTION IF EXISTS CalculateGST;`, "SQL")}


<h2>
    Functions vs Procedures
</h2>

<ul class="topic-list">
    <li>A function must return exactly one value; a procedure may return none, one, or many results</li>
    <li>Functions can be used inside SELECT statements; procedures cannot</li>
    <li>Procedures support IN, OUT, and INOUT parameters; functions only accept input parameters</li>
</ul>


<div class="info">

<strong>Tip:</strong><br>
Mark a function DETERMINISTIC whenever possible — it helps
MySQL optimize query execution and is required when binary
logging is enabled in some configurations.

</div>

triggers: `

<h1>
    Triggers
</h1>

<div class="subtitle">
    Learn how to automatically execute SQL code in response to
    INSERT, UPDATE, or DELETE events using triggers.
</div>

<div class="divider"></div>


<h2>
    What is a Trigger?
</h2>

<p>
    A <strong>trigger</strong> is a set of SQL statements that
    runs automatically when a specific event (INSERT, UPDATE, or
    DELETE) occurs on a table.
</p>


<h2>
    BEFORE INSERT Trigger
</h2>

<p>
    A <strong>BEFORE INSERT</strong> trigger runs before a new row
    is added, and can be used to validate or modify incoming data
    using the <strong>NEW</strong> keyword.
</p>

${codeBlock(`DELIMITER //

CREATE TRIGGER before_student_insert
BEFORE INSERT ON students
FOR EACH ROW
BEGIN
    IF NEW.fee < 0 THEN
        SET NEW.fee = 0;
    END IF;
END //

DELIMITER ;`, "SQL")}


<h2>
    AFTER INSERT Trigger
</h2>

<p>
    An <strong>AFTER INSERT</strong> trigger runs after a row has
    been added, often used for logging.
</p>

${codeBlock(`CREATE TABLE student_logs (
    log_id INT PRIMARY KEY AUTO_INCREMENT,
    message VARCHAR(255),
    created_at DATETIME
);

DELIMITER //

CREATE TRIGGER after_student_insert
AFTER INSERT ON students
FOR EACH ROW
BEGIN
    INSERT INTO student_logs (message, created_at)
    VALUES (CONCAT('New student added: ', NEW.name), NOW());
END //

DELIMITER ;`, "SQL")}


<h2>
    BEFORE UPDATE Trigger (NEW and OLD)
</h2>

<p>
    In UPDATE triggers, <strong>OLD</strong> refers to the row's
    values before the change, and <strong>NEW</strong> refers to
    the values after the change.
</p>

${codeBlock(`DELIMITER //

CREATE TRIGGER before_student_update
BEFORE UPDATE ON students
FOR EACH ROW
BEGIN
    IF NEW.fee < OLD.fee THEN
        SET NEW.fee = OLD.fee;
    END IF;
END //

DELIMITER ;`, "SQL")}


<h2>
    AFTER DELETE Trigger
</h2>

<p>
    In DELETE triggers, only the <strong>OLD</strong> keyword is
    available, since the row no longer exists after deletion.
</p>

${codeBlock(`DELIMITER //

CREATE TRIGGER after_student_delete
AFTER DELETE ON students
FOR EACH ROW
BEGIN
    INSERT INTO student_logs (message, created_at)
    VALUES (CONCAT('Student removed: ', OLD.name), NOW());
END //

DELIMITER ;`, "SQL")}


<h2>
    Viewing and Dropping Triggers
</h2>

${codeBlock(`SHOW TRIGGERS;

DROP TRIGGER IF EXISTS before_student_insert;`, "SQL")}


<div class="info">

<strong>Tip:</strong><br>
Triggers run automatically and invisibly. Overusing them can
make it harder to understand what changes data — use them
carefully and document their behavior.

</div>

`,


transactions: `

<h1>
    Transactions
</h1>

<div class="subtitle">
    Learn how to group multiple SQL statements into a single unit
    of work using transactions, and understand the ACID properties.
</div>

<div class="divider"></div>


<h2>
    What is a Transaction?
</h2>

<p>
    A <strong>transaction</strong> is a sequence of one or more
    SQL statements that are executed as a single logical unit.
    Either all the statements succeed together, or none of them
    take effect at all.
</p>


<h2>
    START TRANSACTION and COMMIT
</h2>

<p>
    <strong>START TRANSACTION</strong> begins a transaction, and
    <strong>COMMIT</strong> saves all the changes made during the
    transaction permanently.
</p>

${codeBlock(`START TRANSACTION;

UPDATE accounts SET balance = balance - 5000 WHERE account_id = 1;
UPDATE accounts SET balance = balance + 5000 WHERE account_id = 2;

COMMIT;`, "SQL")}

<div class="output-title">
    Output
</div>

<div class="output">
    Query OK, 1 row affected (0.00 sec)<br>
    Query OK, 1 row affected (0.00 sec)<br>
    Query OK, 0 rows affected (0.01 sec)
</div>


<h2>
    ROLLBACK
</h2>

<p>
    <strong>ROLLBACK</strong> undoes all the changes made since
    the transaction started, restoring the database to its
    previous state. This is used when something goes wrong.
</p>

${codeBlock(`START TRANSACTION;

UPDATE accounts SET balance = balance - 5000 WHERE account_id = 1;

-- Something went wrong, undo the change
ROLLBACK;`, "SQL")}


<h2>
    SAVEPOINT
</h2>

<p>
    A <strong>SAVEPOINT</strong> marks a point within a
    transaction that you can roll back to, without undoing the
    entire transaction.
</p>

${codeBlock(`START TRANSACTION;

UPDATE accounts SET balance = balance - 1000 WHERE account_id = 1;
SAVEPOINT sp1;

UPDATE accounts SET balance = balance - 2000 WHERE account_id = 1;

ROLLBACK TO sp1;

COMMIT;`, "SQL")}


<h2>
    ACID Properties
</h2>

<p>
    Transactions in MySQL (using the InnoDB storage engine) follow
    the <strong>ACID</strong> properties, which guarantee reliable
    processing of database transactions.
</p>

<ul class="topic-list">
    <li><strong>Atomicity:</strong> All statements in a transaction succeed, or none do</li>
    <li><strong>Consistency:</strong> The database moves from one valid state to another</li>
    <li><strong>Isolation:</strong> Concurrent transactions do not interfere with each other</li>
    <li><strong>Durability:</strong> Once committed, changes are permanently saved, even after a crash</li>
</ul>


<div class="info">

<strong>Note:</strong><br>
Transactions require a storage engine that supports them, such
as InnoDB. MyISAM, an older MySQL storage engine, does not
support transactions.

</div>

`,

/* =====================================================
   CREATE CODE BLOCK
===================================================== */

function codeBlock(code, language) {

    const id =
        "code_" +
        Math.random()
        .toString(36)
        .substring(2, 9);


    return `

        <div class="code-header">

            <span>
                ${language}
            </span>

            <button
                class="copy-btn"
                onclick="copyCode('${id}', this)">

                Copy

            </button>

        </div>


        <div class="code-box">

            <pre id="${id}">${escapeHTML(code.trim())}</pre>

        </div>

    `;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return text

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;");

}


/* =====================================================
   SHOW TOPIC
===================================================== */

function showTopic(topic, button) {


    document.getElementById("content").innerHTML =
        topics[topic];


    /* Remove active class */

    document
        .querySelectorAll(".topic")
        .forEach(function(item) {

            item.classList.remove("active");

        });


    /* Add active class */

    button.classList.add("active");


    /* Scroll content to top */

    document
        .querySelector(".content-area")
        .scrollTop = 0;


    /* Close mobile menu */

    if (window.innerWidth <= 700) {

        closeMenu();

    }

}


/* =====================================================
   COPY CODE
===================================================== */

function copyCode(id, button) {

    const code =
        document.getElementById(id).innerText;


    navigator.clipboard.writeText(code);


    button.innerText = "Copied!";


    setTimeout(function() {

        button.innerText = "Copy";

    }, 1500);

}


/* =====================================================
   OPEN / CLOSE MOBILE MENU
===================================================== */

function toggleMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.toggle("open");

    overlay.classList.toggle("show");

}


function closeMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.remove("open");

    overlay.classList.remove("show");

}


/* =====================================================
   LOAD FIRST TOPIC
===================================================== */

showTopic(
    "intro",
    document.querySelector(".topic")
);

</script>
