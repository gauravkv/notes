intro: `

<h1>
    Introduction to Advanced Java
</h1>

<div class="subtitle">
    Move beyond Core Java syntax and object-oriented basics into the
    advanced APIs and concepts that professional Java developers use
    every day - concurrency, generics, functional programming, I/O,
    databases, and design patterns.
</div>

<div class="divider"></div>


<h2>
    What is "Advanced Java"?
</h2>

<p>
    Advanced Java refers to the set of libraries, language features,
    and design techniques built on top of Core Java that let you write
    concurrent, type-safe, database-driven, and web-enabled applications.
    While Core Java teaches you syntax, loops, and OOP, Advanced Java
    focuses on how real-world enterprise software is actually built.
</p>

<p>
    This includes multithreading for doing multiple things at once,
    generics and the Collections Framework for type-safe reusable data
    structures, lambda expressions and the Stream API for functional-style
    programming, JDBC for talking to databases, and Servlets/JSP for
    building web applications.
</p>


<h2>
    Topics Covered in This Course
</h2>

<p>
    This course is organized into several major areas of the Java
    platform that build on one another:
</p>

<ul class="topic-list">
    <li><strong>Concurrency:</strong> Threads, thread lifecycle, and synchronization</li>
    <li><strong>Generics and Collections:</strong> Type-safe, reusable data structures</li>
    <li><strong>Functional Programming:</strong> Lambdas, functional interfaces, and Streams</li>
    <li><strong>I/O and NIO:</strong> Reading and writing files and streams efficiently</li>
    <li><strong>Reflection and Annotations:</strong> Inspecting and metadata-driving code at runtime</li>
    <li><strong>Database Programming:</strong> JDBC for connecting Java to relational databases</li>
    <li><strong>Web Development:</strong> Servlets and JSP for server-side Java</li>
    <li><strong>Design Patterns:</strong> Singleton, Factory, and Observer</li>
    <li><strong>Networking:</strong> Sockets for client-server communication</li>
    <li><strong>GUI Programming:</strong> Building desktop applications with Swing</li>
</ul>


<h2>
    Prerequisites
</h2>

<p>
    Before starting this course, you should already be comfortable with
    Core Java fundamentals - variables, data types, control flow, arrays,
    methods, classes, objects, inheritance, polymorphism, and exception
    handling. If you need a refresher, review the Core Java Theory notes
    first.
</p>

${codeBlock(`// A quick reminder of the OOP style this course builds on
public class Vehicle {
    private String name;

    public Vehicle(String name) {
        this.name = name;
    }

    public void drive() {
        System.out.println(name + " is driving");
    }

    public static void main(String[] args) {
        Vehicle car = new Vehicle("Sedan");
        car.drive();
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Sedan is driving
</div>


<div class="info">

<strong>Tip:</strong><br>
Advanced Java is not a single library - it is a collection of APIs
that ship with the JDK (like java.util.concurrent, java.util.stream,
and java.time) plus external specifications like Servlets and JSP that
require an application server such as Apache Tomcat.

</div>

`,


/* =====================================================
   MULTITHREADING BASICS
===================================================== */

threads: `

<h1>
    Multithreading Basics
</h1>

<div class="subtitle">
    Learn how Java allows multiple parts of a program to run
    concurrently using threads, improving performance and responsiveness.
</div>

<div class="divider"></div>


<h2>
    What is a Thread?
</h2>

<p>
    A <strong>thread</strong> is the smallest unit of execution within a
    process. Every Java program has at least one thread of execution
    called the <strong>main thread</strong>. Multithreading allows a
    program to perform multiple tasks concurrently, such as downloading
    a file while updating a progress bar.
</p>

<p>
    Java provides built-in support for multithreading through the
    <strong>Thread</strong> class and the <strong>Runnable</strong>
    interface, both found in the <strong>java.lang</strong> package.
</p>


<h2>
    Creating a Thread by Extending Thread
</h2>

<p>
    One way to create a thread is to extend the <strong>Thread</strong>
    class and override its <strong>run()</strong> method.
</p>

${codeBlock(`class MyThread extends Thread {
    public void run() {
        for (int i = 1; i <= 3; i++) {
            System.out.println("MyThread: " + i);
        }
    }
}

public class ThreadDemo {
    public static void main(String[] args) {
        MyThread t1 = new MyThread();
        t1.start(); // starts a new thread, do NOT call run() directly
        System.out.println("Main thread finished starting t1");
    }
}`, "Java")}

<div class="output-title">
    Output (order may vary)
</div>

<div class="output">
Main thread finished starting t1<br>
MyThread: 1<br>
MyThread: 2<br>
MyThread: 3
</div>


<h2>
    Creating a Thread by Implementing Runnable
</h2>

<p>
    The preferred approach is to implement the <strong>Runnable</strong>
    interface, since Java does not support multiple inheritance and this
    keeps your class free to extend something else.
</p>

${codeBlock(`class PrintTask implements Runnable {
    public void run() {
        for (int i = 1; i <= 3; i++) {
            System.out.println("PrintTask: " + i);
        }
    }
}

public class RunnableDemo {
    public static void main(String[] args) {
        Thread t1 = new Thread(new PrintTask());

threadlifecycle: `

<h1>
    Thread Lifecycle
</h1>

<div class="subtitle">
    Understand the different states a thread passes through during its
    life, from creation to termination.
</div>

<div class="divider"></div>


<h2>
    The Six Thread States
</h2>

<p>
    Every thread in Java exists in one of six states, defined by the
    <strong>Thread.State</strong> enum. Understanding these states helps
    you reason about concurrency bugs and deadlocks.
</p>

<ul class="topic-list">
    <li><strong>NEW:</strong> Thread object created but start() has not been called</li>
    <li><strong>RUNNABLE:</strong> Thread is executing or ready to execute, waiting for CPU time</li>
    <li><strong>BLOCKED:</strong> Thread is waiting to acquire a lock held by another thread</li>
    <li><strong>WAITING:</strong> Thread is waiting indefinitely for another thread's action</li>
    <li><strong>TIMED_WAITING:</strong> Thread is waiting for a specified amount of time</li>
    <li><strong>TERMINATED:</strong> Thread has completed execution</li>
</ul>


<h2>
    Observing Thread States
</h2>

<p>
    You can inspect a thread's current state using
    <strong>getState()</strong>, which returns a value from the
    <strong>Thread.State</strong> enum.
</p>

${codeBlock(`public class ThreadStateDemo {
    public static void main(String[] args) throws InterruptedException {
        Thread t = new Thread(() -> {
            try {
                Thread.sleep(500);
            } catch (InterruptedException e) {
                e.printStackTrace();
            }
        });

        System.out.println("Before start: " + t.getState()); // NEW
        t.start();
        System.out.println("After start: " + t.getState());  // RUNNABLE

        Thread.sleep(100);
        System.out.println("While sleeping: " + t.getState()); // TIMED_WAITING

        t.join();
        System.out.println("After join: " + t.getState()); // TERMINATED
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Before start: NEW<br>
After start: RUNNABLE<br>
While sleeping: TIMED_WAITING<br>
After join: TERMINATED
</div>


<h2>
    Using join() to Wait for Completion
</h2>

<p>
    The <strong>join()</strong> method causes the calling thread to pause
    until the thread it is called on has finished executing. This is
    useful when the main thread depends on results from a worker thread.
</p>

${codeBlock(`public class JoinDemo {
    public static void main(String[] args) throws InterruptedException {
        Thread worker = new Thread(() -> {
            for (int i = 1; i <= 3; i++) {
                System.out.println("Working... " + i);
            }
        });

        worker.start();
        worker.join(); // main waits here until worker finishes
        System.out.println("Worker is done, main continues");
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Working... 1<br>
Working... 2<br>
Working... 3<br>
Worker is done, main continues
</div>


<div class="info">

<strong>Tip:</strong><br>
A BLOCKED thread is different from a WAITING thread: BLOCKED means it
wants a lock (synchronized block/method) that another thread currently
holds, while WAITING means it called a method like wait() or join()
and is voluntarily pausing until notified or the awaited thread finishes.

</div>

`,

===================================================== */

synchronization: `

<h1>
    Synchronization
</h1>

<div class="subtitle">
    Learn how to protect shared data from being corrupted when multiple
    threads access it at the same time.
</div>

<div class="divider"></div>


<h2>
    The Problem: Race Conditions
</h2>

<p>
    When two or more threads access shared mutable data at the same
    time without coordination, the result can be unpredictable. This is
    called a <strong>race condition</strong>. A classic example is two
    threads incrementing the same counter variable.
</p>

${codeBlock(`class Counter {
    private int count = 0;

    public void increment() {
        count++; // NOT atomic: read, add, write
    }

    public int getCount() {
        return count;
    }
}

public class RaceConditionDemo {
    public static void main(String[] args) throws InterruptedException {
        Counter counter = new Counter();

        Runnable task = () -> {
            for (int i = 0; i < 10000; i++) {
                counter.increment();
            }
        };

        Thread t1 = new Thread(task);
        Thread t2 = new Thread(task);
        t1.start();
        t2.start();
        t1.join();
        t2.join();

        // Expected 20000, but often prints a smaller number
        System.out.println("Final count: " + counter.getCount());
    }
}`, "Java")}

<div class="output-title">
    Output (unreliable without synchronization)
</div>

<div class="output">
Final count: 17364 <span class="comment">// varies each run, often less than 20000</span>
</div>


<h2>
    The Solution: synchronized Keyword
</h2>

<p>
    The <strong>synchronized</strong> keyword ensures that only one
    thread can execute a block or method at a time for a given object
    lock, eliminating the race condition.
</p>

${codeBlock(`class SafeCounter {
    private int count = 0;

    public synchronized void increment() {
        count++;
    }

    public synchronized int getCount() {
        return count;
    }
}

public class SynchronizedDemo {
    public static void main(String[] args) throws InterruptedException {
        SafeCounter counter = new SafeCounter();

        Runnable task = () -> {
            for (int i = 0; i < 10000; i++) {
                counter.increment();
            }
        };

        Thread t1 = new Thread(task);
        Thread t2 = new Thread(task);
        t1.start();
        t2.start();
        t1.join();
        t2.join();

        System.out.println("Final count: " + counter.getCount());
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Final count: 20000
</div>


<h2>
    Synchronized Blocks
</h2>

<p>
    Instead of synchronizing an entire method, you can synchronize only
    the critical section using a synchronized block, which can improve
    performance by holding the lock for less time.
</p>

${codeBlock(`class BankAccount {
    private double balance = 1000;
    private final Object lock = new Object();

    public void withdraw(double amount) {
        synchronized (lock) {
            if (balance >= amount) {
                balance -= amount;
                System.out.println("Withdrew: " + amount + ", Balance: " + balance);
            } else {
                System.out.println("Insufficient funds");
            }
        }
    }
}`, "Java")}

<ul class="topic-list">
    <li>Every object has an intrinsic lock (monitor) used by synchronized</li>
    <li>Static synchronized methods lock on the Class object, not an instance</li>
    <li>Overusing synchronization can lead to poor performance or deadlocks</li>
    <li>java.util.concurrent.locks.ReentrantLock offers more flexible locking</li>
</ul>

<div class="info">

<strong>Tip:</strong><br>
A deadlock occurs when two threads each hold a lock the other needs,
and both wait forever. Avoid deadlocks by always acquiring multiple
locks in a consistent, agreed-upon order across your codebase.

</div>

`,

<h1>
    Collections Framework Deep Dive
</h1>

<div class="subtitle">
    Explore the core interfaces and implementations of the Java
    Collections Framework beyond the basics of ArrayList.

<div class="divider"></div>


<h2>
    The Collections Hierarchy
</h2>

<p>
    The Collections Framework is built around a few key interfaces:

<h2>

</h2>

${codeBlock(`import java.util.*;

        linkedHashSet.add("Cherry");

        Set<String> treeSet = new TreeSet<>();

        treeSet.add("Apple");

</div>

<h2>
    Working with Map
</h2>

<p>
    A <strong>Map</strong> stores key-value pairs. <strong>HashMap</strong>
    is the most commonly used implementation, offering fast average
    O(1) lookups but no ordering guarantee.
</p>

${codeBlock(`import java.util.HashMap;
import java.util.Map;

public class MapDemo {

</h2>

<p>
    A <strong>Queue</strong> processes elements in FIFO (first-in,
    first-out) order, while a <strong>Deque</strong> (double-ended
    queue) allows insertion and removal from both ends.
</p>

${codeBlock(`import java.util.ArrayDeque;
import java.util.Deque;

public class DequeDemo {

comparable: `

<h1>
    Comparable and Comparator
</h1>

<div class="subtitle">
    Learn the two standard ways to define custom sorting logic for your
    own objects in Java.
</div>

<div class="divider"></div>


<h2>
    The Comparable Interface
</h2>

<p>
    A class implements <strong>Comparable&lt;T&gt;</strong> to define
    its <strong>natural ordering</strong> by overriding
    <strong>compareTo()</strong>. This lets objects be sorted directly
    with <strong>Collections.sort()</strong> or <strong>Arrays.sort()</strong>.
</p>

${codeBlock(`import java.util.*;

class Student implements Comparable<Student> {
    String name;
    int marks;

    Student(String name, int marks) {
        this.name = name;
        this.marks = marks;
    }

    @Override
    public int compareTo(Student other) {
        return this.marks - other.marks; // ascending by marks
    }

    @Override
    public String toString() {
        return name + ": " + marks;
    }
}

public class ComparableDemo {
    public static void main(String[] args) {
        List<Student> students = new ArrayList<>();
        students.add(new Student("Amit", 85));
        students.add(new Student("Riya", 92));
        students.add(new Student("Sam", 70));

        Collections.sort(students);
        System.out.println(students);
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
[Sam: 70, Amit: 85, Riya: 92]
</div>


<h2>
    The Comparator Interface
</h2>

<p>
    <strong>Comparator&lt;T&gt;</strong> defines an external, custom
    ordering that does not require modifying the class itself. This is
    useful when you need multiple different sort orders.
</p>

${codeBlock(`import java.util.*;

public class ComparatorDemo {
    public static void main(String[] args) {
        List<Student> students = new ArrayList<>();
        students.add(new Student("Amit", 85));
        students.add(new Student("Riya", 92));
        students.add(new Student("Sam", 70));

        // Sort by name alphabetically using a Comparator
        Comparator<Student> byName = new Comparator<Student>() {
            @Override
            public int compare(Student a, Student b) {
                return a.name.compareTo(b.name);
            }
        };

        Collections.sort(students, byName);
        System.out.println(students);
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
[Amit: 85, Riya: 92, Sam: 70]
</div>


<h2>
    Comparator with Lambdas and comparing()
</h2>

<p>
    Since <strong>Comparator</strong> is a functional interface, it can
    be written far more concisely using lambda expressions and the
    static helper method <strong>Comparator.comparing()</strong>.
</p>

${codeBlock(`import java.util.*;

public class ComparatorLambdaDemo {
    public static void main(String[] args) {
        List<Student> students = new ArrayList<>();
        students.add(new Student("Amit", 85));
        students.add(new Student("Riya", 92));
        students.add(new Student("Sam", 70));

        // Sort by marks descending
        students.sort(Comparator.comparingInt((Student s) -> s.marks).reversed());
        System.out.println(students);

        // Sort by name using method reference
        students.sort(Comparator.comparing(s -> s.name));
        System.out.println(students);
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
[Riya: 92, Amit: 85, Sam: 70]<br>
[Amit: 85, Riya: 92, Sam: 70]
</div>

<ul class="topic-list">
    <li>Comparable defines one natural order inside the class (compareTo)</li>
    <li>Comparator defines external, swappable orders (compare)</li>
    <li>You can chain comparators using thenComparing()</li>
</ul>

<div class="info">

<strong>Tip:</strong><br>
Use Comparable when there is one obvious default ordering for a class
(like numbers or dates). Use Comparator when you need several different
sort orders for the same class, or cannot modify the class's source.

</div>

`,

lambda: `

<h1>
    Lambda Expressions
</h1>

<div class="subtitle">
    Write concise, anonymous functions in Java that make functional-style
    programming possible.
</div>

<div class="divider"></div>


<h2>
    What is a Lambda Expression?
</h2>

<p>
    Introduced in Java 8, a <strong>lambda expression</strong> is a
    short block of code that takes parameters and returns a value,
    similar to a method but without a name. Lambdas can only be used
    where a <strong>functional interface</strong> (an interface with
    exactly one abstract method) is expected.
</p>

<p>
    The basic syntax is:
    <strong>(parameters) -&gt; expression</strong> or
    <strong>(parameters) -&gt; { statements; }</strong>
</p>


<h2>
    From Anonymous Class to Lambda
</h2>

<p>
    Lambdas were designed to replace verbose anonymous inner classes
    when implementing simple functional interfaces like
    <strong>Runnable</strong> or <strong>Comparator</strong>.
</p>

${codeBlock(`public class LambdaEvolution {
    public static void main(String[] args) {
        // Old style: anonymous inner class
        Runnable r1 = new Runnable() {
            @Override
            public void run() {
                System.out.println("Running with anonymous class");
            }
        };

        // New style: lambda expression
        Runnable r2 = () -> System.out.println("Running with lambda");

        r1.run();
        r2.run();
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Running with anonymous class<br>
Running with lambda
</div>


<h2>
    Lambda Syntax Variations
</h2>

${codeBlock(`interface Calculator {
    int operate(int a, int b);
}

public class LambdaSyntaxDemo {
    public static void main(String[] args) {
        // No parameters
        Runnable noParams = () -> System.out.println("No parameters");

        // Single parameter, parentheses optional
        java.util.function.Function<Integer, Integer> square = x -> x * x;

        // Multiple parameters
        Calculator add = (a, b) -> a + b;

        // Block body with multiple statements
        Calculator multiply = (a, b) -> {
            int result = a * b;
            return result;
        };

        noParams.run();
        System.out.println("Square: " + square.apply(5));
        System.out.println("Add: " + add.operate(3, 4));
        System.out.println("Multiply: " + multiply.operate(3, 4));
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

No parameters<br>
Square: 25<br>
Add: 7<br>
Multiply: 12
</div>


<h2>
    Variable Capture in Lambdas
</h2>

<p>
    A lambda can access variables from its enclosing scope, but those
    variables must be <strong>effectively final</strong> (never
    reassigned after initialization).
</p>

${codeBlock(`public class VariableCaptureDemo {
    public static void main(String[] args) {
        int threshold = 10; // effectively final

        java.util.function.Predicate<Integer> isAboveThreshold =
            n -> n > threshold;

        System.out.println(isAboveThreshold.test(5));

true<br>
false
</div>


<h2>
    Method References
</h2>

<p>
    When a lambda simply calls an existing method, you can use an even
    shorter <strong>method reference</strong> with the <strong>::</strong>
    syntax.
</p>

${codeBlock(`import java.util.*;

public class MethodReferenceDemo {
    public static void main(String[] args) {
        List<String> names = Arrays.asList("charlie", "alice", "bob");

        // Lambda version
        names.forEach(n -> System.out.println(n));

streams: `

<h1>
    Stream API
</h1>

<div class="subtitle">
    Process collections of data in a declarative, functional style using
    the Stream API introduced in Java 8.
</div>

<div class="divider"></div>


<h2>
    What is a Stream?
</h2>

<p>
    A <strong>Stream</strong> represents a sequence of elements that
    supports functional-style operations such as filter, map, and
    reduce. Streams do not store data themselves - they process data
    from a source (like a Collection) and produce a result without
    modifying the original source.
</p>

<p>
    Stream operations are either <strong>intermediate</strong>
    (return another stream, e.g. filter, map, sorted) or
    <strong>terminal</strong> (produce a final result, e.g. collect,
    forEach, count). Streams are lazy: intermediate operations don't
    run until a terminal operation is invoked.
</p>


<h2>
    Filtering and Mapping
</h2>

${codeBlock(`import java.util.*;
import java.util.stream.*;

public class FilterMapDemo {
    public static void main(String[] args) {
        List<String> names = Arrays.asList("Alice", "Bob", "Charlie", "Dave", "Eve");

        List<String> result = names.stream()
            .filter(name -> name.length() > 3)
            .map(String::toUpperCase)
            .collect(Collectors.toList());

        System.out.println(result);
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
[ALICE, CHARLIE, DAVE]
</div>


<h2>
    Sorting, Reducing, and Counting
</h2>

${codeBlock(`import java.util.*;
import java.util.stream.*;

public class SortReduceDemo {
    public static void main(String[] args) {
        List<Integer> numbers = Arrays.asList(5, 3, 8, 1, 9, 2);

        List<Integer> sorted = numbers.stream()
            .sorted()
            .collect(Collectors.toList());
        System.out.println("Sorted: " + sorted);

        int sum = numbers.stream()
            .reduce(0, Integer::sum);
        System.out.println("Sum: " + sum);

        long count = numbers.stream()
            .filter(n -> n > 3)
            .count();
        System.out.println("Count > 3: " + count);
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Sorted: [1, 2, 3, 5, 8, 9]<br>
Sum: 28<br>
Count &gt; 3: 4
</div>


<h2>
    Collecting into Maps and Grouping
</h2>

<p>
    The <strong>Collectors</strong> utility class provides powerful
    terminal operations like <strong>groupingBy()</strong> for grouping
    stream elements by a classifier function.
</p>

${codeBlock(`import java.util.*;
import java.util.stream.*;

public class GroupingDemo {
    public static void main(String[] args) {
        List<String> words = Arrays.asList("apple", "banana", "avocado", "blueberry", "cherry");

        Map<Character, List<String>> grouped = words.stream()
            .collect(Collectors.groupingBy(w -> w.charAt(0)));

        System.out.println(grouped);
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
{a=[apple, avocado], b=[banana, blueberry], c=[cherry]}
</div>


<h2>
    Numeric Streams
</h2>

<p>
    Specialized streams like <strong>IntStream</strong>,
    <strong>LongStream</strong>, and <strong>DoubleStream</strong> avoid
    boxing overhead and provide numeric helpers like
    <strong>sum()</strong>, <strong>average()</strong>, and
    <strong>range()</strong>.
</p>

${codeBlock(`import java.util.stream.IntStream;

public class IntStreamDemo {
    public static void main(String[] args) {
        int sum = IntStream.rangeClosed(1, 10).sum();
        System.out.println("Sum 1 to 10: " + sum);

        double average = IntStream.of(4, 8, 15, 16, 23, 42).average().orElse(0);
        System.out.println("Average: " + average);

    Output
</div>

A stream can only be consumed once. Calling a terminal operation twice
on the same stream throws IllegalStateException - create a new stream
from the source each time you need to process it again.

${codeBlock(`import java.util.Optional;

    }

<div class="output-title">

</div>

<div class="output">
true<br>
false<br>
true
</div>


<h2>
    Safely Retrieving Values
</h2>

${codeBlock(`import java.util.Optional;

public class OptionalRetrieveDemo {
    public static void main(String[] args) {
        Optional<String> name = Optional.ofNullable(null);

        // orElse: provide a default value
        System.out.println(name.orElse("Default Name"));

        // orElseGet: provide a default via a Supplier (lazy)
        System.out.println(name.orElseGet(() -> "Generated Default"));

        // ifPresent: run code only if a value exists
        Optional.of("Alice").ifPresent(n -> System.out.println("Found: " + n));

        // orElseThrow: throw a custom exception if empty
        try {
            name.orElseThrow(() -> new IllegalStateException("No name found"));
        } catch (IllegalStateException e) {
            System.out.println("Caught: " + e.getMessage());
        }
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Default Name<br>
Generated Default<br>
Found: Alice<br>
Caught: No name found
</div>

</h2>

${codeBlock(`import java.util.Optional;

public class OptionalChainDemo {
    public static void main(String[] args) {
        Optional<String> email = Optional.of("user@example.com");

        String domain = email
            .filter(e -> e.contains("@"))
            .map(e -> e.split("@")[1])

<div class="output-title">

</div>

<h1>

<h2>

</h2>

<p>
    A class becomes serializable by implementing the marker interface

</h2>

</div>

</h2>

public class DeserializeDemo {
    public static void main(String[] args) {
        try (ObjectInputStream in =
                new ObjectInputStream(new FileInputStream("employee.ser"))) {
            Employee emp = (Employee) in.readObject();
            System.out.println("Name: " + emp.name);
            System.out.println("ID: " + emp.id);
            System.out.println("Password: " + emp.password); // null, was transient

/* =====================================================

===================================================== */

annotations: `

<h1>
    Annotations
</h1>

<div class="subtitle">
    Learn how Java annotations attach metadata to code that tools,
    frameworks, and the compiler can read and act upon.
</div>

<div class="divider"></div>


<h2>
    What are Annotations?
</h2>

<p>
    An <strong>annotation</strong> is metadata added to code using the
    <strong>@</strong> symbol. Annotations do not change program logic
    directly, but they can be read by the compiler, build tools, or at
    runtime via reflection to drive behavior - this is heavily used by
    frameworks like Spring and Hibernate.
</p>


<h2>
    Built-in Annotations
</h2>

<ul class="topic-list">
    <li><strong>@Override:</strong> Verifies a method overrides a superclass method</li>
    <li><strong>@Deprecated:</strong> Marks a method or class as outdated</li>
    <li><strong>@SuppressWarnings:</strong> Tells the compiler to ignore specific warnings</li>
    <li><strong>@FunctionalInterface:</strong> Enforces that an interface has one abstract method</li>
</ul>

${codeBlock(`public class BuiltInAnnotationDemo {

    @Deprecated
    static void oldMethod() {
        System.out.println("This method is outdated");
    }

    static class Animal {
        void speak() { System.out.println("..."); }
    }

    static class Dog extends Animal {
        @Override
        void speak() {
            System.out.println("Woof!");
        }
    }

    @SuppressWarnings("unchecked")
    public static void main(String[] args) {
        oldMethod();
        new Dog().speak();
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
This method is outdated<br>
Woof!
</div>


<h2>
    Creating a Custom Annotation
</h2>

<p>
    Custom annotations are defined with <strong>@interface</strong>.
    Meta-annotations like <strong>@Retention</strong> and
    <strong>@Target</strong> control how long the annotation is kept
    and where it can be applied.
</p>

${codeBlock(`import java.lang.annotation.*;

@Retention(RetentionPolicy.RUNTIME) // available at runtime via reflection
@Target(ElementType.METHOD)         // can only be applied to methods
@interface Testable {
    String author() default "Unknown";
}

class Calculator {
    @Testable(author = "Priya")
    public int add(int a, int b) {
        return a + b;
    }
}`, "Java")}


<h2>
    Reading Annotations with Reflection
</h2>

${codeBlock(`import java.lang.reflect.Method;

public class ReadAnnotationDemo {
    public static void main(String[] args) throws Exception {
        Method method = Calculator.class.getMethod("add", int.class, int.class);

        if (method.isAnnotationPresent(Testable.class)) {
            Testable info = method.getAnnotation(Testable.class);
            System.out.println("Method is testable, written by: " + info.author());
        }
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Method is testable, written by: Priya
</div>

<div class="info">

<strong>Tip:</strong><br>
An annotation with RetentionPolicy.SOURCE is discarded by the compiler
(like @Override), CLASS is kept in the .class file but not visible at
runtime, and RUNTIME is kept and readable via reflection - use RUNTIME
whenever a framework needs to inspect it while the program is running.

reflection: `

<h1>
    Reflection API
</h1>

<div class="subtitle">
    Inspect and manipulate classes, methods, and fields at runtime using
    java.lang.reflect - the technology behind most Java frameworks.
</div>

<div class="divider"></div>


<h2>
    What is Reflection?
</h2>

<p>
    <strong>Reflection</strong> allows a running Java program to
    examine or modify its own structure - classes, methods, fields, and
    constructors - even without knowing their names at compile time.
    Frameworks like Spring and JUnit use reflection extensively to
    instantiate classes and invoke methods based on annotations.
</p>


<h2>
    Getting Class Information
</h2>

${codeBlock(`class Person {
    private String name = "Anonymous";
    public int age = 0;

    public Person() {}

    public Person(String name, int age) {
        this.name = name;
        this.age = age;
    }

    public void greet() {
        System.out.println("Hi, I'm " + name);
    }

    private void secret() {
        System.out.println("This is private");
    }
}

public class ClassInfoDemo {
    public static void main(String[] args) {
        Class<?> clazz = Person.class;

        System.out.println("Class name: " + clazz.getName());
        System.out.println("Simple name: " + clazz.getSimpleName());

        System.out.println("Methods:");
        for (var method : clazz.getDeclaredMethods()) {
            System.out.println("  " + method.getName());
        }

        System.out.println("Fields:");
        for (var field : clazz.getDeclaredFields()) {
            System.out.println("  " + field.getName());
        }
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Class name: Person<br>
Simple name: Person<br>
Methods:<br>
&nbsp;&nbsp;greet<br>
&nbsp;&nbsp;secret<br>
Fields:<br>
&nbsp;&nbsp;name<br>
&nbsp;&nbsp;age
</div>


<h2>
    Creating Objects and Invoking Methods Dynamically
</h2>

${codeBlock(`import java.lang.reflect.*;

public class ReflectionInvokeDemo {
    public static void main(String[] args) throws Exception {
        Class<?> clazz = Class.forName("Person");

        // Create an instance using the no-arg constructor
        Object person = clazz.getDeclaredConstructor().newInstance();

        // Invoke the public greet() method dynamically
        Method greetMethod = clazz.getMethod("greet");
        greetMethod.invoke(person);

        // Access and modify a private field
        Field nameField = clazz.getDeclaredField("name");
        nameField.setAccessible(true); // bypass private access
        nameField.set(person, "Reflected Name");

        greetMethod.invoke(person);
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Hi, I'm Anonymous<br>
Hi, I'm Reflected Name
</div>

<ul class="topic-list">

    <li>It is slower than direct code because of runtime type checks</li>
    <li>Heavily used by frameworks, dependency injection, and testing tools</li>
    <li>Overusing reflection in application code makes it harder to read and maintain</li>
</ul>

<div class="info">

<strong>Tip:</strong><br>
Use reflection sparingly in your own application code. It bypasses
compile-time type checking, so mistakes only surface at runtime.
Reflection shines when building frameworks, not everyday business logic.

</div>

<h2>

Hello from Outer
</div>

</h2>

    and cannot access its non-static members directly. It behaves like

<h1>

<h2>

</h2>

<div class="divider"></div>


<h2>
    Why PreparedStatement?
</h2>

<p>
    <strong>PreparedStatement</strong> precompiles SQL with placeholders
    (<strong>?</strong>) for parameters. Unlike a plain
    <strong>Statement</strong> with string-concatenated values, it
    protects against <strong>SQL injection</strong> and is more
    efficient when the same query runs multiple times.

    Create (INSERT)
</h2>

${codeBlock(`import java.sql.*;

public class InsertDemo {
    public static void main(String[] args) {
        String sql = "INSERT INTO students (name, grade) VALUES (?, ?)";

        try (Connection conn = DriverManager.getConnection(
                "jdbc:mysql://localhost:3306/school", "root", "password");
             PreparedStatement ps = conn.prepareStatement(sql)) {

            ps.setString(1, "Diana");
            ps.setString(2, "A");

            int rows = ps.executeUpdate();
            System.out.println(rows + " row(s) inserted");
        } catch (SQLException e) {
            System.out.println("Insert failed: " + e.getMessage());
        }
    }
}`, "Java")}

${codeBlock(`import java.sql.*;

        String sql = "SELECT name, grade FROM students WHERE grade = ?";

        try (Connection conn = DriverManager.getConnection(
                "jdbc:mysql://localhost:3306/school", "root", "password");
             PreparedStatement ps = conn.prepareStatement(sql)) {

            ps.setString(1, "A");

                while (rs.next()) {

Diana - A

<h2>

</h2>

${codeBlock(`import java.sql.*;

public class UpdateDeleteDemo {
    public static void main(String[] args) {
        String updateSql = "UPDATE students SET grade = ? WHERE name = ?";
        String deleteSql = "DELETE FROM students WHERE name = ?";

        try (Connection conn = DriverManager.getConnection(
                "jdbc:mysql://localhost:3306/school", "root", "password")) {

            try (PreparedStatement ps = conn.prepareStatement(updateSql)) {
                ps.setString(1, "B");

string - it opens the door to SQL injection attacks. Always use

<h1>

</h1>

<div class="subtitle">
    Understand how Servlets let Java handle HTTP requests and generate
    dynamic web page responses on the server side.
</div>

<div class="divider"></div>


<h2>
    What is a Servlet?
</h2>

<p>
    A <strong>Servlet</strong> is a Java class that runs inside a web
    server (called a <strong>servlet container</strong>, such as
    Apache Tomcat) and handles HTTP requests and responses. Servlets
    are the foundation of server-side Java web development, and
    frameworks like Spring MVC are built on top of them.

<h2>
    The Servlet Lifecycle
</h2>

<ul class="topic-list">
    <li><strong>init():</strong> Called once when the servlet is first loaded</li>
    <li><strong>service():</strong> Called for every request, dispatches to doGet/doPost</li>
    <li><strong>doGet() / doPost():</strong> Handle specific HTTP methods</li>
    <li><strong>destroy():</strong> Called once when the servlet is being removed</li>
</ul>


<h2>
    A Simple Servlet
</h2>

<p>
    A servlet extends <strong>HttpServlet</strong> and overrides
    methods for the HTTP verbs it needs to handle.
</p>

${codeBlock(`import java.io.IOException;
import java.io.PrintWriter;
import javax.servlet.ServletException;
import javax.servlet.http.HttpServlet;
import javax.servlet.http.HttpServletRequest;
import javax.servlet.http.HttpServletResponse;
import javax.servlet.annotation.WebServlet;

@WebServlet("/hello")
public class HelloServlet extends HttpServlet {

    @Override
    protected void doGet(HttpServletRequest request, HttpServletResponse response)
            throws ServletException, IOException {

        response.setContentType("text/html");
        PrintWriter out = response.getWriter();

        out.println("<html><body>");
        out.println("<h1>Hello from a Servlet!</h1>");
        out.println("</body></html>");
    }
}`, "Java")}

<div class="output-title">

</div>

<div class="output">
Hello from a Servlet!
</div>


<h2>
    Reading Request Parameters
</h2>

${codeBlock(`import java.io.IOException;
import java.io.PrintWriter;
import javax.servlet.http.*;
import javax.servlet.annotation.WebServlet;

@WebServlet("/greet")
public class GreetServlet extends HttpServlet {

    @Override
    protected void doGet(HttpServletRequest request, HttpServletResponse response)
            throws IOException {

        String name = request.getParameter("name");
        if (name == null || name.isEmpty()) {
            name = "Guest";

Servlets are typically deployed as part of a WAR (Web Application

annotation maps a URL pattern to the servlet class, replacing the
older web.xml configuration approach.

singleton: `

<h1>
    Singleton Design Pattern
</h1>

<div class="subtitle">
    Ensure a class has only one instance and provide a single global
    point of access to it.
</div>

<div class="divider"></div>


<h2>
    Why Use a Singleton?
</h2>

<p>
    Some objects should exist exactly once throughout an application's
    lifetime - a configuration manager, a logging service, or a
    connection pool, for example. The <strong>Singleton pattern</strong>
    guarantees this by making the constructor private and controlling
    instance creation through a static method.
</p>


<h2>
    Eager Initialization
</h2>

<p>
    The simplest form creates the instance immediately when the class
    is loaded. It is thread-safe by default, but creates the object
    even if it is never used.
</p>

${codeBlock(`class ConfigManager {
    private static final ConfigManager INSTANCE = new ConfigManager();

    private ConfigManager() {
        System.out.println("ConfigManager created");
    }

    public static ConfigManager getInstance() {
        return INSTANCE;
    }

    public void showConfig() {
        System.out.println("App running in production mode");
    }
}

public class EagerSingletonDemo {
    public static void main(String[] args) {
        ConfigManager c1 = ConfigManager.getInstance();
        ConfigManager c2 = ConfigManager.getInstance();

        c1.showConfig();
        System.out.println("Same instance: " + (c1 == c2));
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
ConfigManager created<br>
App running in production mode<br>
Same instance: true
</div>


<h2>
    Lazy Initialization with Double-Checked Locking
</h2>

<p>
    A lazy singleton delays creation until first use, and needs careful
    synchronization to remain thread-safe without paying the locking
    cost on every call.
</p>

${codeBlock(`class Logger {
    private static volatile Logger instance;

    private Logger() {
        System.out.println("Logger created");
    }

    public static Logger getInstance() {
        if (instance == null) {
            synchronized (Logger.class) {
                if (instance == null) {
                    instance = new Logger();
                }
            }
        }
        return instance;
    }

    public void log(String message) {
        System.out.println("[LOG] " + message);
    }
}

public class LazySingletonDemo {
    public static void main(String[] args) {
        Logger logger = Logger.getInstance();
        logger.log("Application started");

factory: `

<h1>
    Factory Design Pattern
</h1>

<div class="subtitle">
    Delegate object creation to a factory method so client code depends
    on interfaces rather than concrete classes.
</div>

<div class="divider"></div>


<h2>
    The Problem Factory Solves
</h2>

<p>
    When object creation logic involves conditionals or varies based on
    input, scattering <strong>new</strong> calls throughout your code
    makes it hard to maintain. The <strong>Factory pattern</strong>
    centralizes this decision in one place, returning objects through a
    common interface or superclass.
</p>


<h2>
    Simple Factory Example
</h2>

${codeBlock(`interface Shape {
    void draw();
}

class Circle implements Shape {
    public void draw() { System.out.println("Drawing a Circle"); }
}

class Square implements Shape {
    public void draw() { System.out.println("Drawing a Square"); }
}

class Triangle implements Shape {
    public void draw() { System.out.println("Drawing a Triangle"); }
}

class ShapeFactory {
    public static Shape createShape(String type) {
        switch (type.toLowerCase()) {
            case "circle": return new Circle();
            case "square": return new Square();
            case "triangle": return new Triangle();
            default: throw new IllegalArgumentException("Unknown shape: " + type);
        }
    }
}`, "Java")}

${codeBlock(`public class FactoryDemo {
    public static void main(String[] args) {
        Shape s1 = ShapeFactory.createShape("circle");
        Shape s2 = ShapeFactory.createShape("square");
        Shape s3 = ShapeFactory.createShape("triangle");

        s1.draw();
        s2.draw();
        s3.draw();
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Drawing a Circle<br>
Drawing a Square<br>
Drawing a Triangle
</div>


<h2>
    Benefits of the Factory Pattern
</h2>

<ul class="topic-list">
    <li>Client code depends only on the Shape interface, not concrete classes</li>
    <li>Adding a new shape only requires changing the factory, not every caller</li>
    <li>Object creation logic is centralized and easy to test</li>
    <li>Supports the Open/Closed Principle - open for extension, closed for modification</li>
</ul>

<div class="info">

<strong>Tip:</strong><br>
The Factory pattern pairs naturally with polymorphism. If you find
yourself writing the same switch statement based on a type string in
multiple places, that is a strong signal to extract a Factory class.

</div>

/* =====================================================
   OBSERVER DESIGN PATTERN
===================================================== */

observer: `

<h1>
    Observer Design Pattern
</h1>

<div class="subtitle">
    Define a one-to-many dependency so that when one object changes
    state, all its dependents are notified automatically.
</div>

<div class="divider"></div>


<h2>
    What Problem Does Observer Solve?
</h2>

<p>
    The <strong>Observer pattern</strong> lets an object (the
    <strong>subject</strong>) maintain a list of dependents
    (<strong>observers</strong>) and notify them automatically of any
    state changes, without the subject needing to know the concrete
    class of its observers. This is the foundation of event-driven
    programming and GUI event listeners.
</p>


<h2>
    Defining the Observer Interface
</h2>

${codeBlock(`import java.util.ArrayList;
import java.util.List;

interface Observer {
    void update(String event);
}

class NewsPublisher {
    private List<Observer> subscribers = new ArrayList<>();

    public void subscribe(Observer o) {
        subscribers.add(o);
    }

    public void unsubscribe(Observer o) {
        subscribers.remove(o);
    }

    public void publish(String headline) {
        System.out.println("Publishing: " + headline);
        for (Observer o : subscribers) {
            o.update(headline);
        }
    }
}`, "Java")}


<h2>
    Implementing Concrete Observers
</h2>

${codeBlock(`class EmailSubscriber implements Observer {
    private String email;

    EmailSubscriber(String email) { this.email = email; }

    public void update(String event) {
        System.out.println("Emailing " + email + ": " + event);
    }
}

class SmsSubscriber implements Observer {
    private String phone;

    SmsSubscriber(String phone) { this.phone = phone; }

    public void update(String event) {
        System.out.println("Texting " + phone + ": " + event);
    }
}

public class ObserverDemo {
    public static void main(String[] args) {
        NewsPublisher publisher = new NewsPublisher();

        publisher.subscribe(new EmailSubscriber("alice@example.com"));
        publisher.subscribe(new SmsSubscriber("555-1234"));

        publisher.publish("Breaking News: Java 21 Released!");
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Publishing: Breaking News: Java 21 Released!<br>
Emailing alice@example.com: Breaking News: Java 21 Released!<br>
Texting 555-1234: Breaking News: Java 21 Released!
</div>


<h2>
    Observer in the JDK
</h2>

<p>
    Java's own GUI toolkits use the Observer pattern extensively - for
    example, adding an <strong>ActionListener</strong> to a Swing
    <strong>JButton</strong> registers an observer that is notified
    whenever the button is clicked.
</p>

<div class="info">

<strong>Tip:</strong><br>
Be careful about memory leaks with the Observer pattern - if a subject
outlives its observers but never calls unsubscribe(), the observers
cannot be garbage collected. This is called a "lapsed listener" problem.

</div>

`,


/* =====================================================
   CUSTOM EXCEPTIONS
===================================================== */

customexceptions: `

<h1>
    Custom Exceptions
</h1>

<div class="subtitle">
    Create your own exception classes to represent specific error
    conditions in your application domain.
</div>

<div class="divider"></div>


<h2>
    Why Create Custom Exceptions?
</h2>

<p>
    Built-in exceptions like <strong>IllegalArgumentException</strong>
    are generic. A custom exception, such as
    <strong>InsufficientFundsException</strong>, communicates the exact
    business rule that was violated and can carry extra data relevant
    to that failure.
</p>


<h2>
    Checked vs Unchecked Custom Exceptions
</h2>

<p>
    Extend <strong>Exception</strong> to create a
    <strong>checked</strong> exception (callers must handle or declare
    it), or extend <strong>RuntimeException</strong> to create an
    <strong>unchecked</strong> exception (no compile-time enforcement).
</p>

${codeBlock(`// Checked exception - must be declared with throws or caught
class InsufficientFundsException extends Exception {
    private double shortfall;

    public InsufficientFundsException(String message, double shortfall) {
        super(message);
        this.shortfall = shortfall;
    }

    public double getShortfall() {
        return shortfall;
    }
}

// Unchecked exception - no forced handling
class InvalidAccountException extends RuntimeException {
    public InvalidAccountException(String message) {
        super(message);
    }
}`, "Java")}


<h2>
    Using a Custom Exception
</h2>

${codeBlock(`class BankAccount {
    private double balance;

    BankAccount(double balance) {
        this.balance = balance;
    }

    void withdraw(double amount) throws InsufficientFundsException {
        if (amount > balance) {
            double shortfall = amount - balance;
            throw new InsufficientFundsException(
                "Cannot withdraw " + amount + ", balance is " + balance, shortfall);
        }
        balance -= amount;
        System.out.println("Withdrew " + amount + ", new balance: " + balance);
    }
}

public class CustomExceptionDemo {
    public static void main(String[] args) {
        BankAccount account = new BankAccount(500);

        try {
            account.withdraw(200);
            account.withdraw(1000);
        } catch (InsufficientFundsException e) {
            System.out.println("Error: " + e.getMessage());
            System.out.println("Shortfall: " + e.getShortfall());
        }
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Withdrew 200.0, new balance: 300.0<br>
Error: Cannot withdraw 1000.0, balance is 300.0<br>
Shortfall: 700.0
</div>


<h2>
    Exception Chaining
</h2>

<p>
    You can preserve the original cause of an error while throwing a
    more meaningful custom exception by passing the original exception
    to the constructor.
</p>

${codeBlock(`class DataProcessingException extends RuntimeException {
    public DataProcessingException(String message, Throwable cause) {
        super(message, cause);
    }
}

public class ExceptionChainingDemo {
    public static void main(String[] args) {
        try {
            int result = Integer.parseInt("not a number");
        } catch (NumberFormatException e) {
            throw new DataProcessingException("Failed to process input row", e);
        }
    }
}`, "Java")}

<ul class="topic-list">
    <li>Custom exception names should end in "Exception" by convention</li>
    <li>Always provide a constructor that accepts a message, and ideally a cause</li>
    <li>Prefer unchecked exceptions for programming errors, checked for recoverable conditions</li>
</ul>

<div class="info">

<strong>Tip:</strong><br>
Do not overuse checked exceptions - they force every caller up the
call stack to handle or declare them, which can lead to boilerplate
catch blocks that just rethrow or log. Reserve checked exceptions for
conditions the caller can reasonably be expected to recover from.

</div>

`,

networking: `

<h1>
    Networking with Sockets
</h1>

<div class="subtitle">
    Learn how Java programs communicate over a network using TCP
    sockets in the java.net package.
</div>

<div class="divider"></div>


<h2>
    Client-Server Basics
</h2>

<p>
    A <strong>socket</strong> is an endpoint for communication between
    two machines. A server uses a <strong>ServerSocket</strong> to
    listen on a port and accept incoming connections, while a client
    uses a <strong>Socket</strong> to connect to that server.
</p>


<h2>
    Building a Simple Server
</h2>

${codeBlock(`import java.io.*;
import java.net.*;

public class EchoServer {
    public static void main(String[] args) throws IOException {
        try (ServerSocket serverSocket = new ServerSocket(5000)) {
            System.out.println("Server listening on port 5000...");

            try (Socket clientSocket = serverSocket.accept();
                 BufferedReader in = new BufferedReader(
                     new InputStreamReader(clientSocket.getInputStream()));
                 PrintWriter out = new PrintWriter(clientSocket.getOutputStream(), true)) {

                String message = in.readLine();
                System.out.println("Received: " + message);
                out.println("Echo: " + message);
            }
        }
    }
}`, "Java")}


<h2>
    Building a Simple Client
</h2>

${codeBlock(`import java.io.*;
import java.net.*;

public class EchoClient {
    public static void main(String[] args) throws IOException {
        try (Socket socket = new Socket("localhost", 5000);
             PrintWriter out = new PrintWriter(socket.getOutputStream(), true);
             BufferedReader in = new BufferedReader(
                 new InputStreamReader(socket.getInputStream()))) {

            out.println("Hello, Server!");
            String response = in.readLine();
            System.out.println("Server replied: " + response);
        }
    }
}`, "Java")}

<div class="output-title">
    Output (Client console)
</div>

<div class="output">
Server replied: Echo: Hello, Server!
</div>


<h2>
    Handling Multiple Clients
</h2>

<p>
    A real server usually spawns a new thread for each accepted
    connection so it can serve multiple clients concurrently rather
    than blocking on one at a time.
</p>

${codeBlock(`import java.io.*;
import java.net.*;

public class MultiClientServer {
    public static void main(String[] args) throws IOException {
        try (ServerSocket serverSocket = new ServerSocket(5000)) {
            System.out.println("Server ready for multiple clients...");

            while (true) {
                Socket clientSocket = serverSocket.accept();
                new Thread(() -> handleClient(clientSocket)).start();
            }
        }
    }

    private static void handleClient(Socket socket) {
        try (socket;
             BufferedReader in = new BufferedReader(
                 new InputStreamReader(socket.getInputStream()))) {
            System.out.println("Client says: " + in.readLine());
        } catch (IOException e) {
            System.out.println("Client error: " + e.getMessage());
        }
    }
}`, "Java")}

<div class="info">

<strong>Tip:</strong><br>
TCP sockets (Socket/ServerSocket) guarantee reliable, ordered delivery,
while UDP sockets (DatagramSocket) are faster but do not guarantee
delivery or order. Choose TCP for things like file transfer and UDP
for latency-sensitive use cases like live video streaming.

</div>

regex: `

<h1>
    Regular Expressions in Java
</h1>

<div class="subtitle">
    Use the java.util.regex package to search, match, and manipulate
    text using powerful pattern matching.
</div>

<div class="divider"></div>


<h2>
    Pattern and Matcher
</h2>

<p>
    Java's regex support centers on two classes:
    <strong>Pattern</strong>, a compiled representation of a regular
    expression, and <strong>Matcher</strong>, an engine that performs
    match operations on a given input using that pattern.
</p>

${codeBlock(`import java.util.regex.*;

public class PatternMatcherDemo {
    public static void main(String[] args) {
        String text = "My phone numbers are 987-654-3210 and 123-456-7890";
        Pattern pattern = Pattern.compile("\\\\d{3}-\\\\d{3}-\\\\d{4}");

            System.out.println("Found: " + matcher.group());
        }
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Found: 987-654-3210<br>
Found: 123-456-7890
</div>


<h2>
    Quick Matching with String Methods
</h2>

<p>
    For simple one-off checks, <strong>String</strong> provides
    convenience methods that use regex internally, so you don't always
    need to work with Pattern and Matcher directly.
</p>

${codeBlock(`public class StringRegexDemo {
    public static void main(String[] args) {
        String email = "user@example.com";

        boolean valid = email.matches("^[\\\\w.+-]+@[\\\\w-]+\\\\.[a-zA-Z]{2,}$");
        System.out.println("Valid email: " + valid);

        String csv = "apple, banana,  cherry ,date";
        String[] items = csv.split("\\\\s*,\\\\s*");
        for (String item : items) {
            System.out.println("Item: [" + item + "]");
        }

        String cleaned = "Hello   World   from   Java".replaceAll("\\\\s+", " ");
        System.out.println("Cleaned: " + cleaned);
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Valid email: true<br>
Item: [apple]<br>
Item: [banana]<br>
Item: [cherry]<br>
Item: [date]<br>
Cleaned: Hello World from Java
</div>


<h2>
    Capturing Groups
</h2>

<p>
    Parentheses in a regex create <strong>capturing groups</strong>,
    letting you extract specific parts of a match rather than the
    whole thing.
</p>

${codeBlock(`import java.util.regex.*;

public class GroupsDemo {
    public static void main(String[] args) {
        String log = "2026-09-10 ERROR Connection timed out";
        Pattern pattern = Pattern.compile("(\\\\d{4}-\\\\d{2}-\\\\d{2}) (\\\\w+) (.+)");
        Matcher matcher = pattern.matcher(log);

        if (matcher.matches()) {
            System.out.println("Date: " + matcher.group(1));
            System.out.println("Level: " + matcher.group(2));
            System.out.println("Message: " + matcher.group(3));
        }
    }
}`, "Java")}

<div class="output-title">
    Output
</div>

<div class="output">
Date: 2026-09-10<br>
Level: ERROR<br>
Message: Connection timed out
</div>

<ul class="topic-list">
    <li><strong>\\\\d</strong> - any digit, <strong>\\\\w</strong> - word character, <strong>\\\\s</strong> - whitespace</li>
    <li><strong>*</strong> zero or more, <strong>+</strong> one or more, <strong>?</strong> zero or one</li>
    <li><strong>{n,m}</strong> between n and m repetitions</li>
    <li><strong>^</strong> start of string, <strong>$</strong> end of string</li>
</ul>

<div class="info">

<strong>Tip:</strong><br>
In a Java string literal, a single backslash must be written as two
backslashes because backslash is also the Java string escape
character. So the regex \\d matches a digit, but written in Java source
code it appears as "\\\\d".

</div>

/* =====================================================
   CREATE CODE BLOCK
===================================================== */

function codeBlock(code, language) {

    const id =
        "code_" +
        Math.random()
        .toString(36)
        .substring(2, 9);


    return `

        <div class="code-header">

            <span>
                ${language}
            </span>

            <button
                class="copy-btn"
                onclick="copyCode('${id}', this)">

                Copy

            </button>

        </div>


        <div class="code-box">

            <pre id="${id}">${escapeHTML(code.trim())}</pre>

        </div>

    `;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return text

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;");

}


/* =====================================================
   SHOW TOPIC
===================================================== */

function showTopic(topic, button) {


    document.getElementById("content").innerHTML =
        topics[topic];


    /* Remove active class */

    document
        .querySelectorAll(".topic")
        .forEach(function(item) {

            item.classList.remove("active");

        });


    /* Add active class */

    button.classList.add("active");


    /* Scroll content to top */

    document
        .querySelector(".content-area")
        .scrollTop = 0;


    /* Close mobile menu */

    if (window.innerWidth <= 700) {

        closeMenu();

    }

}


/* =====================================================
   COPY CODE
===================================================== */

function copyCode(id, button) {

    const code =
        document.getElementById(id).innerText;


    navigator.clipboard.writeText(code);


    button.innerText = "Copied!";


    setTimeout(function() {

        button.innerText = "Copy";

    }, 1500);

}


/* =====================================================
   OPEN / CLOSE MOBILE MENU
===================================================== */

function toggleMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.toggle("open");

    overlay.classList.toggle("show");

}


function closeMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.remove("open");

    overlay.classList.remove("show");

}


/* =====================================================
   LOAD FIRST TOPIC
===================================================== */

showTopic("intro", document.querySelector(".topic"));
