<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Python Coding Notes</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    height: 100%;
}

body {

    background: #f5f7fa;

    color: #252a34;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar {

    height: 64px;

    background: #ffffff;

    border-bottom: 1px solid #e2e6ed;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 30px;

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    z-index: 100;
}


.logo {

    font-size: 20px;

    font-weight: 700;

    color: #252a34;
}


.language {

    font-size: 14px;

    color: #687386;
}


/* =====================================================
   MOBILE MENU BUTTON
===================================================== */

.menu-btn {

    display: none;

    border: none;

    background: #eef0ff;

    color: #4f46e5;

    padding: 8px 12px;

    border-radius: 7px;

    font-size: 13px;

    cursor: pointer;

    font-weight: 600;
}


/* =====================================================
   MAIN LAYOUT
===================================================== */

.main {

    display: flex;

    position: fixed;

    top: 64px;

    bottom: 0;

    left: 0;

    right: 0;
}


/* =====================================================
   LEFT SIDEBAR
===================================================== */

.sidebar {

    width: 18%;

    min-width: 150px;

    background: #ffffff;

    border-right: 1px solid #e2e6ed;

    overflow-y: auto;

    padding: 25px 15px;
}


.sidebar-title {

    font-size: 13px;

    font-weight: 700;

    color: #8a93a3;

    text-transform: uppercase;

    letter-spacing: 0.7px;

    padding: 0 12px;

    margin-bottom: 12px;
}


/* =====================================================
   TOPIC BUTTON
===================================================== */

.topic {

    width: 100%;

    border: none;

    background: transparent;

    text-align: left;

    padding: 12px 14px;

    margin-bottom: 4px;

    border-radius: 8px;

    cursor: pointer;

    color: #505866;

    font-size: 14px;

    transition: all 0.2s;
}


.topic:hover {

    background: #f3f4ff;

    color: #4f46e5;
}


.topic.active {

    background: #eef0ff;

    color: #4f46e5;

    
}


/* =====================================================
   RIGHT CONTENT AREA
===================================================== */

.content-area {

    width: 82%;

    overflow-y: auto;

    padding: 2px;
}


/* =====================================================
   CONTENT CARD
===================================================== */

.content {

    width: min(1600px, 100%);

    margin: 0 10;

    background: #ffffff;

    border: 1px solid #e2e6ed;

    border-radius: 14px;

    padding: 45px;

    box-shadow:
        0 8px 30px rgba(30, 36, 48, 0.06);
}


/* =====================================================
   TYPOGRAPHY
===================================================== */

h1 {

    margin: 0;

    font-size: 36px;

    line-height: 1.2;

    color: #202532;
}


.subtitle {

    margin-top: 10px;

    color: #687386;

    font-size: 16px;

    line-height: 1.6;
}


.divider {

    height: 1px;

    background: #e5e8ee;

    margin: 28px 0;
}


h2 {

    font-size: 24px;

    margin-top: 32px;

    margin-bottom: 10px;

    color: #252a34;
}


p {

    font-size: 17px;

    line-height: 1.8;

    color: #3f4652;

    margin: 12px 0;
}


strong {

    color: #303744;
}


/* =====================================================
   LIST
===================================================== */

.topic-list {

    padding-left: 22px;

    color: #3f4652;

    font-size: 16px;

    line-height: 1.8;
}


.topic-list li {

    margin-bottom: 2px;
}


/* =====================================================
   CODE HEADER
===================================================== */

.code-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    background: #171b24;

    color: #aeb6c5;

    padding: 10px 15px;

    border-radius: 9px 9px 0 0;

    font-size: 13px;

    margin-top: 20px;
}


/* =====================================================
   COPY BUTTON
===================================================== */

.copy-btn {

    border: none;

    background: #292f3c;

    color: #dce1ea;

    padding: 6px 11px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 12px;

    transition: 0.2s;
}


.copy-btn:hover {

    background: #3a4252;
}


/* =====================================================
   CODE BOX
===================================================== */

.code-box {

    background: #1e2430;

    padding: 20px;

    border-radius: 0 0 9px 9px;

    overflow-x: auto;

    box-shadow:
        0 8px 20px rgba(20, 25, 35, 0.12);
}


.code-box pre {

    margin: 0;

    font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

    font-size: 15px;

    line-height: 1.7;

    color: #e6eaf0;

    white-space: pre;
}


/* =====================================================
   SYNTAX COLORS
===================================================== */

.keyword {
    color: #c792ea;
}

.function {
    color: #82aaff;
}

.string {
    color: #c3e88d;
}

.number {
    color: #f78c6c;
}

.comment {
    color: #697386;
}


/* =====================================================
   OUTPUT
===================================================== */

.output-title {

    margin-top: 25px;

    font-size: 14px;

    font-weight: 600;

    color: #687386;
}


.output {

    margin-top: 8px;

    background: #f8f9fb;

    border: 1px solid #e2e6ed;

    border-radius: 8px;

    padding: 14px 18px;

    font-family:
        Consolas,
        monospace;

    font-size: 14px;

    color: #303744;

    line-height: 1.7;
}


/* =====================================================
   INFO BOX
===================================================== */

.info {

    margin-top: 25px;

    padding: 17px 20px;

    background: #f3f4ff;

    border-left: 4px solid #6366f1;

    border-radius: 6px;

    color: #454a65;

    line-height: 1.6;

    font-size: 15px;
}


/* =====================================================
   MOBILE OVERLAY
===================================================== */

.overlay {

    display: none;
}


/* =====================================================
   MOBILE DESIGN
===================================================== */

@media (max-width: 700px) {


    /* ---------------------------------------------
       NAVBAR
    --------------------------------------------- */

    .navbar {

        padding: 0 16px;
    }


    .menu-btn {

        display: block;
    }


    .language {

        display: none;
    }


    /* ---------------------------------------------
       MAIN
    --------------------------------------------- */

    .main {

        position: static;

        display: block;

        margin-top: 64px;
    }


    /* ---------------------------------------------
       SIDEBAR / DRAWER
    --------------------------------------------- */

    .sidebar {

        position: fixed;

        top: 64px;

        left: 0;

        bottom: 0;

        width: 280px;

        min-width: 0;

        z-index: 200;

        transform: translateX(-100%);

        transition:
            transform 0.25s ease;

        box-shadow:
            5px 0 25px rgba(0,0,0,0.12);

        overflow-y: auto;

        padding: 22px 15px;
    }


    .sidebar.open {

        transform: translateX(0);
    }


    /* ---------------------------------------------
       DARK OVERLAY
    --------------------------------------------- */

    .overlay {

        position: fixed;

        display: none;

        top: 64px;

        left: 0;

        right: 0;

        bottom: 0;

        background:
            rgba(0,0,0,0.35);

        z-index: 150;
    }


    .overlay.show {

        display: block;
    }


    /* ---------------------------------------------
       CONTENT
    --------------------------------------------- */

    .content-area {

        width: 100%;

        padding: 20px 12px;

        overflow: visible;
    }


    .content {

        width: 100%;

        padding: 28px 20px;

        border-radius: 10px;
    }


    h1 {

        font-size: 30px;
    }


    h2 {

        font-size: 22px;
    }


    p {

        font-size: 16px;

        line-height: 1.7;
    }


    .code-box {

        padding: 15px;
    }


    .code-box pre {

        font-size: 13px;
    }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media (max-width: 380px) {

    .logo {

        font-size: 17px;
    }


    .menu-btn {

        font-size: 12px;

        padding: 7px 10px;
    }


    .content {

        padding: 24px 16px;
    }


    h1 {

        font-size: 27px;
    }

}

</style>

</head>


<body>


<!-- ===================================================
     NAVBAR
=================================================== -->

<nav class="navbar">


    <div class="logo">

        Coding Notes

    </div>


    <!-- Mobile only -->

    <button
        class="menu-btn"
        onclick="toggleMenu()">

        ☰ Topics

    </button>


    <div class="language">

        Python

    </div>


</nav>



<!-- ===================================================
     MAIN
=================================================== -->

<div class="main">


    <!-- =================================================
         LEFT TOPICS
    ================================================== -->

    <aside
        class="sidebar"
        id="sidebar">


        <div class="sidebar-title">

            Python Topics

        </div>


        <button
            class="topic active"
            onclick="showTopic('intro', this)">

            Introduction

        </button>


        <button
            class="topic"
            onclick="showTopic('variables', this)">

            Variables

        </button>


        <button
            class="topic"
            onclick="showTopic('datatypes', this)">

            Data Types

        </button>


        <button
            class="topic"
            onclick="showTopic('operators', this)">

            Operators

        </button>


        <button
            class="topic"
            onclick="showTopic('conditions', this)">

            Conditional Statements

        </button>


        <button
            class="topic"
            onclick="showTopic('loops', this)">

            Loops

        </button>


        <button
            class="topic"
            onclick="showTopic('functions', this)">

            Functions

        </button>


        <button
            class="topic"
            onclick="showTopic('functiontypes', this)">

            Types of Functions

        </button>


        <button
            class="topic"
            onclick="showTopic('lists', this)">

            Lists

        </button>


        <button
            class="topic"
            onclick="showTopic('tuples', this)">

            Tuples

        </button>


        <button
            class="topic"
            onclick="showTopic('dictionary', this)">

            Dictionary

        </button>


    </aside>



    <!-- =================================================
         MOBILE OVERLAY
    ================================================== -->

    <div
        class="overlay"
        id="overlay"
        onclick="closeMenu()">
    </div>



    <!-- =================================================
         RIGHT CONTENT
    ================================================== -->

    <section class="content-area">


        <div
            class="content"
            id="content">
        </div>


    </section>


</div>



<script>

/* =====================================================
   TOPIC CONTENT
===================================================== */

const topics = {


/* =====================================================
   INTRODUCTION
===================================================== */

intro: `

<h1>
    Introduction to Python
</h1>

<div class="subtitle">
    Learn the fundamentals of Python programming and understand why
    Python is one of the most popular programming languages.
</div>

<div class="divider"></div>


<h2>
    What is Python?
</h2>

<p>
    Python is a high-level, interpreted, general-purpose programming
    language known for its simple syntax, readability, and ease of use.
    It was created by Guido van Rossum and was first released in 1991.
</p>

<p>
    Python allows programmers to write programs using simple and
    understandable syntax. This makes it an excellent language for
    beginners as well as experienced developers.
</p>


<h2>
    Why Learn Python?
</h2>

<p>
    Python is easy to learn because its syntax is close to the English
    language. It requires fewer lines of code compared to many other
    programming languages, allowing developers to focus more on solving
    problems rather than dealing with complex syntax.
</p>

<ul class="topic-list">
    <li>Simple and easy-to-understand syntax</li>
    <li>Beginner-friendly programming language</li>
    <li>Large collection of libraries and frameworks</li>
    <li>Supports object-oriented and functional programming</li>
    <li>Widely used in modern software development</li>
</ul>


<h2>
    Where is Python Used?
</h2>

<p>
    Python is a versatile language and is used in many different areas
    of technology. Developers use Python to build websites, analyze
    data, create artificial intelligence applications, automate tasks,
    and develop desktop and scientific applications.
</p>


<div class="info">

<strong>Python is used for:</strong><br><br>

Web Development • Data Science •
Artificial Intelligence • Machine Learning •
Automation • Data Analysis •
Desktop Applications • Scientific Computing

</div>


<h2>
    Features of Python
</h2>

<ul class="topic-list">
    <li><strong>Easy to Learn:</strong> Python has a simple and readable syntax.</li>
    <li><strong>Interpreted:</strong> Python code is executed by an interpreter.</li>
    <li><strong>Portable:</strong> Python programs can run on different operating systems.</li>
    <li><strong>Open Source:</strong> Python is freely available to use and distribute.</li>
    <li><strong>Extensible:</strong> Python can work with other languages such as C and C++.</li>
    <li><strong>Large Community:</strong> Python has a huge developer community and many learning resources.</li>
</ul>


<h2>
    Your First Python Program
</h2>

<p>
    Let's start with the simplest Python program. The
    <strong>print()</strong> function is used to display information
    on the screen.
</p>

${codeBlock(`print("Hello, World!")`, "Python")}


<div class="output-title">
    Output
</div>

<div class="output">
    Hello, World!
</div>


<div class="info">

<strong>Tip:</strong><br>
Python uses indentation to define blocks of code.
Proper indentation is an important part of writing
clean and correct Python programs.

</div>

`,


/* =====================================================
   VARIABLES
===================================================== */

variables: `


<h1>
    Variables
</h1>

<div class="subtitle">
    Learn how to store, update, and work with data using variables in Python.
</div>

<div class="divider"></div>


<h2>
    What is a Variable?
</h2>

<p>
    A variable is a name used to store a value in a program.
    It acts like a container that holds data such as numbers,
    text, or other types of information.
</p>

<p>
    In Python, you do not need to declare the data type of a
    variable separately. Python automatically determines the
    data type based on the value assigned to it.
</p>


<h2>
    Creating a Variable
</h2>

<p>
    A variable is created when you assign a value to a name
    using the <strong>=</strong> assignment operator.
</p>

${codeBlock(`name = "Rahul"
age = 20
salary = 25000`, "Python")}


<h2>
    Example
</h2>

<p>
    In the following example, the variables
    <strong>name</strong> and <strong>age</strong> store
    a student's name and age.
</p>

${codeBlock(`name = "Rahul"
age = 20

print(name)
print(age)`, "Python")}


<div class="output-title">
    Output
</div>

<div class="output">
    Rahul<br>
    20
</div>


<h2>
    Assigning Multiple Variables
</h2>

<p>
    Python allows you to assign values to multiple variables
    in a single statement.
</p>

${codeBlock(`name, age, city = "Rahul", 20, "Mumbai"

print(name)
print(age)
print(city)`, "Python")}


<div class="output-title">
    Output
</div>

<div class="output">
    Rahul<br>
    20<br>
    Mumbai
</div>


<h2>
    Changing the Value of a Variable
</h2>

<p>
    A variable's value can be changed during program execution.
    When a new value is assigned, the variable stores the new value.
</p>

${codeBlock(`age = 20
print(age)

age = 21
print(age)`, "Python")}


<div class="output-title">
    Output
</div>

<div class="output">
    20<br>
    21
</div>


<h2>
    Variables Can Store Different Types of Data
</h2>

<p>
    Python variables can store different types of values,
    including integers, floating-point numbers, strings,
    and Boolean values.
</p>

${codeBlock(`age = 20
price = 99.50
name = "Rahul"
is_student = True

print(age)
print(price)
print(name)
print(is_student)`, "Python")}


<div class="output-title">
    Output
</div>

<div class="output">
    20<br>
    99.5<br>
    Rahul<br>
    True
</div>


<h2>
    Rules for Naming Variables
</h2>

<p>
    Python has some rules that should be followed while
    creating variable names.
</p>

<ul class="topic-list">
    <li>A variable name must start with a letter or underscore.</li>
    <li>A variable name cannot start with a number.</li>
    <li>Variable names can contain letters, numbers, and underscores.</li>
    <li>Spaces are not allowed in variable names.</li>
    <li>Python variable names are case-sensitive.</li>
    <li>Python keywords cannot be used as variable names.</li>
</ul>


<h2>
    Valid and Invalid Variable Names
</h2>

${codeBlock(`student_name = "Rahul"
age2 = 20
_total = 500

# Invalid examples:
# 2age = 20
# student name = "Rahul"
# class = "Python"`, "Python")}


<div class="info">

<strong>Remember:</strong><br>
Python is case-sensitive. This means
<strong>name</strong>, <strong>Name</strong>, and
<strong>NAME</strong> are treated as three different variables.

</div>


<h2>
    Checking the Data Type
</h2>

<p>
    The <strong>type()</strong> function can be used to find
    the data type stored in a variable.
</p>

${codeBlock(`age = 20
name = "Rahul"
price = 99.50

print(type(age))
print(type(name))
print(type(price))`, "Python")}


<div class="output-title">
    Output
</div>

<div class="output">
    &lt;class 'int'&gt;<br>
    &lt;class 'str'&gt;<br>
    &lt;class 'float'&gt;
</div>


<div class="info">

<strong>Key Point:</strong><br>
A variable is simply a name that refers to a value.
Python automatically manages the data type of the value
stored in the variable.

</div>



`,


/* =====================================================
   DATA TYPES
===================================================== */

datatypes: `


<h1>
    Data Types
</h1>

<div class="subtitle">
    Different types of data available in Python.
</div>

<div class="divider"></div>


<h2>
    What is a Data Type?
</h2>

<p>
    A data type defines the kind of value that a variable can store.
    Python has several built-in data types that are used to represent
    different kinds of data such as numbers, text, collections, and
    logical values.
</p>

<p>
    Python is dynamically typed, which means you do not need to
    explicitly declare the data type of a variable. Python
    automatically determines the type based on the value assigned.
</p>


<h2>
    Main Built-in Data Types
</h2>

<p>
    Some of the most commonly used built-in data types in Python are:
</p>

<ul>
    <li>Numeric Types – int, float, complex</li>
    <li>Boolean Type – bool</li>
    <li>Text Type – str</li>
    <li>Sequence Types – list, tuple, range</li>
    <li>Set Types – set, frozenset</li>
    <li>Mapping Type – dict</li>
    <li>None Type – NoneType</li>
</ul>


<h2>
    1. Integer (int)
</h2>

<p>
    The <b>int</b> data type is used to store whole numbers without
    decimal points. Integers can be positive, negative, or zero.
</p>

${codeBlock(`age = 20
temperature = -5
students = 50

print(age)
print(type(age))`, "Python")}


<h2>
    2. Float (float)
</h2>

<p>
    The <b>float</b> data type is used to store numbers containing
    decimal points. It is commonly used for prices, percentages,
    measurements, and calculations.
</p>

${codeBlock(`price = 99.50
percentage = 87.5
height = 5.8

print(price)
print(type(price))`, "Python")}


<h2>
    3. Complex (complex)
</h2>

<p>
    The <b>complex</b> data type represents complex numbers.
    A complex number contains a real part and an imaginary part.
    Python uses <b>j</b> to represent the imaginary part.
</p>

${codeBlock(`number = 3 + 4j

print(number)
print(type(number))`, "Python")}


<h2>
    4. String (str)
</h2>

<p>
    The <b>str</b> data type is used to store text. Strings can be
    written using single quotes, double quotes, or triple quotes.
</p>

${codeBlock(`name = "Rahul"
course = 'Python'
message = """Welcome to Python"""

print(name)
print(type(name))`, "Python")}


<h2>
    5. Boolean (bool)
</h2>

<p>
    The <b>bool</b> data type represents one of two values:
    <b>True</b> or <b>False</b>. Boolean values are commonly used
    in conditions and decision-making.
</p>

${codeBlock(`is_student = True
is_logged_in = False

print(is_student)
print(type(is_student))`, "Python")}


<h2>
    6. List (list)
</h2>

<p>
    A <b>list</b> is an ordered collection of items. Lists can contain
    multiple values of different data types. Lists are mutable, which
    means their values can be changed after creation.
</p>

${codeBlock(`marks = [85, 90, 78, 92]

print(marks)
print(type(marks))

marks[0] = 95
print(marks)`, "Python")}


<h2>
    7. Tuple (tuple)
</h2>

<p>
    A <b>tuple</b> is an ordered collection of items, similar to a list.
    However, tuples are immutable, which means their values cannot be
    changed after creation.
</p>

${codeBlock(`colors = ("Red", "Green", "Blue")

print(colors)
print(type(colors))`, "Python")}


<h2>
    8. Set (set)
</h2>

<p>
    A <b>set</b> is an unordered collection of unique values.
    Duplicate values are automatically removed from a set.
</p>

${codeBlock(`numbers = {10, 20, 30, 20, 10}

print(numbers)
print(type(numbers))`, "Python")}


<h2>
    9. Dictionary (dict)
</h2>

<p>
    A <b>dictionary</b> stores data in the form of
    <b>key-value pairs</b>. Each key is used to access its
    corresponding value.
</p>

${codeBlock(`student = {
    "name": "Rahul",
    "age": 20,
    "course": "Python"
}

print(student)
print(student["name"])
print(type(student))`, "Python")}


<h2>
    10. Range (range)
</h2>

<p>
    The <b>range</b> data type represents a sequence of numbers.
    It is commonly used with loops, especially <b>for</b> loops.
</p>

${codeBlock(`numbers = range(1, 6)

print(list(numbers))
print(type(numbers))`, "Python")}


<h2>
    11. NoneType (None)
</h2>

<p>
    <b>None</b> represents the absence of a value. It is commonly
    used when a variable currently has no value or when a function
    does not return a value.
</p>

${codeBlock(`result = None

print(result)
print(type(result))`, "Python")}


<h2>
    Checking the Data Type</h2>

<p>
    Python provides the <b>type()</b> function to find the data type
    of a value or variable.
</p>

${codeBlock(`age = 20
name = "Rahul"
marks = [80, 90, 85]
student = {"name": "Rahul"}

<ul>

<div class="subtitle">

<h2>
    What is a Loop?
</h2>

<p>
    A loop is used to execute a block of code repeatedly.
    Instead of writing the same code multiple times, we can
    use a loop to repeat the code automatically.
</p>

<p>
    Loops are especially useful when working with collections,
    processing data, displaying repeated output, and performing
    repetitive calculations.

<h2>
    Types of Loops in Python
</h2>

<p>
    Python mainly provides two types of loops:
</p>

<ul>
    <li><b>for loop</b> – Used to iterate over a sequence or collection.</li>
    <li><b>while loop</b> – Used to repeat code while a condition is True.</li>
</ul>

<p>
    Python also provides loop control statements such as
    <b>break</b>, <b>continue</b>, and <b>pass</b>.
</p>


<h2>
    1. for Loop
</h2>

<p>
    A <b>for loop</b> is used to iterate over a sequence such as
    a list, tuple, string, set, dictionary, or range of numbers.

<h3>
    Syntax

${codeBlock(`for variable in sequence:

    Simple Example
</h3>

${codeBlock(`for i in range(5):
    print(i)`, "Python")}

1<br>
2<br>
3<br>
4

</p>


<h2>
    Using for Loop with a List
</h2>

<p>
    A for loop can be used to access each item of a list.
</p>

${codeBlock(`fruits = ["Apple", "Banana", "Mango"]

for fruit in fruits:

    Output

<h2>
    2. while Loop
</h2>

<p>
    A <b>while loop</b> repeatedly executes a block of code
    as long as a specified condition remains True.
</p>

<h3>
    Syntax
</h3>

${codeBlock(`while condition:
    # code to execute`, "Python")}


<h3>
    Simple Example
</h3>

    count += 1`, "Python")}

    When count becomes 6, the condition becomes False and the
    loop stops.
</p>


<h2>
    Important: Updating a while Loop
</h2>

<p>
    When using a while loop, make sure the condition eventually
    becomes False. Otherwise, the loop can become an
    <b>infinite loop</b>.
</p>

${codeBlock(`count = 1

while count <= 5:
    print(count)
    count += 1`, "Python")}

<p>
    Here, <b>count += 1</b> changes the value of count during
    every iteration, allowing the loop to eventually stop.
</p>


<h2>
    Infinite Loop
</h2>

<p>
    An infinite loop is a loop that never becomes False.
    It continues running until the program is stopped.
</p>

${codeBlock(`while True:
    print("This is an infinite loop")`, "Python")}

<p>
    Infinite loops can be useful for programs that need to keep
    running until a specific event occurs, but they must be
    controlled carefully.
</p>


<h2>
    Loop Control Statements
</h2>

<p>
    Python provides three important statements for controlling
    the execution of loops:
</p>

<ul>
    <li><b>break</b> – Stops the loop immediately.</li>
    <li><b>continue</b> – Skips the current iteration.</li>
    <li><b>pass</b> – Does nothing and acts as a placeholder.</li>
</ul>


<h2>
    3. break Statement
</h2>

<p>
    The <b>break</b> statement immediately terminates the loop,
    even if the loop condition is still True.
</p>

    if i == 5:
        break

    print(i)`, "Python")}

<h2>
    5. pass Statement
</h2>

<p>
    The <b>pass</b> statement does nothing. It is used as a
    placeholder when a statement is syntactically required

<h2>

    A function is a reusable block of code designed to perform
    a specific task. Functions help make programs organized,
    readable, and easier to maintain.

<p>
    Instead of writing the same code repeatedly, we can define
    it once inside a function and call it whenever required.

    followed by the function name and parentheses.

30
</div>


<h2>

</h2>

<ul>
    <li>Functions reduce code repetition.</li>
    <li>They make programs easier to understand.</li>
    <li>They make code reusable.</li>
    <li>They make debugging and maintenance easier.</li>
    <li>Large programs can be divided into smaller tasks.</li>
</ul>


<h2>
    Important Points to Remember
</h2>

    <li>A function runs when it is called.</li>
    <li>Parameters receive values passed to a function.</li>
    <li>Arguments are the actual values passed during the function call.</li>
    <li>Use <b>return</b> to send a value back from a function.</li>

<h2>

    more organized and easier to maintain. Functions can accept

    statement.

<h2>

<h2>

    in a single variable. Tuples are ordered and allow duplicate
    values.

    its elements cannot be changed, added, or removed.

<h2>

</h2>

<p>
    Since tuples are immutable, they have fewer methods than lists.

    <b>index()</b>.

<p>

    occurrence of a specified value.

</div>

</div>


<h2>

<h2>
    Tuple vs List
</h2>

<table>
    <tr>
        <th>Tuple</th>
        <th>List</th>
    </tr>
    <tr>
        <td>Usually created using ()</td>
        <td>Created using []</td>

    <tr>

    </tr>
    <tr>

    </tr>

    </tr>
</table>


<h2>
    When to Use a Tuple?
</h2>

<p>
    Tuples are useful when you have a collection of values that
    should not be changed during the execution of the program.
</p>

<p>
    For example, coordinates, fixed configuration values, and
    records containing related information can be stored using
    tuples.
</p>

${codeBlock(`coordinates = (19.0760, 72.8777)

print("Latitude:", coordinates[0])
print("Longitude:", coordinates[1])`, "Python")}

<div class="output-title">
    Output
</div>

<div class="output">
Latitude: 19.076<br>
Longitude: 72.8777
</div>


<h2>
    Important Points to Remember
</h2>

<ul>
    <li>Tuples are created using parentheses <b>()</b>.</li>
    <li>Tuples are ordered collections.</li>
    <li>Tuple indexing starts from <b>0</b>.</li>
    <li>Negative indexing is supported.</li>
    <li>Tuples are immutable.</li>
    <li>Tuples allow duplicate values.</li>
    <li>A tuple can contain different data types.</li>
    <li>A single-element tuple requires a comma.</li>
    <li>Tuples support slicing.</li>
    <li>The main tuple methods are <b>count()</b> and <b>index()</b>.</li>
    <li>Tuples support packing and unpacking.</li>
</ul>


<h2>
    Summary
</h2>

<p>
    A tuple is an ordered and immutable collection used to store
    multiple values. Tuples support indexing, slicing, looping,
    packing, unpacking, and several useful operations. Because
    tuples cannot be modified after creation, they are useful for
    storing data that should remain fixed.
</p>

<h2>

<p>

<h2>

</h2>

<p>
    Dictionary comprehension provides a short way to create
    dictionaries using an expression and a loop.
</p>

<h3>
    Syntax
</h3>

${codeBlock(`{key: value for item in iterable}`, "Python")}


<h3>
    Example
</h3>

${codeBlock(`numbers = [1, 2, 3, 4, 5]

}

}

<h2>
    Dictionary Methods Summary
</h2>

<table>
    <tr>
        <th>Method</th>
        <th>Purpose</th>
    </tr>
    <tr>
        <td>get()</td>
        <td>Returns the value of a specified key.</td>
    </tr>
    <tr>
        <td>keys()</td>
        <td>Returns all keys.</td>
    </tr>
    <tr>
        <td>values()</td>
        <td>Returns all values.</td>
    </tr>
    <tr>
        <td>items()</td>
        <td>Returns all key-value pairs.</td>
    </tr>
    <tr>
        <td>update()</td>
        <td>Adds or updates key-value pairs.</td>
    </tr>
    <tr>
        <td>pop()</td>
        <td>Removes a specified key.</td>
    </tr>
    <tr>
        <td>popitem()</td>
        <td>Removes the last key-value pair.</td>
    </tr>
    <tr>
        <td>clear()</td>
        <td>Removes all items.</td>
    </tr>
    <tr>
        <td>copy()</td>
        <td>Creates a copy of the dictionary.</td>
    </tr>
    <tr>
        <td>fromkeys()</td>
        <td>Creates a dictionary from specified keys.</td>
    </tr>
</table>


<h2>
    Important Points to Remember
</h2>

<ul>
    <li>Dictionaries store data in <b>key-value pairs</b>.</li>
    <li>Dictionaries are created using <b>{}</b>.</li>
    <li>Keys must be unique.</li>
    <li>Values can be of different data types.</li>
    <li>Dictionaries are changeable.</li>
    <li>Values are accessed using their keys.</li>
    <li>Use <b>get()</b> to safely access a value.</li>
    <li>Use <b>update()</b> to add or modify items.</li>
    <li>Use <b>keys()</b>, <b>values()</b>, and <b>items()</b> to access dictionary data.</li>
    <li>Dictionaries can contain lists and other dictionaries.</li>
</ul>


<h2>
    Summary
</h2>

<p>

    information in key-value pairs. It allows us to quickly access,
    add, modify, and remove data using keys. Dictionaries are widely
    used for storing structured information such as student records,
    product details, user profiles, and configuration data.

/* =====================================================
   CREATE CODE BLOCK
===================================================== */

function codeBlock(code, language) {

    const id =
        "code_" +
        Math.random()
        .toString(36)
        .substring(2, 9);


    return `

        <div class="code-header">

            <span>
                ${language}
            </span>

            <button
                class="copy-btn"
                onclick="copyCode('${id}', this)">

                Copy

            </button>

        </div>


        <div class="code-box">

            <pre id="${id}">${escapeHTML(code.trim())}</pre>

        </div>

    `;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return text

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;");

}


/* =====================================================
   SHOW TOPIC
===================================================== */

function showTopic(topic, button) {


    document.getElementById("content").innerHTML =
        topics[topic];


    /* Remove active class */

    document
        .querySelectorAll(".topic")
        .forEach(function(item) {

            item.classList.remove("active");

        });


    /* Add active class */

    button.classList.add("active");


    /* Scroll content to top */

    document
        .querySelector(".content-area")
        .scrollTop = 0;


    /* Close mobile menu */

    if (window.innerWidth <= 700) {

        closeMenu();

    }

}


/* =====================================================
   COPY CODE
===================================================== */

function copyCode(id, button) {

    const code =
        document.getElementById(id).innerText;


    navigator.clipboard.writeText(code);


    button.innerText = "Copied!";


    setTimeout(function() {

        button.innerText = "Copy";

    }, 1500);

}


/* =====================================================
   OPEN / CLOSE MOBILE MENU
===================================================== */

function toggleMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.toggle("open");

    overlay.classList.toggle("show");

}


function closeMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    sidebar.classList.remove("open");

    overlay.classList.remove("show");

}


/* =====================================================
   LOAD FIRST TOPIC
===================================================== */

showTopic(
    "intro",
    document.querySelector(".topic")
);
